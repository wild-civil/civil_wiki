<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif" role="img">
<title>三种小角度近似的绝对误差对比</title>
<desc>零阶近似 sin theta 约为 0 的误差是一阶，cos theta 约为 1 是二阶，sin theta 约为 theta 是三阶。</desc>
