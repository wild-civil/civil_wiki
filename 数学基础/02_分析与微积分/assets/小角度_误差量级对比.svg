<text class="ttl" x="380.0" y="30.0" text-anchor="middle" >一阶 vs 二阶 vs 三阶：误差塌向 0 的速度差多少</text>
<text class="sub" x="380.0" y="51.0" text-anchor="middle" >纵轴为绝对误差，横轴为 θ（弧度）；三条曲线的「阶数」决定谁先贴到 0</text>
