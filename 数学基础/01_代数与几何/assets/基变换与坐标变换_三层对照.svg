<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">同一个矩阵，三层含义</text>

  <text x="40" y="76" font-size="13" fill="#5f6368">i 系（固定）</text>
  <text x="40" y="98" font-size="13" fill="#d93025">e 系（逆时针转 θ）</text>

  <line x1="200" y1="290" x2="370" y2="290" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="200" y1="290" x2="200" y2="120" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="200" y1="290" x2="330" y2="215" stroke="#d93025" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="200" y1="290" x2="125" y2="160" stroke="#d93025" stroke-width="1.8" marker-end="url(#ax)"/>
  <path d="M 252 290 A 52 52 0 0 0 245 264" fill="none" stroke="#9aa0a6" stroke-width="1.1"/>
  <text x="258" y="278" font-size="13" fill="#5f6368">θ</text>
  <text x="376" y="294" font-size="13" fill="#5f6368">X</text>
  <text x="192" y="114" font-size="13" fill="#5f6368">Y</text>
  <text x="336" y="211" font-size="13" fill="#d93025">x</text>
  <text x="111" y="154" font-size="13" fill="#d93025">y</text>
  <text x="284" y="308" font-size="13" fill="#5f6368">i₁</text>
  <text x="182" y="180" font-size="13" fill="#5f6368">i₂</text>
  <text x="288" y="266" font-size="13" fill="#d93025">e₁</text>
  <text x="136" y="212" font-size="13" fill="#d93025">e₂</text>
  <text x="182" y="308" font-size="13" fill="#5f6368">O</text>
  <text x="40" y="362" font-size="12.5" fill="#3c4043">e₁ = cosθ · i₁ + sinθ · i₂</text>

  <rect x="430" y="70" width="400" height="78" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.1"/>
  <text x="448" y="96" font-size="14" font-weight="700" fill="#174ea6">① 坐标分量（被动：向量不动，换读数）</text>
  <text x="448" y="118" font-size="12.5" fill="#174ea6" font-family="Consolas,Monaco,monospace">i → e ： v^e = C_i^e · v^i</text>
  <text x="448" y="138" font-size="12.5" fill="#174ea6" font-family="Consolas,Monaco,monospace">e → i ： v^i = (C_i^e)^T · v^e</text>

  <rect x="430" y="160" width="400" height="78" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.1"/>
  <text x="448" y="186" font-size="14" font-weight="700" fill="#a50e0e">② 几何转动（坐标轴真的转过去）</text>
  <text x="448" y="208" font-size="12.5" fill="#a50e0e" font-family="Consolas,Monaco,monospace">i → e 逆时针 +θ ： 用 (C_i^e)^T</text>
  <text x="448" y="228" font-size="12.5" fill="#a50e0e" font-family="Consolas,Monaco,monospace">e → i 顺时针 −θ ： 用 C_i^e</text>

  <rect x="430" y="250" width="400" height="78" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.1"/>
  <text x="448" y="276" font-size="14" font-weight="700" fill="#3c4043">③ 基展开（沿用图片的列堆写法）</text>
  <text x="448" y="298" font-size="12.5" fill="#3c4043" font-family="Consolas,Monaco,monospace">用 i 基表 e 基 ： 用 C_i^e</text>
  <text x="448" y="318" font-size="12.5" fill="#3c4043" font-family="Consolas,Monaco,monospace">用 e 基表 i 基 ： 用 (C_i^e)^T</text>

  <text x="430" y="362" font-size="12" fill="#80868b">坐标是基的对偶；正交让逆 = 转置，差别只在一个转置</text>
</svg>
