<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">华秋 DFM 阻抗计算截面示意图（GCPW 共面单端外层）</title>
  <desc id="desc">展示 1.2 mm 双面板共面单端阻抗模型的截面尺寸与参数：W1=26.50、W2=25.70、D1=8.00、H1=41.9291、Er1=4.2、T1=1.3780、C1=1.1969、C2=0.5000、CEr=3.5，计算结果 55.11 Ω。</desc>
  <style>
    .t { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #2c2c2a; }
    .th { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #2c2c2a; }
    .tc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5f5e5a; }
    .tm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #2c2c2a; }
    .dim { stroke: #444441; stroke-width: 0.75; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
    .leader { stroke: #5f5e5a; stroke-width: 0.5; fill: none; stroke-dasharray: 3,2; }
    .guide { stroke: #9e9e9e; stroke-width: 0.5; fill: none; stroke-dasharray: 2,2; }
    .note-line { stroke: #888; stroke-width: 0.5; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L5 5 L1 9" fill="none" stroke="#444441" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 主截面区域 -->
  <g transform="translate(25,55)">
    <text x="200" y="-36" class="th" text-anchor="middle">阻抗计算</text>

    <!-- 底层地平铜 -->
    <rect x="45" y="270" width="310" height="5" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>

    <!-- FR4 介质 -->
    <rect x="45" y="130" width="310" height="140" fill="#d9d9d9" stroke="#bdbdbd" stroke-width="0.5"/>
    <text x="200" y="200" class="t" text-anchor="middle" dominant-baseline="central">Er1</text>

    <!-- 顶层铜：左侧共面地（上边缘内倾） -->
    <path d="M 45 130 L 122 130 L 121 124 L 47 124 Z" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>
    <!-- 右侧共面地 -->
    <path d="M 278 130 L 355 130 L 353 124 L 279 124 Z" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>
    <!-- 中间信号线：梯形 W1 &gt; W2 -->
    <path d="M 204 130 L 216 130 L 214 124 L 206 124 Z" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>

    <!-- 绿油阻焊层：上表面沟槽处明显下凹，下表面紧贴铜顶 -->
    <path d="M 45 117
             L 121 117
             L 123 119
             L 127 124
             L 131 128
             L 202 128
             L 205 124
             L 209 119
             L 211 117
             L 213 117
             L 215 119
             L 219 124
             L 223 128
             L 294 128
             L 298 124
             L 302 119
             L 304 117
             L 355 117
             L 355 124
             L 279 124
             L 278 130
             L 279 130
             L 279 124
             L 216 124
             L 216 130
             L 204 130
             L 204 124
             L 122 124
             L 122 130
             L 45 130
             Z" fill="#66bb6a" fill-opacity="0.72" stroke="#388e3c" stroke-width="0.6"/>

    <!-- 顶层铜厚度参考虚线 -->
    <line x1="40" y1="124" x2="360" y2="124" class="guide"/>

    <!-- 尺寸标注 H1 -->
    <line x1="35" y1="130" x2="35" y2="275" class="dim"/>
    <text x="23" y="202" class="t" text-anchor="middle" dominant-baseline="central">H1</text>
    <line x1="35" y1="130" x2="45" y2="130" class="leader"/>
    <line x1="35" y1="275" x2="45" y2="275" class="leader"/>

    <!-- 尺寸标注 T1 -->
    <line x1="370" y1="124" x2="370" y2="130" class="dim"/>
    <text x="383" y="127" class="tc" dominant-baseline="central">T1</text>
    <line x1="360" y1="124" x2="370" y2="124" class="leader"/>
    <line x1="360" y1="130" x2="370" y2="130" class="leader"/>

    <!-- 尺寸标注 C1：右侧沟槽处阻焊厚度 -->
    <line x1="385" y1="117" x2="385" y2="130" class="dim"/>
    <text x="398" y="124" class="tc" dominant-baseline="central">C1</text>
    <line x1="360" y1="117" x2="385" y2="117" class="leader"/>
    <line x1="360" y1="130" x2="385" y2="130" class="leader"/>

    <!-- 尺寸标注 C2：信号线上方阻焊厚度 -->
    <line x1="310" y1="117" x2="310" y2="124" class="dim"/>
    <text x="323" y="121" class="tc" dominant-baseline="central">C2</text>
    <line x1="300" y1="117" x2="310" y2="117" class="leader"/>
    <line x1="300" y1="124" x2="310" y2="124" class="leader"/>

    <!-- W1 标注：信号线底部宽度 -->
    <line x1="204" y1="300" x2="216" y2="300" class="dim"/>
    <text x="210" y="314" class="t" text-anchor="middle">W1</text>
    <line x1="204" y1="300" x2="204" y2="130" class="leader"/>
    <line x1="216" y1="300" x2="216" y2="130" class="leader"/>

    <!-- W2 标注：信号线顶部宽度 -->
    <line x1="206" y1="70" x2="214" y2="70" class="dim"/>
    <text x="210" y="58" class="t" text-anchor="middle">W2</text>
    <line x1="206" y1="70" x2="206" y2="117" class="leader"/>
    <line x1="214" y1="70" x2="214" y2="117" class="leader"/>

    <!-- D1 标注：信号线到共面地间隙 -->
    <line x1="216" y1="300" x2="278" y2="300" class="dim"/>
    <text x="247" y="314" class="t" text-anchor="middle">D1</text>
    <line x1="216" y1="300" x2="216" y2="130" class="leader"/>
    <line x1="278" y1="300" x2="278" y2="130" class="leader"/>

    <!-- CEr 标注 -->
    <text x="65" y="107" class="tc">CEr</text>
    <line x1="77" y1="109" x2="90" y2="115" class="note-line"/>
  </g>

  <!-- 参数表 -->
  <g transform="translate(420,55)">
    <text x="110" y="-36" class="th" text-anchor="middle">参数</text>
    <rect x="0" y="-14" width="235" height="285" fill="#f8f8f8" stroke="#d3d1c7" stroke-width="0.5" rx="6"/>
    <g transform="translate(14,16)">
      <text x="0" y="0" class="t">设计线宽</text><text x="130" y="0" class="tm">W1 = 26.50</text>
      <text x="0" y="25" class="t">线面宽度</text><text x="130" y="25" class="tm">W2 = 25.70</text>
      <text x="0" y="50" class="t">到铜距离</text><text x="130" y="50" class="tm">D1 = 8.00</text>
      <text x="0" y="75" class="t">上参考厚度</text><text x="130" y="75" class="tm">H1 = 41.9291</text>
      <text x="0" y="100" class="t">板材介电常数</text><text x="130" y="100" class="tm">Er1 = 4.2000</text>
      <text x="0" y="125" class="t">铜箔厚度</text><text x="130" y="125" class="tm">T1 = 1.3780</text>
      <text x="0" y="150" class="t">基材上阻焊</text><text x="130" y="150" class="tm">C1 = 1.1969</text>
      <text x="0" y="175" class="t">铜箔上阻焊</text><text x="130" y="175" class="tm">C2 = 0.5000</text>
      <text x="0" y="200" class="t">阻焊介电常数</text><text x="130" y="200" class="tm">CEr = 3.5000</text>
    </g>
    <rect x="14" y="235" width="68" height="25" fill="#ffffff" stroke="#bdbdbd" stroke-width="0.5" rx="4"/>
    <text x="48" y="250" class="tc" text-anchor="middle" dominant-baseline="central">配置</text>
    <rect x="92" y="235" width="68" height="25" fill="#66bb6a" stroke="#388e3c" stroke-width="0.5" rx="4"/>
    <text x="126" y="250" class="t" text-anchor="middle" dominant-baseline="central" fill="#ffffff">计算</text>
    <text x="174" y="250" class="th" dominant-baseline="central">55.11 Ω</text>
  </g>
</svg>