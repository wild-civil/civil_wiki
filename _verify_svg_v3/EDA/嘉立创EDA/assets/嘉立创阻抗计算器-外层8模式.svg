<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="嘉立创阻抗计算器外层 8 种模式结构对照">
  <style>
    .lab { font: 600 12px "Source Sans Pro","Microsoft YaHei",sans-serif; fill:#222; }
    .cap { font: 500 11px "Source Sans Pro","Microsoft YaHei",sans-serif; fill:#333; }
    .hd  { font: 700 14px "Source Sans Pro","Microsoft YaHei",sans-serif; fill:#1a1a1a; }
    .sub { font: 500 10px "Source Sans Pro","Microsoft YaHei",sans-serif; fill:#555; }
