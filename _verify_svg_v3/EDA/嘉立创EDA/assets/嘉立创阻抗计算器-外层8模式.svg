  <!-- 顶部标题 -->
  <text x="550" y="26" text-anchor="middle" class="hd">嘉立创阻抗计算器 · 外层 8 种模式截面结构</text>
  <text x="550" y="44" text-anchor="middle" class="sub">行=防焊处理（带/不带），列=微带/共面波导 × 单端/差分</text>

  <!-- 列头 -->
