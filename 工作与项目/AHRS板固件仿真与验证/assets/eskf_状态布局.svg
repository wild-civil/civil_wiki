<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img">
<title>15 维误差状态与标称状态</title>
<desc>误差态 dx(15)=[δθ3,δp3,δv3,δbg3,δba3]; 标称态={q,p,v,bg,ba}</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2937">误差状态 dx(15) 与 标称状态</text>
<text x="340" y="44" text-anchor="middle" font-size="12" fill="#444">ESKF 两层状态: 标称态是真实量, 误差态才是被卡尔曼滤波估计的 15 维</text>
<text x="60" y="74" font-size="12" font-weight="500" fill="#185FA5">误差态 dx</text>
<g>
<rect x="70" y="84" width="98" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<line x1="102.6" y1="84" x2="102.6" y2="136" stroke="#185FA5" stroke-width="0.3"/>
<line x1="135.3" y1="84" x2="135.3" y2="136" stroke="#185FA5" stroke-width="0.3"/>
<text x="119" y="114" text-anchor="middle" font-size="13" fill="#0C447C">δθ(3)</text>
<text x="119" y="76" text-anchor="middle" font-size="11" fill="#444">姿态角</text>
</g>
<g>
<rect x="182" y="84" width="98" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="214.6" y1="84" x2="214.6" y2="136" stroke="#0F6E56" stroke-width="0.3"/>
<line x1="247.3" y1="84" x2="247.3" y2="136" stroke="#0F6E56" stroke-width="0.3"/>
<text x="231" y="114" text-anchor="middle" font-size="13" fill="#085041">δp(3)</text>
<text x="231" y="76" text-anchor="middle" font-size="11" fill="#444">位置</text>
</g>
<g>
<rect x="294" y="84" width="98" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<line x1="326.6" y1="84" x2="326.6" y2="136" stroke="#534AB7" stroke-width="0.3"/>
<line x1="359.3" y1="84" x2="359.3" y2="136" stroke="#534AB7" stroke-width="0.3"/>
<text x="343" y="114" text-anchor="middle" font-size="13" fill="#3C3489">δv(3)</text>
<text x="343" y="76" text-anchor="middle" font-size="11" fill="#444">速度</text>
</g>
<g>
<rect x="406" y="84" width="98" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<line x1="438.6" y1="84" x2="438.6" y2="136" stroke="#854F0B" stroke-width="0.3"/>
<line x1="471.3" y1="84" x2="471.3" y2="136" stroke="#854F0B" stroke-width="0.3"/>
<text x="455" y="114" text-anchor="middle" font-size="13" fill="#633806">δbg(3)</text>
<text x="455" y="76" text-anchor="middle" font-size="11" fill="#444">陀螺零偏</text>
</g>
<g>
<rect x="518" y="84" width="98" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<line x1="550.6" y1="84" x2="550.6" y2="136" stroke="#993C1D" stroke-width="0.3"/>
<line x1="583.3" y1="84" x2="583.3" y2="136" stroke="#993C1D" stroke-width="0.3"/>
<text x="567" y="114" text-anchor="middle" font-size="13" fill="#712B13">δba(3)</text>
<text x="567" y="76" text-anchor="middle" font-size="11" fill="#444">加计零偏</text>
</g>
<line x1="340" y1="146" x2="340" y2="172" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="162" font-size="12" fill="#444">dx 注入 -> 修正标称</text>
<text x="60" y="194" font-size="12" font-weight="500" fill="#5F5E5A">标称态 x</text>
<g>
<rect x="70" y="202" width="98" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="119" y="232" text-anchor="middle" font-size="13" fill="#2C2C2A">q(4)</text>
<text x="119" y="194" text-anchor="middle" font-size="11" fill="#444">四元数</text>
</g>
<g>
<rect x="182" y="202" width="98" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="231" y="232" text-anchor="middle" font-size="13" fill="#2C2C2A">p(3)</text>
</g>
<g>
<rect x="294" y="202" width="98" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="343" y="232" text-anchor="middle" font-size="13" fill="#2C2C2A">v(3)</text>
</g>
<g>
<rect x="406" y="202" width="98" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="455" y="232" text-anchor="middle" font-size="13" fill="#2C2C2A">bg(3)</text>
</g>
<g>
<rect x="518" y="202" width="98" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="567" y="232" text-anchor="middle" font-size="13" fill="#2C2C2A">ba(3)</text>
</g>
<text x="340" y="282" text-anchor="middle" font-size="12" fill="#444">标称态: 实际姿态/位置/速度/零偏;  误差态: 围绕标称的小扰动, 滤波估计它</text>
</svg>