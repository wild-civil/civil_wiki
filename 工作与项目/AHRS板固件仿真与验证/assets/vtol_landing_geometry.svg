<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" role="img">
<title>尾坐式降落与复合翼水平降落对照</title>
<desc>左侧为 gen_data / gen_data2 当前合成轨迹的尾坐式垂直降落（机头朝天、垂直下落）；右侧为复合翼 VTOL 典型的多旋翼水平姿态垂直降落（机头近水平、升力桨朝上）。</desc>
<rect x="0" y="0" width="680" height="450" fill="#ffffff"/>
<defs>
<marker id="mred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="30" width="285" height="400" rx="14" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="60" y="54" font-size="14" font-weight="700" fill="#0c447c">A · 当前两条合成轨迹：尾坐式降落</text>
<text x="60" y="74" font-size="12" fill="#185fa5">机头朝天、垂直下落（沿用 gen_data.py 的设计）</text>

<line x1="170" y1="110" x2="170" y2="140" stroke="#a32d2d" stroke-width="2.5" marker-end="url(#mred)"/>
<text x="186" y="128" font-size="12" fill="#791f1f">机头 = 竖直向上</text>
<rect x="158" y="140" width="24" height="88" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="160" y="190" font-size="11" fill="#5f5e5a">机体</text>
<line x1="170" y1="228" x2="170" y2="330" stroke="#5f5e5a" stroke-width="2" marker-end="url(#mgray)"/>
<text x="186" y="290" font-size="12" fill="#444441">速度：垂直向下</text>
<line x1="60" y1="352" x2="310" y2="352" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="60" y="344" font-size="11" fill="#5f5e5a">地面</text>
<text x="60" y="382" font-size="11" fill="#444441">α = 180°：机头与速度反向</text>
<text x="60" y="400" font-size="11" fill="#444441">→ 下落时机头必然朝天（尾坐）</text>
<text x="60" y="418" font-size="11" fill="#5f5e5a">gen_data2：735 m → 1.3 m 垂直下落</text>

<rect x="355" y="30" width="285" height="400" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="375" y="54" font-size="14" font-weight="700" fill="#085041">B · 复合翼 VTOL 典型：水平姿态降落</text>
<text x="375" y="74" font-size="12" fill="#0f6e56">机身近水平（多旋翼模式）垂直下落</text>

<line x1="462" y1="186" x2="458" y2="162" stroke="#0f6e56" stroke-width="1.5"/>
<line x1="534" y1="186" x2="538" y2="162" stroke="#0f6e56" stroke-width="1.5"/>
<text x="474" y="154" font-size="11" fill="#0f6e56">升力桨朝上</text>
<rect x="452" y="186" width="92" height="24" rx="9" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="544" y1="198" x2="574" y2="198" stroke="#a32d2d" stroke-width="2.5" marker-end="url(#mred)"/>
<text x="576" y="190" font-size="12" fill="#791f1f">机头近水平</text>
<line x1="498" y1="210" x2="498" y2="330" stroke="#5f5e5a" stroke-width="2" marker-end="url(#mgray)"/>
<text x="514" y="300" font-size="12" fill="#444441">垂直下落</text>
<line x1="375" y1="352" x2="625" y2="352" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="375" y="344" font-size="11" fill="#5f5e5a">地面</text>
<text x="375" y="382" font-size="11" fill="#444441">下滑减速 → 过渡到多旋翼模式</text>
<text x="375" y="400" font-size="11" fill="#444441">（机头放平）→ 水平姿态垂直下落</text>
<text x="375" y="418" font-size="11" fill="#5f5e5a">触地：起落架 / 机身水平落地</text>
</svg>
