<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>状态反馈 + 观测器的闭环结构（分离原理）</title>
  <desc>控制律用估计状态 x̂ 计算 u = −Kx̂，被控对象输出 y；观测器由 u 和 y 重建 x̂，两者可独立设计。</desc>

  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a7g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1d9e75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="26" fill="#333333" font-size="15">状态反馈 + Luenberger 观测器：u = −Kx̂</text>
  <text x="20" y="44" fill="#5f5e5a" font-size="11">状态测不全时，用观测器估一个 x̂ 代替 x —— 分离原理保证两块可以分开设计</text>

  <!-- 主链 -->
  <rect x="90" y="57" width="66" height="46" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.6"/>
  <text x="123" y="86" fill="#185fa5" font-size="14" text-anchor="middle">−K</text>
  <text x="123" y="120" fill="#5f5e5a" font-size="10" text-anchor="middle">控制器</text>

  <line x1="156" y1="80" x2="280" y2="80" stroke="#333333" stroke-width="1.4" marker-end="url(#a7)"/>
  <text x="208" y="72" fill="#333333" font-size="12">u</text>

  <rect x="280" y="45" width="160" height="70" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.6"/>
  <text x="360" y="74" fill="#333333" font-size="12" text-anchor="middle">被控对象</text>
  <text x="360" y="94" fill="#5f5e5a" font-size="11" text-anchor="middle">ẋ = Ax + Bu,  y = Cx</text>

  <line x1="440" y1="80" x2="620" y2="80" stroke="#333333" stroke-width="1.4" marker-end="url(#a7)"/>
  <text x="628" y="85" fill="#333333" font-size="14">y</text>
  <circle cx="505" cy="80" r="3.5" fill="#333333"/>

  <!-- u 分支进观测器 -->
  <line x1="230" y1="80" x2="230" y2="258" stroke="#333333" stroke-width="1.3"/>
  <circle cx="230" cy="80" r="3" fill="#333333"/>
  <line x1="230" y1="258" x2="280" y2="258" stroke="#333333" stroke-width="1.3" marker-end="url(#a7)"/>
  <text x="238" y="170" fill="#5f5e5a" font-size="11">同一个 u</text>

  <!-- y 分支进观测器 -->
  <line x1="505" y1="80" x2="505" y2="258" stroke="#1d9e75" stroke-width="1.3"/>
  <line x1="505" y1="258" x2="440" y2="258" stroke="#1d9e75" stroke-width="1.3" marker-end="url(#a7g)"/>
  <text x="512" y="170" fill="#1d9e75" font-size="11">量测 y</text>

  <!-- 观测器 -->
  <rect x="280" y="220" width="160" height="76" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1.6"/>
  <text x="360" y="246" fill="#1d9e75" font-size="12" text-anchor="middle">观测器</text>
  <text x="360" y="266" fill="#333333" font-size="11" text-anchor="middle">x̂̇ = Ax̂ + Bu + L(y − ŷ)</text>
  <text x="360" y="285" fill="#5f5e5a" font-size="10" text-anchor="middle">误差 ė = (A − LC)e</text>

  <!-- xhat 回线（从观测器底部引出，避免与 u 分支共点） -->
  <line x1="360" y1="296" x2="360" y2="310" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="360" y1="310" x2="40" y2="310" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="310" x2="40" y2="80" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="80" x2="90" y2="80" stroke="#185fa5" stroke-width="1.5" marker-end="url(#a7)"/>
  <text x="48" y="150" fill="#185fa5" font-size="12">x̂（估计状态）</text>
  <text x="48" y="168" fill="#5f5e5a" font-size="10">回给控制器当 x 用</text>

  <!-- 说明 -->
  <text x="20" y="330" fill="#5f5e5a" font-size="11">分离原理：闭环极点由 eig(A − BK)（控制器）与 eig(A − LC)（观测器）两组共同组成，互不干扰。</text>
  <text x="20" y="348" fill="#888780" font-size="11">跟踪问题再加前馈 N̄·r；本图是调节器形式（r = 0）。</text>
</svg>
