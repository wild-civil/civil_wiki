<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>二阶系统不同阻尼比的阶跃响应</title>
  <desc>阻尼比越小超调越大；阻尼比大于等于 1 时无超调。</desc>
  <text x="30.0" y="30.0" fill="#333333" font-size="15" text-anchor="start">二阶阶跃响应：ζ 管“超不超调”，ω_n 管“快不快”</text>
  <text x="30.0" y="44.0" fill="#5f5e5a" font-size="12" text-anchor="start">这里取 ω_n = 1 rad/s，只改变 ζ</text>
