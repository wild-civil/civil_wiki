<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PID 控制器的结构框图</title>
  <desc>参考输入与反馈相减得到误差，误差分别经过比例、积分、微分三条支路后相加，再送入被控对象。</desc>
  <text x="30" y="28" fill="#333333" font-size="15" text-anchor="start">PID 结构：三条支路并行，输出相加</text>
  <text x="30" y="50" fill="#5f5e5a" font-size="12" text-anchor="start">P 管“现在”，I 管“过去”，D 管“未来”</text>
  <text x="36" y="154" fill="#333333" font-size="13" text-anchor="start">r</text>
  <line x1="45" y1="150" x2="100" y2="150" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <circle cx="118" cy="150" r="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="118" y="155" fill="#333333" font-size="15" text-anchor="middle">Σ</text>
  <text x="108" y="138" fill="#333333" font-size="12" text-anchor="middle">+</text>
  <text x="108" y="172" fill="#333333" font-size="13" text-anchor="middle">−</text>
  <line x1="134" y1="150" x2="185" y2="150" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="150" y="142" fill="#333333" font-size="12" text-anchor="start">e</text>
  <line x1="185" y1="90" x2="185" y2="210" stroke="#333333" stroke-width="1.2"/>
  <line x1="185" y1="90" x2="195" y2="90" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="185" y1="150" x2="195" y2="150" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="185" y1="210" x2="195" y2="210" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="195" y="70" width="95" height="40" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="242" y="95" fill="#185fa5" font-size="13" text-anchor="middle">P  Kp·e</text>
  <rect x="195" y="130" width="95" height="40" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="242" y="155" fill="#1d9e75" font-size="13" text-anchor="middle">I  Ki∫e</text>
  <rect x="195" y="190" width="95" height="40" rx="8" fill="#faeedc" stroke="#ba7517" stroke-width="1.5"/>
  <text x="242" y="215" fill="#ba7517" font-size="13" text-anchor="middle">D  Kd·de/dt</text>
  <line x1="290" y1="90" x2="330" y2="90" stroke="#333333" stroke-width="1.2"/>
  <line x1="290" y1="150" x2="330" y2="150" stroke="#333333" stroke-width="1.2"/>
  <line x1="290" y1="210" x2="330" y2="210" stroke="#333333" stroke-width="1.2"/>
  <line x1="330" y1="90" x2="330" y2="210" stroke="#333333" stroke-width="1.2"/>
  <line x1="330" y1="150" x2="345" y2="150" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <circle cx="362" cy="150" r="16" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="362" y="155" fill="#333333" font-size="15" text-anchor="middle">Σ</text>
  <text x="352" y="138" fill="#333333" font-size="12" text-anchor="middle">+</text>
  <line x1="378" y1="150" x2="405" y2="150" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="390" y="142" fill="#333333" font-size="12" text-anchor="start">u</text>
  <rect x="405" y="125" width="120" height="50" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
  <text x="465" y="148" fill="#333333" font-size="13" text-anchor="middle">被控对象</text>
  <text x="465" y="166" fill="#5f5e5a" font-size="12" text-anchor="middle">G(s)</text>
  <line x1="525" y1="150" x2="600" y2="150" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="590" y="142" fill="#333333" font-size="12" text-anchor="start">y</text>
  <line x1="560" y1="150" x2="560" y2="250" stroke="#333333" stroke-width="1.2"/>
  <line x1="560" y1="250" x2="118" y2="250" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="118" y1="250" x2="118" y2="166" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="330" y="266" fill="#5f5e5a" font-size="12" text-anchor="middle">反馈（负反馈）</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
