<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">IEEE 754 浮点数的位布局：float（32 位）与 double（64 位）</text>

  <!-- ============ float ============ -->
  <g transform="translate(0, 10)">
    <text x="60" y="68" font-size="14" font-weight="700" fill="#202124">float（单精度，32 位）</text>
    
    <!-- 矩形条 -->
    <rect x="60" y="82" width="18.75" height="48" fill="#ea4335"/>
    <rect x="78.75" y="82" width="150" height="48" fill="#1a73e8"/>
    <rect x="228.75" y="82" width="431.25" height="48" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>

    <!-- 内部/上方短标识 -->
    <text x="69" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#ea4335">S</text>
    <text x="153.75" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Exponent (8)</text>
    <text x="444.37" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#174ea6">Fraction / Mantissa (23)</text>

    <!-- 下方说明文字 (错开对齐，防止重叠) -->
    <text x="60" y="152" font-size="11" fill="#c5221f" font-weight="600">① 符号 1 位</text>
    <text x="160" y="152" font-size="11" fill="#174ea6" font-weight="600">② 指数 8 位（偏移 127）</text>
    <text x="350" y="152" font-size="11" fill="#174ea6" font-weight="600">③ 尾数 23 位（隐含 1 位）</text>
    
    <text x="360" y="174" text-anchor="middle" font-size="11.5" fill="#5f6368">有效数字 ≈ 7 位 · 范围 ±3.4e38 · 最小正规格化 ≈ 1.2e-38</text>
  </g>

  <!-- ============ double ============ -->
  <g transform="translate(0, 30)">
    <text x="60" y="228" font-size="14" font-weight="700" fill="#202124">double（双精度，64 位）</text>
    
    <!-- 矩形条 -->
    <rect x="60" y="242" width="9.375" height="48" fill="#ea4335"/>
    <rect x="69.375" y="242" width="103.125" height="48" fill="#1a73e8"/>
    <rect x="172.5" y="242" width="487.5" height="48" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>

    <!-- 内部/上方短标识 -->
    <text x="64.6" y="236" text-anchor="middle" font-size="10" font-weight="700" fill="#ea4335">S</text>
    <text x="120.9" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Exp (11)</text>
    <text x="416.25" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#174ea6">Fraction / Mantissa (52)</text>

    <!-- 下方说明文字 (采用左对齐列表，彻底解决横向挤压重叠) -->
    <text x="60" y="312" font-size="11" fill="#c5221f" font-weight="600">① 符号 1 位</text>
    <text x="150" y="312" font-size="11" fill="#174ea6" font-weight="600">② 指数 11 位（偏移 1023）</text>
    <text x="340" y="312" font-size="11" fill="#174ea6" font-weight="600">③ 尾数 52 位（隐含 1 位）</text>
    
    <text x="360" y="334" text-anchor="middle" font-size="11.5" fill="#5f6368">有效数字 ≈ 15～16 位 · 范围 ±1.8e308 · 最小正规格化 ≈ 2.2e-308</text>
  </g>

  <!-- ============ 底部总结 ============ -->
  <g transform="translate(0, 20)">
    <line x1="60" y1="380" x2="660" y2="380" stroke="#f1f3f4" stroke-width="1.5"/>
    <text x="60" y="404" font-size="11.5" stroke-width="0.5" fill="#3c4043">💡 <tspan font-weight="700">精度与范围：</tspan>位数越多表达越「密」（精度）；范围由指数位数决定。</text>
    <text x="60" y="426" font-size="11.5" fill="#5f6368">例：3.14f 实际存储为 3.1400001049…（最近的可表示的二进制值）；</text>
    <text x="60" y="446" font-size="11.5" fill="#5f6368">0.1 在二进制中是无限循环小数，有限位数只能近似表示，这就是 0.1 + 0.2 ≠ 0.3 的根源。</text>
  </g>
</svg>
