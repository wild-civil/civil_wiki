<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">8 位补码的数轴环：加 1 到 127 之后回绕到 -128</text>

  <!-- 圆环 -->
  <circle cx="360" cy="248" r="150" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <circle cx="360" cy="248" r="104" fill="none" stroke="#dadce0" stroke-width="1"/>

  <!-- 顺时针方向箭头（环外） -->
  <path d="M 522 214 A 152 152 0 0 1 508 182" fill="none" stroke="#1a73e8" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a73e8"/>
    </marker>
  </defs>
  <text x="545" y="190" font-size="13" fill="#1a73e8" font-weight="600">+1 方向</text>

  <!-- 环上标记：0° 起顺时针 45° 一步 -->
  <!-- 0 (0度/右) -->
  <circle cx="510" cy="248" r="5" fill="#1a73e8"/>
  <text x="510" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">0</text>
  <text x="510" y="300" text-anchor="middle" font-size="10" fill="#5f6368">00000000</text>
  <!-- 1 (45度) -->
  <circle cx="466" cy="332" r="5" fill="#1a73e8"/>
  <text x="466" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#174ea6">1</text>
  <text x="466" y="392" text-anchor="middle" font-size="10" fill="#5f6368">00000001</text>
  <!-- 63 (90度/下) -->
  <circle cx="360" cy="398" r="5" fill="#1a73e8"/>
  <text x="360" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#174ea6">63</text>
  <!-- 127 (135度) -->
  <circle cx="254" cy="332" r="5" fill="#34a853"/>
  <text x="254" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#137333">127</text>
  <text x="254" y="348" text-anchor="middle" font-size="10" fill="#5f6368">01111111</text>
  <!-- -128 (180度/左) -->
  <circle cx="210" cy="248" r="6" fill="#ea4335"/>
  <text x="210" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#c5221f">-128</text>
  <text x="210" y="278" text-anchor="middle" font-size="10" fill="#5f6368">10000000</text>
  <!-- -127 (225度) -->
  <circle cx="254" cy="164" r="5" fill="#ea4335"/>
  <text x="254" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#c5221f">-127</text>
  <!-- -64 (270度/上) -->
  <circle cx="360" cy="98" r="5" fill="#ea4335"/>
  <text x="360" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#c5221f">-64</text>
  <!-- -1 (315度) -->
  <circle cx="466" cy="164" r="5" fill="#ea4335"/>
  <text x="466" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#c5221f">-1</text>
  <text x="466" y="196" text-anchor="middle" font-size="10" fill="#5f6368">11111111</text>

  <!-- 中心说明 -->
  <text x="360" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">模 2⁸ = 256</text>
  <text x="360" y="258" text-anchor="middle" font-size="12" fill="#5f6368">-128 + 127 + 1 = 256 个值</text>
  <text x="360" y="278" text-anchor="middle" font-size="12" fill="#5f6368">127 + 1 回绕到 -128</text>

  <text x="360" y="448" text-anchor="middle" font-size="11" fill="#80868b">补码 = 模 256 下的余数表示：-1 就是 255（11111111），-128 就是 128（10000000）</text>
</svg>
