<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" role="img">
  <title>PMOS 背靠背防倒灌：D-D（正确）vs S-S（错误）</title>
  <desc>左侧 D-D 背靠背，体二极管向外反向串联，关断双向阻断；右侧 S-S 对接，体二极管同向指向中间，VIN 高时形成倒灌通路。</desc>
  <defs>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b6d11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2c2c2a">PMOS 背靠背防倒灌：D-D 正确 vs S-S 错误</text>

  <!-- ================= LEFT : D-D ================= -->
  <rect x="20" y="34" width="310" height="356" rx="12" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
  <text x="175" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500a">图1 D-D 背靠背（正确）</text>

  <text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854f0b">V_Solar+</text>
  <line x1="90" y1="86" x2="90" y2="96" stroke="#854f0b" stroke-width="1.5"/>

  <!-- Q1 -->
  <rect x="80" y="96" width="20" height="78" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
  <line x1="60" y1="135" x2="80" y2="135" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="50" y="139" font-family="sans-serif" font-size="12" fill="#5f5e5a">G</text>
  <text x="106" y="108" font-family="sans-serif" font-size="11" fill="#2c2c2a">S</text>
  <text x="106" y="170" font-family="sans-serif" font-size="11" fill="#2c2c2a">D</text>
  <!-- Q1 body diode (up: middle->V_Solar+) -->
  <path d="M138 110 L131 170 L145 170 Z" fill="#a32d2d"/>
  <line x1="127" y1="110" x2="149" y2="110" stroke="#a32d2d" stroke-width="1.5"/>
  <text x="152" y="126" font-family="sans-serif" font-size="10" fill="#a32d2d">D→S</text>

  <line x1="90" y1="174" x2="260" y2="174" stroke="#2c2c2a" stroke-width="1.5"/>
  <circle cx="175" cy="174" r="3" fill="#2c2c2a"/>
  <text x="175" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2c2c2a">中间节点</text>

  <!-- Q2 -->
  <rect x="250" y="174" width="20" height="78" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
  <line x1="230" y1="213" x2="250" y2="213" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="220" y="217" font-family="sans-serif" font-size="12" fill="#5f5e5a">G</text>
  <text x="276" y="186" font-family="sans-serif" font-size="11" fill="#2c2c2a">D</text>
  <text x="276" y="248" font-family="sans-serif" font-size="11" fill="#2c2c2a">S</text>
  <!-- Q2 body diode (down: middle->VIN) -->
  <path d="M298 240 L291 180 L305 180 Z" fill="#a32d2d"/>
  <line x1="287" y1="240" x2="309" y2="240" stroke="#a32d2d" stroke-width="1.5"/>
  <text x="312" y="212" font-family="sans-serif" font-size="10" fill="#a32d2d">D→S</text>

  <line x1="260" y1="252" x2="260" y2="262" stroke="#185fa5" stroke-width="1.5"/>
  <text x="260" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185fa5">VIN</text>

  <path d="M90 80 L90 174 L260 174 L260 262" fill="none" stroke="#3b6d11" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#aGreen)"/>
  <text x="175" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500a">导通：太阳能→VIN（绿）</text>
  <text x="175" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500a">关断：两体二极管背对背→双向阻断</text>

  <!-- ================= RIGHT : S-S ================= -->
  <rect x="350" y="34" width="310" height="356" rx="12" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
  <text x="505" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#791f1f">图2 S-S 对接（错误）</text>

  <text x="420" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854f0b">V_Solar+</text>
  <line x1="420" y1="86" x2="420" y2="96" stroke="#854f0b" stroke-width="1.5"/>

  <!-- Q1 -->
  <rect x="410" y="96" width="20" height="78" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
  <line x1="390" y1="135" x2="410" y2="135" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="380" y="139" font-family="sans-serif" font-size="12" fill="#5f5e5a">G</text>
  <text x="436" y="108" font-family="sans-serif" font-size="11" fill="#2c2c2a">D</text>
  <text x="436" y="170" font-family="sans-serif" font-size="11" fill="#2c2c2a">S</text>
  <!-- Q1 body diode (down: V_Solar+->middle) -->
  <path d="M468 160 L461 100 L475 100 Z" fill="#a32d2d"/>
  <line x1="457" y1="160" x2="479" y2="160" stroke="#a32d2d" stroke-width="1.5"/>
  <text x="482" y="132" font-family="sans-serif" font-size="10" fill="#a32d2d">D→S</text>

  <line x1="420" y1="174" x2="590" y2="174" stroke="#2c2c2a" stroke-width="1.5"/>
  <circle cx="505" cy="174" r="3" fill="#2c2c2a"/>
  <text x="505" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2c2c2a">中间节点</text>

  <!-- Q2 -->
  <rect x="580" y="174" width="20" height="78" rx="3" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
  <line x1="560" y1="213" x2="580" y2="213" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="550" y="217" font-family="sans-serif" font-size="12" fill="#5f5e5a">G</text>
  <text x="606" y="186" font-family="sans-serif" font-size="11" fill="#2c2c2a">S</text>
  <text x="606" y="248" font-family="sans-serif" font-size="11" fill="#2c2c2a">D</text>
  <!-- Q2 body diode (up: VIN->middle) -->
  <path d="M638 190 L631 250 L645 250 Z" fill="#a32d2d"/>
  <line x1="627" y1="190" x2="649" y2="190" stroke="#a32d2d" stroke-width="1.5"/>
  <text x="652" y="222" font-family="sans-serif" font-size="10" fill="#a32d2d">D→S</text>

  <line x1="590" y1="252" x2="590" y2="262" stroke="#185fa5" stroke-width="1.5"/>
  <text x="590" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185fa5">VIN</text>

  <path d="M590 278 L590 200 Q590 174 505 174 Q420 174 420 90" fill="none" stroke="#a32d2d" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aRed)"/>
  <text x="505" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791f1f">体二极管同向指向中间</text>
  <text x="505" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791f1f">VIN&gt;V_Solar+ 时倒灌（红）</text>

  <text x="340" y="412" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">红三角=体二极管方向　绿虚线=正常导通路径　红虚线弧=倒灌风险路径</text>
</svg>
