<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <title>Pierce 振荡器接法：MCU + 无源晶振 + 两颗负载电容</title>
  <desc>MCU 内部反相放大器，OSC_IN/OSC_OUT 之间跨接无源晶振 X1，两端各接一颗负载电容 C1、C2 到 GND。CL = (C1*C2)/(C1+C2) + Cstray。</desc>
  <defs>
    <marker id="pArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2 L8 5 L2 8" fill="none" stroke="#185fa5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2c2c2a">Pierce 振荡器：MCU 内反相器 + 外部无源晶振 + 两颗负载电容</text>

  <!-- MCU 盒子 -->
  <rect x="250" y="46" width="180" height="150" rx="10" fill="#f4f4f2" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2c2c2a">MCU / SoC</text>
  <text x="340" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">内部反相放大器</text>
  <polygon points="310,108 370,108 340,132" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="340" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">增益 + 反相</text>
  <text x="288" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#185fa5">OSC_IN</text>
  <text x="392" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#185fa5">OSC_OUT</text>

  <!-- 晶振跨接 -->
  <rect x="150" y="230" width="230" height="26" rx="3" fill="#eaf3de" stroke="#3b6d11" stroke-width="1.6"/>
  <text x="265" y="247" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#27500a">X1 无源晶振（如 8MHz / CL=12pF）</text>
  <line x1="160" y1="196" x2="160" y2="230" stroke="#2c2c2a" stroke-width="1.6"/>
  <line x1="370" y1="196" x2="370" y2="230" stroke="#2c2c2a" stroke-width="1.6"/>

  <!-- 输入侧 C1 -->
  <line x1="160" y1="258" x2="160" y2="290" stroke="#2c2c2a" stroke-width="1.6"/>
  <g>
    <line x1="160" y1="290" x2="160" y2="302" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="152" y1="302" x2="168" y2="302" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="160" y1="302" x2="160" y2="314" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="152" y1="314" x2="168" y2="314" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="160" y1="314" x2="160" y2="326" stroke="#2c2c2a" stroke-width="1.8"/>
  </g>
  <text x="98" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2c2c2a">C1</text>
  <text x="98" y="336" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5f5e5a">负载电容</text>
  <line x1="160" y1="326" x2="160" y2="352" stroke="#2c2c2a" stroke-width="1.6"/>
  <line x1="60" y1="352" x2="260" y2="352" stroke="#3b3b39" stroke-width="1.4"/>
  <text x="320" y="356" font-family="sans-serif" font-size="11" fill="#3b3b39">GND</text>

  <!-- 输出侧 C2 -->
  <line x1="370" y1="258" x2="370" y2="290" stroke="#2c2c2a" stroke-width="1.6"/>
  <g>
    <line x1="370" y1="290" x2="370" y2="302" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="362" y1="302" x2="378" y2="302" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="370" y1="302" x2="370" y2="314" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="362" y1="314" x2="378" y2="314" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="370" y1="314" x2="370" y2="326" stroke="#2c2c2a" stroke-width="1.8"/>
  </g>
  <text x="430" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2c2c2a">C2</text>
  <text x="430" y="336" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5f5e5a">负载电容</text>
  <line x1="370" y1="326" x2="370" y2="352" stroke="#2c2c2a" stroke-width="1.6"/>

  <!-- 公式 -->
  <rect x="60" y="368" width="560" height="24" rx="6" fill="#eef4fb" stroke="#185fa5" stroke-width="0.8" transform="translate(0,-16)"/>
  <text x="340" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#185fa5" transform="translate(0,-14)">C_L = (C1·C2)/(C1+C2) + C_stray　→　取 C1=C2=C 时：C ≈ 2·(C_L − C_stray)</text>
</svg>