<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="100%" role="img">
  <title>减法器（差动放大器）电路</title>
  <desc>v1 经 R1 接到反相端，Rf 由输出反馈到反相端；v2 经 R2 接到同相端，R3 由同相端接地。当 Rf 比 R1 等于 R3 比 R2 时，输出等于 Rf/R1 乘以 v2 减 v1。R3 支路与 v1 输入线交叉处画了跨接弧，表示不相连。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="235" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">减法器 / 差动放大器</text>

  <path d="M190,60 V140 L280,100 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="206" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">+</text>
  <text x="206" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">−</text>

  <line x1="30" y1="120" x2="95" y2="120" stroke="currentColor" stroke-width="1.5"/>
  <rect x="95" y="113" width="40" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="135" y1="120" x2="190" y2="120" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="26" y="112" font-family="sans-serif" font-size="12" fill="currentColor">v<tspan font-size="9" dy="3">1</tspan></text>
  <text x="106" y="108" font-family="sans-serif" font-size="11" fill="currentColor">R1</text>

  <line x1="30" y1="80" x2="100" y2="80" stroke="currentColor" stroke-width="1.5"/>
  <rect x="100" y="73" width="40" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="140" y1="80" x2="190" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="26" y="72" font-family="sans-serif" font-size="12" fill="currentColor">v<tspan font-size="9" dy="3">2</tspan></text>
  <text x="111" y="68" font-family="sans-serif" font-size="11" fill="currentColor">R2</text>

  <circle cx="145" cy="80" r="3.5" fill="currentColor"/>
  <path d="M145,80 V112 A7,7 0 0,1 145,128 V150" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="138" y="150" width="14" height="24" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="145" y1="174" x2="145" y2="185" stroke="currentColor" stroke-width="1.5"/>
  <line x1="134" y1="185" x2="156" y2="185" stroke="currentColor" stroke-width="1.5"/>
  <line x1="138" y1="190" x2="152" y2="190" stroke="currentColor" stroke-width="1.5"/>
  <line x1="142" y1="195" x2="148" y2="195" stroke="currentColor" stroke-width="1.5"/>
  <text x="158" y="166" font-family="sans-serif" font-size="11" fill="currentColor">R3</text>

  <line x1="280" y1="100" x2="415" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="420" y="96" font-family="sans-serif" font-size="12" fill="currentColor">u<tspan font-size="9" dy="3">o</tspan></text>
  <circle cx="380" cy="100" r="3.5" fill="currentColor"/>

  <circle cx="175" cy="120" r="3.5" fill="currentColor"/>
  <path d="M175,120 V215 H380 V100" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="275" y="208" width="40" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="295" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">Rf</text>

  <text x="235" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">Rf/R1 = R3/R2 时，uo = (Rf/R1)(v2 − v1)；CMRR 由这 4 只电阻的匹配精度决定</text>
</svg>
