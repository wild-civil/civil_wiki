<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <style>
      .card-bg { fill: #f8f9fa; stroke: #e9ecef; stroke-width: 1.5; rx: 8px; }
      .title-text { font-size: 20px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .subtitle-text { font-size: 13px; fill: #6c757d; text-anchor: middle; }
      .card-title { font-size: 15px; font-weight: 700; fill: #2b303a; text-anchor: middle; }
      .desc-text { font-size: 12px; font-weight: 500; fill: #495057; text-anchor: middle; }
      .legend-text { font-size: 12px; font-weight: 600; fill: #333333; }
      .field-line { fill: none; stroke: #0284c7; stroke-width: 1.2; stroke-dasharray: 3,3; }
      .via-line { stroke: #059669; stroke-width: 1.5; stroke-dasharray: 2,2; }
      .via-pad { fill: #10b981; stroke: #047857; stroke-width: 1; }
    </style>
  </defs>

  <!-- 标题区 -->
  <text x="400" y="38" class="title-text">常见射频传输线截面对比 (RF Transmission Lines)</text>
  <text x="400" y="58" class="subtitle-text">PCB 高频电路设计常用传输线结构与电磁场分布简图</text>

  <!-- 顶部图例 -->
  <g transform="translate(160, 75)">
    <rect x="0" y="0" width="18" height="12" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="24" y="10" class="legend-text">介质基材</text>

    <rect x="110" y="0" width="18" height="12" rx="2" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    <text x="134" y="10" class="legend-text">信号导体 (Signal)</text>

    <rect x="260" y="0" width="18" height="12" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <text x="284" y="10" class="legend-text">地平面 (Ground)</text>

    <line x1="400" y1="6" x2="420" y2="6" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3,3"/>
    <text x="426" y="10" class="legend-text">电力线分布</text>
  </g>

  <!-- ① 微带线 Microstrip -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="355" height="200" class="card-bg"/>
    <text x="177" y="28" class="card-title">① 微带线 (Microstrip)</text>
    <rect x="57" y="70" width="240" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="37" y="140" width="280" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <rect x="157" y="58" width="40" height="12" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    <path d="M 170,70 Q 120,105 170,140" class="field-line"/>
    <path d="M 184,70 Q 184,105 184,140" class="field-line"/>
    <path d="M 198,70 Q 248,105 198,140" class="field-line"/>
    <text x="177" y="178" class="desc-text">顶层信号线 + 底层完整地 | 制造最简单，辐射稍大</text>
  </g>

  <!-- ② 带状线 Stripline -->
  <g transform="translate(415, 110)">
    <rect x="0" y="0" width="355" height="200" class="card-bg"/>
    <text x="177" y="28" class="card-title">② 带状线 (Stripline)</text>
    <rect x="37" y="52" width="280" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <rect x="57" y="64" width="240" height="76" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="157" y="97" width="40" height="10" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="37" y="140" width="280" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <path d="M 167,97 Q 140,80 167,64" class="field-line"/>
    <path d="M 187,97 Q 214,80 187,64" class="field-line"/>
    <path d="M 167,107 Q 140,124 167,140" class="field-line"/>
    <path d="M 187,107 Q 214,124 187,140" class="field-line"/>
    <text x="177" y="178" class="desc-text">信号夹于双地层之间 | 全屏蔽、无辐射，适合高密内层</text>
  </g>

  <!-- ③ 共面波导 CPW -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="355" height="200" class="card-bg"/>
    <text x="177" y="28" class="card-title">③ 共面波导 (CPW)</text>
    <rect x="57" y="70" width="240" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="57" y="58" width="75" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <rect x="157" y="58" width="40" height="12" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="222" y="58" width="75" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <path d="M 157,64 Q 142,82 132,64" class="field-line"/>
    <path d="M 157,70 Q 142,92 120,70" class="field-line"/>
    <path d="M 197,64 Q 212,82 222,64" class="field-line"/>
    <path d="M 197,70 Q 212,92 234,70" class="field-line"/>
    <text x="177" y="178" class="desc-text">顶层信号线 + 两侧共面地 (无底层地) | 色散小</text>
  </g>

  <!-- ④ 接地共面波导 GCPW -->
  <g transform="translate(415, 330)">
    <rect x="0" y="0" width="355" height="200" class="card-bg"/>
    <text x="177" y="28" class="card-title">④ 接地共面波导 (GCPW)</text>
    <rect x="57" y="70" width="240" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="57" y="58" width="75" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <rect x="157" y="58" width="40" height="12" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="222" y="58" width="75" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <rect x="37" y="140" width="280" height="12" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

    <!-- 缝合过孔 -->
    <line x1="95" y1="70" x2="95" y2="140" class="via-line"/>
    <circle cx="95" cy="70" r="3" class="via-pad"/>
    <circle cx="95" cy="140" r="3" class="via-pad"/>
    <line x1="260" y1="70" x2="260" y2="140" class="via-line"/>
    <circle cx="260" cy="70" r="3" class="via-pad"/>
    <circle cx="260" cy="140" r="3" class="via-pad"/>

    <!-- 电磁场 -->
    <path d="M 157,64 Q 142,80 132,64" class="field-line"/>
    <path d="M 197,64 Q 212,80 222,64" class="field-line"/>
    <path d="M 177,70 L 177,140" class="field-line"/>
    <text x="177" y="178" class="desc-text">顶信号 + 同层两侧地 + 底层地 + 打孔缝合 | 隔离极佳</text>
  </g>
</svg>
