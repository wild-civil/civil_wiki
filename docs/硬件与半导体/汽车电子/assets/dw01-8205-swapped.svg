<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">DW01 与 8205A 同为 SOT-23-6：封装一样，装反后故障极其迷惑</text>
  <text x="360" y="54" text-anchor="middle" font-size="11.5" fill="#5f6368">关键差异：正确时 VDD 接 B+（有电）；装反后 VDD 落到 8205A 的共漏节点 D（悬空，无电）</text>

  <!-- ================= 正确装配 ================= -->
  <rect x="25" y="78" width="670" height="140" rx="9" fill="#f8fdf9" stroke="#34a853" stroke-width="1.6"/>
  <text x="45" y="102" font-size="13.5" font-weight="700" fill="#137333">正确装配：DW01 在 DW01 位，8205A 在 8205A 位</text>

  <rect x="45" y="118" width="110" height="76" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="100" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">DW01</text>
  <text x="100" y="166" text-anchor="middle" font-size="10" fill="#5f6368">保护 IC</text>
  <circle cx="155" cy="140" r="4" fill="#c5221f"/>
  <text x="163" y="144" font-size="10" font-weight="700" fill="#c5221f">5 VDD</text>
  <circle cx="155" cy="172" r="4" fill="#202124"/>
  <text x="163" y="176" font-size="10" font-weight="700" fill="#202124">6 VSS</text>

  <path d="M212 140 L288 140" fill="none" stroke="#c5221f" stroke-width="2"/>
  <polygon points="288,140 280,136 280,144" fill="#c5221f"/>
  <rect x="293" y="126" width="150" height="28" rx="5" fill="#e6f4ea" stroke="#34a853" stroke-width="1.3"/>
  <text x="368" y="145" text-anchor="middle" font-size="11.5" font-weight="700" fill="#137333">B+（经 R1 供电）</text>

  <path d="M212 172 L288 172" fill="none" stroke="#202124" stroke-width="2"/>
  <polygon points="288,172 280,168 280,176" fill="#202124"/>
  <rect x="293" y="158" width="150" height="28" rx="5" fill="#f1f3f4" stroke="#80868b" stroke-width="1.3"/>
  <text x="368" y="177" text-anchor="middle" font-size="11.5" fill="#202124">B−（地）</text>

  <rect x="520" y="118" width="130" height="76" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="585" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">8205A</text>
  <text x="585" y="166" text-anchor="middle" font-size="10" fill="#5f6368">双 N-MOS</text>
  <text x="514" y="140" text-anchor="end" font-size="9.5" font-weight="700" fill="#174ea6">1 S1</text>
  <text x="514" y="172" text-anchor="end" font-size="9.5" font-weight="700" fill="#174ea6">3 S2</text>
  <text x="656" y="156" font-size="9.5" font-weight="700" fill="#80868b">2·5 D</text>

  <text x="45" y="210" font-size="10.5" fill="#5f6368">VDD 从 B+ 取电 → 芯片正常上电 → OD/OC 输出高电平 → 两颗 MOS 导通 → 有输出</text>

  <!-- ================= 装反 ================= -->
  <rect x="25" y="240" width="670" height="170" rx="9" fill="#fef7f7" stroke="#c5221f" stroke-width="1.6"/>
  <text x="45" y="264" font-size="13.5" font-weight="700" fill="#c5221f">装反：DW01 焊到 8205A 位（8205A 焊到 DW01 位）</text>

  <rect x="45" y="282" width="110" height="76" rx="6" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/>
  <text x="100" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#c5221f">DW01</text>
  <text x="100" y="330" text-anchor="middle" font-size="10" fill="#c5221f">装错位置</text>
  <circle cx="155" cy="304" r="4" fill="#c5221f"/>
  <text x="163" y="308" font-size="10" font-weight="700" fill="#c5221f">5 VDD</text>
  <circle cx="155" cy="350" r="4" fill="#202124"/>
  <text x="163" y="354" font-size="10" font-weight="700" fill="#202124">6 VSS</text>

  <path d="M212 304 L288 304" fill="none" stroke="#c5221f" stroke-width="2"/>
  <polygon points="288,304 280,300 280,308" fill="#c5221f"/>
  <rect x="293" y="290" width="160" height="28" rx="5" fill="#fce8e6" stroke="#c5221f" stroke-width="1.3"/>
  <text x="373" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">8205A 的 D 焊盘</text>
  <text x="373" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">= 共漏节点，悬空 ❌</text>

  <path d="M212 350 L288 350" fill="none" stroke="#202124" stroke-width="2"/>
  <polygon points="288,350 280,346 280,354" fill="#202124"/>
  <rect x="293" y="336" width="160" height="28" rx="5" fill="#f1f3f4" stroke="#80868b" stroke-width="1.3"/>
  <text x="373" y="355" text-anchor="middle" font-size="11" fill="#202124">G1 焊盘（原接 OD）</text>

  <text x="512" y="300" font-size="10" fill="#5f6368">结果：VDD 落在悬空节点，</text>
  <text x="512" y="316" font-size="10" fill="#5f6368">芯片拿不到 VDD–VSS 压差，</text>
  <text x="512" y="332" font-size="10" fill="#5f6368">只能靠体二极管/漏电阻</text>
  <text x="512" y="352" font-size="10" fill="#5f6368">寄生供电勉强"活着"。</text>
  <text x="512" y="368" font-size="10" fill="#5f6368">→ 表现为"插电能用、</text>
  <text x="512" y="384" font-size="10" fill="#5f6368">单插电池无输出"的假象</text>

  <text x="360" y="428" text-anchor="middle" font-size="10" fill="#80868b">注：本图为机制示意。两芯片互换后内部寄生通路错综复杂，具体电压取决于 PCB 走线与芯片型号，但结论一致 —— VDD 取不到正常电源。</text>
</svg>
