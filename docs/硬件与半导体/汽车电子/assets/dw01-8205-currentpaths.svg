<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700"
     font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif"
     style="color: var(--md-default-fg-color)">

  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c5221f"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#188038"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">三种状态下的电流路径：8205A 到底在不在回路里</text>
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.72">同一个保护板拓扑，电流走哪条路决定「有没有输出」—— 与 DW01 是否上电无关</text>

  <!-- ============================================================ -->
  <!-- 面板 ①：只有电池（放电）                                        -->
  <!-- ============================================================ -->
  <g transform="translate(0,78)">
    <!-- 回路高亮：红 = 放电回路 -->
    <path d="M70 92 L70 34 L280 34 L280 140 L70 140 Z" fill="none" stroke="#c5221f"
          stroke-width="9" stroke-opacity="0.26" stroke-linejoin="round"/>

    <!-- 非活动支路：充电器一侧（未接充电器） -->
    <g opacity="0.26">
      <path d="M280 34 L360 34 M280 140 L360 140 M360 34 L360 80 M360 108 L360 140"
            fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="343" y="80" width="34" height="28" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
      <text x="360" y="99" text-anchor="middle" font-size="9" fill="currentColor">充电器</text>
    </g>

    <!-- 上轨 B+/P+ -->
    <path d="M70 34 L280 34" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 下轨：B− 段 + P− 段 -->
    <path d="M70 140 L160 140 M250 140 L280 140" fill="none" stroke="currentColor" stroke-width="2"/>

    <!-- 电芯支路 -->
    <path d="M70 34 L70 74 M70 92 L70 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="56" y1="74" x2="84" y2="74" stroke="currentColor" stroke-width="3.5"/>
    <line x1="64" y1="92" x2="76" y2="92" stroke="currentColor" stroke-width="3.5"/>

    <!-- 负载 -->
    <path d="M280 34 L280 80 M280 108 L280 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="263" y="80" width="34" height="28" rx="4" fill="currentColor" fill-opacity="0.06" stroke="#c5221f" stroke-width="1.8"/>
    <text x="280" y="99" text-anchor="middle" font-size="10" fill="currentColor">负载</text>

    <!-- 8205A -->
    <rect x="160" y="123" width="90" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#c5221f" stroke-width="2.2"/>
    <text x="205" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">8205A</text>
    <text x="205" y="116" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">保护 MOS</text>

    <g fill="currentColor">
      <circle cx="70" cy="34" r="3"/><circle cx="280" cy="34" r="3"/>
      <circle cx="70" cy="140" r="3"/><circle cx="280" cy="140" r="3"/>
    </g>

    <text x="120" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#c5221f">B+ / P+</text>
    <text x="112" y="157" text-anchor="middle" font-size="10" fill="currentColor">B−</text>
    <text x="302" y="157" text-anchor="middle" font-size="10" fill="currentColor">P−</text>
    <text x="88" y="110" font-size="9" fill="currentColor" opacity="0.8">电芯</text>

    <!-- 电流方向 -->
    <g stroke="#c5221f" stroke-width="2" fill="none">
      <line x1="150" y1="34" x2="188" y2="34" marker-end="url(#aR)"/>
      <line x1="280" y1="50" x2="280" y2="74" marker-end="url(#aR)"/>
      <line x1="140" y1="140" x2="102" y2="140" marker-end="url(#aR)"/>
    </g>

    <!-- 右侧说明卡 -->
    <rect x="392" y="20" width="414" height="152" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.14"/>
    <text x="410" y="46" font-size="13.5" font-weight="700" fill="#c5221f">① 只有电池 —— 放电</text>
    <text x="410" y="72" font-size="11" fill="currentColor">
      <tspan x="410" dy="0">电流：电芯+ → B+/P+ → 负载</tspan>
      <tspan x="410" dy="17">　　　　→ P− → 8205A → B− → 电芯−</tspan>
    </text>
    <text x="410" y="118" font-size="11.5" font-weight="700" fill="#c5221f">8205A ✅ 在回路内</text>
    <text x="410" y="137" font-size="10.5" fill="currentColor" opacity="0.78">两颗 MOS 必须导通，否则没有输出</text>
    <text x="410" y="156" font-size="10.5" fill="currentColor" opacity="0.78">这是保护板唯一「说了算」的场景</text>
  </g>

  <line x1="24" y1="262" x2="806" y2="262" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- 面板 ②：只有充电器（不接电池，空载）                             -->
  <!-- ============================================================ -->
  <g transform="translate(0,270)">
    <!-- 回路高亮：绿 = 充电器直供 -->
    <path d="M360 108 L360 34 L280 34 L280 140 L360 140 Z" fill="none" stroke="#188038"
          stroke-width="9" stroke-opacity="0.26" stroke-linejoin="round"/>

    <!-- 非活动支路：电芯 + 8205A 整条电池支路悬空 -->
    <g opacity="0.26">
      <path d="M70 34 L280 34" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M70 140 L160 140 M250 140 L280 140" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M70 34 L70 74 M70 92 L70 140" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="56" y1="74" x2="84" y2="74" stroke="currentColor" stroke-width="3.5"/>
      <line x1="64" y1="92" x2="76" y2="92" stroke="currentColor" stroke-width="3.5"/>
      <rect x="160" y="123" width="90" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.8"/>
      <text x="205" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">8205A</text>
      <text x="112" y="157" text-anchor="middle" font-size="10" fill="currentColor">B−</text>
    </g>
    <!-- 电池缺位的 ✕ -->
    <g stroke="#c5221f" stroke-width="1.8">
      <line x1="54" y1="66" x2="86" y2="100"/>
      <line x1="86" y1="66" x2="54" y2="100"/>
    </g>
    <text x="88" y="106" font-size="9" font-weight="700" fill="#c5221f">
      <tspan x="88" dy="0">✕ 电芯未装</tspan>
      <tspan x="88" dy="11">（该支路开路）</tspan>
    </text>

    <!-- 上轨（负载↔充电器段） -->
    <path d="M280 34 L360 34" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 下轨 P− 段 -->
    <path d="M280 140 L360 140" fill="none" stroke="currentColor" stroke-width="2"/>

    <!-- 负载 -->
    <path d="M280 34 L280 80 M280 108 L280 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="263" y="80" width="34" height="28" rx="4" fill="currentColor" fill-opacity="0.06" stroke="#188038" stroke-width="2"/>
    <text x="280" y="99" text-anchor="middle" font-size="10" fill="currentColor">负载</text>

    <!-- 充电器 -->
    <path d="M360 34 L360 80 M360 108 L360 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="343" y="80" width="34" height="28" rx="4" fill="currentColor" fill-opacity="0.06" stroke="#188038" stroke-width="2"/>
    <text x="360" y="99" text-anchor="middle" font-size="9" fill="currentColor">充电器</text>

    <g fill="currentColor">
      <circle cx="280" cy="34" r="3"/><circle cx="360" cy="34" r="3"/>
      <circle cx="280" cy="140" r="3"/><circle cx="360" cy="140" r="3"/>
    </g>

    <text x="330" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#188038">B+ / P+</text>
    <text x="322" y="157" text-anchor="middle" font-size="10" fill="currentColor">P−</text>

    <!-- 电流方向 -->
    <g stroke="#188038" stroke-width="2" fill="none">
      <line x1="336" y1="34" x2="298" y2="34" marker-end="url(#aG)"/>
      <line x1="280" y1="50" x2="280" y2="74" marker-end="url(#aG)"/>
      <line x1="300" y1="140" x2="338" y2="140" marker-end="url(#aG)"/>
    </g>

    <!-- 右侧说明卡 -->
    <rect x="392" y="20" width="414" height="152" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.14"/>
    <text x="410" y="46" font-size="13.5" font-weight="700" fill="#188038">② 只有充电器（不接电池）—— 空载</text>
    <text x="410" y="72" font-size="11" fill="currentColor">
      <tspan x="410" dy="0">电流：充电器+ → B+/P+ → 负载</tspan>
      <tspan x="410" dy="17">　　　　→ P− → 充电器−</tspan>
    </text>
    <text x="410" y="118" font-size="11.5" font-weight="700" fill="#188038">8205A ❌ 不在回路内</text>
    <text x="410" y="137" font-size="10.5" fill="currentColor" opacity="0.78">负载直接吃充电器的电 → 空载可正常输出</text>
    <text x="410" y="156" font-size="10.5" fill="currentColor" opacity="0.78">哪怕把两颗芯片全拆掉，插电照样有输出</text>
  </g>

  <line x1="24" y1="454" x2="806" y2="454" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- 面板 ③：充电器 + 电池（充电）                                   -->
  <!-- ============================================================ -->
  <g transform="translate(0,462)">
    <!-- 回路高亮：蓝 = 充电回路 -->
    <path d="M360 108 L360 34 L70 34 L70 140 L360 140 Z" fill="none" stroke="#1a73e8"
          stroke-width="9" stroke-opacity="0.24" stroke-linejoin="round"/>
    <!-- 负载并联支路（次要） -->
    <path d="M280 34 L280 140" fill="none" stroke="#1a73e8" stroke-width="9"
          stroke-opacity="0.10" stroke-dasharray="6 5"/>

    <!-- 上轨 / 下轨 -->
    <path d="M70 34 L360 34" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M70 140 L160 140 M250 140 L360 140" fill="none" stroke="currentColor" stroke-width="2"/>

    <!-- 电芯支路 -->
    <path d="M70 34 L70 74 M70 92 L70 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="56" y1="74" x2="84" y2="74" stroke="currentColor" stroke-width="3.5"/>
    <line x1="64" y1="92" x2="76" y2="92" stroke="currentColor" stroke-width="3.5"/>

    <!-- 负载（并联） -->
    <path d="M280 34 L280 80 M280 108 L280 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="263" y="80" width="34" height="28" rx="4" fill="currentColor" fill-opacity="0.06" stroke="#1a73e8" stroke-width="1.6"/>
    <text x="280" y="99" text-anchor="middle" font-size="10" fill="currentColor">负载</text>

    <!-- 充电器 -->
    <path d="M360 34 L360 80 M360 108 L360 140" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="343" y="80" width="34" height="28" rx="4" fill="currentColor" fill-opacity="0.06" stroke="#1a73e8" stroke-width="2"/>
    <text x="360" y="99" text-anchor="middle" font-size="9" fill="currentColor">充电器</text>

    <!-- 8205A -->
    <rect x="160" y="123" width="90" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#1a73e8" stroke-width="2.2"/>
    <text x="205" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">8205A</text>
    <text x="205" y="116" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">保护 MOS</text>

    <g fill="currentColor">
      <circle cx="70" cy="34" r="3"/><circle cx="280" cy="34" r="3"/><circle cx="360" cy="34" r="3"/>
      <circle cx="70" cy="140" r="3"/><circle cx="280" cy="140" r="3"/><circle cx="360" cy="140" r="3"/>
    </g>

    <text x="200" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#1a73e8">B+ / P+</text>
    <text x="112" y="157" text-anchor="middle" font-size="10" fill="currentColor">B−</text>
    <text x="322" y="157" text-anchor="middle" font-size="10" fill="currentColor">P−</text>
    <text x="88" y="110" font-size="9" fill="currentColor" opacity="0.8">电芯</text>

    <!-- 电流方向 -->
    <g stroke="#1a73e8" stroke-width="2" fill="none">
      <line x1="250" y1="34" x2="212" y2="34" marker-end="url(#aB)"/>
      <line x1="70" y1="44" x2="70" y2="68" marker-end="url(#aB)"/>
      <line x1="110" y1="140" x2="148" y2="140" marker-end="url(#aB)"/>
    </g>

    <!-- 右侧说明卡 -->
    <rect x="392" y="20" width="414" height="152" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.14"/>
    <text x="410" y="46" font-size="13.5" font-weight="700" fill="#1a73e8">③ 充电器 + 电池 —— 充电</text>
    <text x="410" y="72" font-size="11" fill="currentColor">
      <tspan x="410" dy="0">电流：充电器+ → B+ → 电芯 → B−</tspan>
      <tspan x="410" dy="17">　　　　→ 8205A → P− → 充电器−</tspan>
    </text>
    <text x="410" y="118" font-size="11.5" font-weight="700" fill="#1a73e8">8205A ✅ 在充电回路内</text>
    <text x="410" y="137" font-size="10.5" fill="currentColor" opacity="0.78">任一 MOS 关断 → 充电回路断开 → 充不进电</text>
    <text x="410" y="156" font-size="10.5" fill="currentColor" opacity="0.78">负载是并联支路，不影响本结论</text>
  </g>

  <!-- ============ 页脚 ============ -->
  <text x="410" y="662" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">结论：判断「有没有输出」，先问「电流走哪条路」，而不是「DW01 有没有电」</text>
  <text x="410" y="686" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">粗色带 = 该场景的实际电流回路　·　灰化部分 = 该支路无电流　·　红 = 放电　绿 = 空载直供　蓝 = 充电</text>
</svg>
