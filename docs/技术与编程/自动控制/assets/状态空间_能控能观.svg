<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>能控性与能观性的四个例子</title>
  <desc>以双积分系统为例：输入能到达全部状态则能控，输出能反推全部状态则能观；两个反例分别展示不能控与不能观。</desc>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ① 能控 -->
  <rect x="10" y="10" width="325" height="200" rx="10" fill="#f7fbf8" stroke="#1d9e75" stroke-width="1.4"/>
  <text x="26" y="36" fill="#1d9e75" font-size="14">① 能控：u 够得着每个状态</text>
  <text x="26" y="62" fill="#5f5e5a" font-size="11">双积分器  A = [[0,1],[0,0]]，B = [0, 1]ᵀ</text>
  <text x="28" y="112" fill="#333333" font-size="14">u</text>
  <line x1="42" y1="107" x2="76" y2="107" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#ag)"/>
  <rect x="76" y="85" width="88" height="44" rx="6" fill="#ffffff" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="120" y="112" fill="#1d9e75" font-size="12" text-anchor="middle">ẋ₂ = u</text>
  <line x1="164" y1="107" x2="196" y2="107" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#ag)"/>
  <text x="172" y="99" fill="#5f5e5a" font-size="10">x₂</text>
  <rect x="196" y="85" width="100" height="44" rx="6" fill="#ffffff" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="246" y="112" fill="#1d9e75" font-size="12" text-anchor="middle">ẋ₁ = x₂</text>
  <text x="26" y="158" fill="#333333" font-size="12" font-family="Lucida Console, monospace">Qc = [B  AB] = [[0,1],[1,0]]</text>
  <text x="26" y="180" fill="#1d9e75" font-size="12">rank = 2 ✓　先改变速度，再改变位置</text>

  <!-- ② 不能控 -->
  <rect x="345" y="10" width="325" height="200" rx="10" fill="#fdf8f7" stroke="#c62828" stroke-width="1.4"/>
  <text x="361" y="36" fill="#c62828" font-size="14">② 不能控：u 够不着 x₂</text>
  <text x="361" y="62" fill="#5f5e5a" font-size="11">同一个 A，但 B = [1, 0]ᵀ</text>
  <text x="363" y="112" fill="#333333" font-size="14">u</text>
  <line x1="377" y1="107" x2="411" y2="107" stroke="#c62828" stroke-width="1.3" marker-end="url(#ar2)"/>
  <rect x="411" y="85" width="104" height="44" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="463" y="112" fill="#c62828" font-size="12" text-anchor="middle">ẋ₁ = x₂ + u</text>
  <rect x="546" y="85" width="106" height="44" rx="6" fill="#ffffff" stroke="#888780" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="599" y="112" fill="#888780" font-size="12" text-anchor="middle">ẋ₂ = 0</text>
  <text x="361" y="158" fill="#333333" font-size="12" font-family="Lucida Console, monospace">Qc = [B  AB] = [[1,0],[0,0]]</text>
  <text x="361" y="180" fill="#c62828" font-size="12">rank = 1 ✗　速度恒定，去不了任意状态</text>

  <!-- ③ 能观 -->
  <rect x="10" y="230" width="325" height="200" rx="10" fill="#f7fbf8" stroke="#1d9e75" stroke-width="1.4"/>
  <text x="26" y="256" fill="#1d9e75" font-size="14">③ 能观：量测能反推全部状态</text>
  <text x="26" y="282" fill="#5f5e5a" font-size="11">测位置 C = [1, 0]</text>
  <rect x="28" y="305" width="72" height="40" rx="6" fill="#ffffff" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="64" y="331" fill="#1d9e75" font-size="12" text-anchor="middle">x₁</text>
  <line x1="100" y1="325" x2="150" y2="325" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#ag)"/>
  <text x="160" y="331" fill="#333333" font-size="14">y = x₁</text>
  <rect x="28" y="355" width="72" height="36" rx="6" fill="#ffffff" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="64" y="379" fill="#1d9e75" font-size="12" text-anchor="middle">x₂</text>
  <line x1="100" y1="373" x2="150" y2="373" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#ag)"/>
  <text x="158" y="378" fill="#5f5e5a" font-size="11">x₂ = ẋ₁，由 y 的变化看出速度</text>
  <text x="26" y="410" fill="#333333" font-size="12" font-family="Lucida Console, monospace">Qo = [[1,0],[0,1]]，rank = 2 ✓</text>

  <!-- ④ 不能观 -->
  <rect x="345" y="230" width="325" height="200" rx="10" fill="#fdf8f7" stroke="#c62828" stroke-width="1.4"/>
  <text x="361" y="256" fill="#c62828" font-size="14">④ 不能观：量测看不见 x₁ 初值</text>
  <text x="361" y="282" fill="#5f5e5a" font-size="11">只测速度 C = [0, 1]</text>
  <rect x="363" y="305" width="72" height="40" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="399" y="331" fill="#c62828" font-size="12" text-anchor="middle">x₂</text>
  <line x1="435" y1="325" x2="485" y2="325" stroke="#c62828" stroke-width="1.3" marker-end="url(#ar2)"/>
  <text x="495" y="331" fill="#333333" font-size="14">y = x₂</text>
  <rect x="363" y="355" width="72" height="36" rx="6" fill="#ffffff" stroke="#888780" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="399" y="379" fill="#888780" font-size="12" text-anchor="middle">x₁</text>
  <line x1="435" y1="373" x2="485" y2="373" stroke="#888780" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="493" y="378" fill="#888780" font-size="11">x₁(0) 怎么变，y 都一样</text>
  <text x="361" y="410" fill="#333333" font-size="12" font-family="Lucida Console, monospace">Qo = [[0,1],[0,0]]，rank = 1 ✗</text>
</svg>
