<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>二阶系统的极点位置与阻尼比、自然频率</title>
  <desc>极点在复平面上的位置由阻尼比和自然频率决定。</desc>
  <text x="30.0" y="30.0" fill="#333333" font-size="15" text-anchor="start">极点位置：ζ 定角度，ω_n 定半径</text>
  <line x1="70.0" y1="210.0" x2="450.0" y2="210.0" stroke="#333333" stroke-width="1"/>
  <line x1="250.0" y1="210.0" x2="250.0" y2="50.0" stroke="#333333" stroke-width="1"/>
  <text x="438.0" y="228.0" fill="#333333" font-size="12" text-anchor="start">σ</text>
  <text x="258.0" y="62.0" fill="#333333" font-size="12" text-anchor="start">jω</text>
  <circle cx="250" cy="210" r="68" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="324.0" y="206.0" fill="#5f5e5a" font-size="12" text-anchor="start">ω_n</text>
  <line x1="250.0" y1="210.0" x2="214.0" y2="127.5" stroke="#ba7517" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="250.0" y1="210.0" x2="214.0" y2="292.5" stroke="#ba7517" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="223.0" cy="148.2" r="5" fill="#c62828"/>
  <circle cx="223.0" cy="271.8" r="5" fill="#c62828"/>
  <line x1="223.0" y1="148.2" x2="223.0" y2="210.0" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="223.0" y1="148.2" x2="250.0" y2="148.2" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="215.0" y="228.0" fill="#c62828" font-size="12" text-anchor="middle">−ζω_n</text>
  <text x="231.0" y="140.2" fill="#c62828" font-size="12" text-anchor="start">jω_d</text>
  <text x="209.0" y="126.2" fill="#333333" font-size="12" text-anchor="start">s = −ζω_n + jω_d</text>
  <text x="209.0" y="293.8" fill="#c62828" font-size="12" text-anchor="start">共轭极点</text>
  <path d="M 200 210 A 50 50 0 0 0 230 164" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="206.0" y="192.0" fill="#333333" font-size="12" text-anchor="start">β</text>
  <text x="90.0" y="250.0" fill="#5f5e5a" font-size="12" text-anchor="start">cos β = ζ，半径 = ω_n，ω_d = ω_n√(1−ζ²)</text>
</svg>
