<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>状态空间结构框图</title>
  <desc>输入 u 经 B、状态经 A 反馈后求和得到 x 的导数，积分得到状态 x；x 经 C、u 经 D 求和得到输出 y。</desc>
  <text x="30" y="28" fill="#333333" font-size="15">状态空间结构：ẋ = Ax + Bu，y = Cx + Du</text>
  <text x="30" y="48" fill="#5f5e5a" font-size="12">方框里的积分器串，就是系统的“记忆”</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 主链 -->
  <text x="20" y="156" fill="#333333" font-size="14">u</text>
  <line x1="42" y1="150" x2="80" y2="150" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <circle cx="58" cy="150" r="3" fill="#333333"/>
  <rect x="80" y="127" width="60" height="46" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.6"/>
  <text x="110" y="156" fill="#185fa5" font-size="15" text-anchor="middle">B</text>
  <line x1="140" y1="150" x2="161" y2="150" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>

  <circle cx="175" cy="150" r="14" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="156" fill="#333333" font-size="15" text-anchor="middle">Σ</text>
  <text x="162" y="140" fill="#333333" font-size="11">+</text>
  <text x="162" y="170" fill="#333333" font-size="11">+</text>

  <line x1="189" y1="150" x2="255" y2="150" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="216" y="142" fill="#5f5e5a" font-size="12">ẋ</text>

  <rect x="255" y="127" width="60" height="46" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.6"/>
  <text x="285" y="158" fill="#333333" font-size="19" text-anchor="middle">∫</text>

  <line x1="315" y1="150" x2="350" y2="150" stroke="#333333" stroke-width="1.4"/>
  <circle cx="350" cy="150" r="3.5" fill="#333333"/>
  <text x="330" y="142" fill="#333333" font-size="12">x</text>

  <!-- C 支路 -->
  <line x1="350" y1="150" x2="350" y2="78" stroke="#333333" stroke-width="1.4"/>
  <line x1="350" y1="78" x2="410" y2="78" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="410" y="55" width="60" height="46" rx="6" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1.6"/>
  <text x="440" y="84" fill="#1d9e75" font-size="15" text-anchor="middle">C</text>
  <line x1="470" y1="78" x2="545" y2="78" stroke="#333333" stroke-width="1.4"/>
  <line x1="545" y1="78" x2="545" y2="136" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- A 反馈支路 -->
  <line x1="350" y1="150" x2="350" y2="215" stroke="#333333" stroke-width="1.4"/>
  <line x1="350" y1="215" x2="315" y2="215" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="255" y="192" width="60" height="46" rx="6" fill="#faeedc" stroke="#ba7517" stroke-width="1.6"/>
  <text x="285" y="221" fill="#ba7517" font-size="15" text-anchor="middle">A</text>
  <line x1="255" y1="215" x2="175" y2="215" stroke="#333333" stroke-width="1.4"/>
  <line x1="175" y1="215" x2="175" y2="164" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="205" y="207" fill="#5f5e5a" font-size="11">Ax（状态反馈）</text>

  <!-- D 前馈支路 -->
  <line x1="58" y1="150" x2="58" y2="265" stroke="#333333" stroke-width="1.4"/>
  <line x1="58" y1="265" x2="410" y2="265" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="410" y="242" width="60" height="46" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.6"/>
  <text x="440" y="271" fill="#333333" font-size="15" text-anchor="middle">D</text>
  <line x1="470" y1="265" x2="545" y2="265" stroke="#333333" stroke-width="1.4"/>
  <line x1="545" y1="265" x2="545" y2="164" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="200" y="254" fill="#5f5e5a" font-size="11">Du（直传）</text>

  <!-- 输出 -->
  <circle cx="545" cy="150" r="14" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="545" y="156" fill="#333333" font-size="15" text-anchor="middle">Σ</text>
  <line x1="559" y1="150" x2="615" y2="150" stroke="#333333" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="622" y="156" fill="#333333" font-size="14">y</text>
</svg>
