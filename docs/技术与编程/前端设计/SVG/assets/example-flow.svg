<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320"
     font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- 定义：箭头端点 marker，供所有连线复用 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="20" y="30" font-size="16" font-weight="700" fill="#202124">MIL / SIL / PIL / HIL：等价链与逐级递进</text>

  <!-- 四个阶段方框（分组管理，便于整体定位与复用） -->
  <g font-size="14" text-anchor="middle">
    <rect x="20"  y="70" width="130" height="70" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="85"  y="100" font-weight="700" fill="#1a73e8">MIL</text>
    <text x="85"  y="120" font-size="11" fill="#5f6368">模型（算法）</text>

    <rect x="190" y="70" width="130" height="70" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
    <text x="255" y="100" font-weight="700" fill="#188038">SIL</text>
    <text x="255" y="120" font-size="11" fill="#5f6368">PC 上跑 C 代码</text>

    <rect x="360" y="70" width="130" height="70" rx="10" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
    <text x="425" y="100" font-weight="700" fill="#b06000">PIL</text>
    <text x="425" y="120" font-size="11" fill="#5f6368">真芯片跑代码</text>

    <rect x="530" y="70" width="130" height="70" rx="10" fill="#fce8e6" stroke="#c5221f" stroke-width="2"/>
    <text x="595" y="100" font-weight="700" fill="#c5221f">HIL</text>
    <text x="595" y="120" font-size="11" fill="#5f6368">真芯片 + 被控对象</text>
  </g>

  <!-- 等价链箭头：用 marker 自动补箭头，线本身只管位置 -->
  <g stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="150" y1="105" x2="188" y2="105"/>
    <line x1="320" y1="105" x2="358" y2="105"/>
    <line x1="490" y1="105" x2="528" y2="105"/>
  </g>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#5f6368">保真度 / 成本 / 耗时沿箭头递增；相邻阶段 ≡ 等价对拍</text>

  <!-- 侧栏说明（通用化表述，不绑定任何具体项目进度） -->
  <rect x="20" y="180" width="640" height="110" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text x="36" y="206" font-size="12" font-weight="700" fill="#202124">常见落地路径（以「手写 C 固件」团队为例）</text>
  <text x="36" y="228" font-size="11" fill="#3c4043">• 没有模型参照 → 通常不单独做 MIL，SIL 即第一步（代码与手写逻辑对拍）。</text>
  <text x="36" y="248" font-size="11" fill="#3c4043">• SIL：把真实 .c 在 PC 宿主编译运行，验证「代码忠实实现逻辑」，不仿真整块板子。</text>
  <text x="36" y="268" font-size="11" fill="#3c4043">• 拿到样片后：SIL → PIL（真 MCU 数值 / 时序对拍）→ HIL（实时接口 / 故障注入）。</text>
</svg>
