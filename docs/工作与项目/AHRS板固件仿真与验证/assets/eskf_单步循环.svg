<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img">
<title>ESKF 单采样点循环</title>
<desc>每个 k: 预测(标称积分+协方差), 再逐量测更新(新息/增益/注入/重置)</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2937">ESKF 单采样点循环 (k = 1..N)</text>
<rect x="90" y="44" width="500" height="118" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="68" font-size="14" font-weight="500" fill="#0C447C">1. 预测 Propagation</text>
<text x="110" y="90" font-size="12" fill="#444">标称积分  q &lt;- q (x) exp((w-bg) dt)</text>
<text x="110" y="110" font-size="12" fill="#444">p &lt;- p + v dt + 1/2 a_w dt^2 ;  v &lt;- v + a_w dt</text>
<text x="110" y="130" font-size="12" fill="#444">a_w = R (a-ba) + [0 0 g]   (重力在 NED 向下)</text>
<text x="110" y="150" font-size="12" fill="#444">协方差  F(15x15) -> Fd = I + F dt -> P = Fd P Fd^T + Q dt</text>
<line x1="340" y1="162" x2="340" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="90" y="192" width="500" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="110" y="216" font-size="14" font-weight="500" fill="#085041">2. 量测更新 Measurement update</text>
<text x="110" y="238" font-size="12" fill="#444">逐量测: accel / mag / gpos / gvel   (baro 默认关闭)</text>
<text x="110" y="258" font-size="12" fill="#444">y = z - h ;  S = H P H^T + R ;  K = P H^T / S ;  dx = K y</text>
<text x="110" y="278" font-size="12" fill="#444">注入标称  q &lt;- q (x) exp(dx_theta); p += dx_p; v += dx_v</text>
<text x="110" y="298" font-size="12" fill="#444">bg += dx_bg ;  ba += dx_ba</text>
<text x="110" y="318" font-size="12" fill="#444">协方差重置  P &lt;- (I - K H) P</text>
<text x="110" y="338" font-size="12" fill="#444">姿态交叉项清零;  P(1:3,1:3) = 1e-9 I</text>
<text x="340" y="372" text-anchor="middle" font-size="12" fill="#444">每个 k 末尾: 存回 est_q(k), est_p(k), est_v(k)</text>
<text x="340" y="392" text-anchor="middle" font-size="12" fill="#888780">H 是量测雅可比, 把误差态映射到量测空间</text>
</svg>