<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img">
<title>Phase 1 ESKF 验证数据流</title>
<desc>ahrs_data_gen 生成真值与带噪量测, eskf15_ref 解算, verify 比对出 RMS 与 PASS/FAIL</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2937">Phase 1 验证数据流</text>
<g>
<rect x="200" y="48" width="280" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="72" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">ahrs_data_gen.m</text>
<text x="340" y="92" text-anchor="middle" font-size="12" fill="#444">合成真值轨迹 + 带噪传感器</text>
</g>
<g>
<rect x="200" y="170" width="280" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="194" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">eskf15_ref.m</text>
<text x="340" y="214" text-anchor="middle" font-size="12" fill="#444">15 态 ESKF 解算 (标称+误差)</text>
</g>
<g>
<rect x="200" y="292" width="280" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="316" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">verify_*.m</text>
<text x="340" y="336" text-anchor="middle" font-size="12" fill="#444">比对真值 -> RMS -> PASS/FAIL</text>
</g>
<line x1="340" y1="106" x2="340" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="138" font-size="12" fill="#444">imu, meas</text>
<line x1="340" y1="228" x2="340" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="260" font-size="12" fill="#444">est_q, est_p, est_v</text>
<polyline points="480,70 522,70 522,321 480,321" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="530" y="200" font-size="12" fill="#444">truth.* 真值</text>
<text x="58" y="79" font-size="12" fill="#444">scenario</text>
<line x1="122" y1="79" x2="198" y2="79" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="58" y="98" font-size="11" fill="#888780">运动剖面</text>
</svg>