<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>复数自由度与单位圆自由度对比</title>
  <desc>左边整个复平面有2个自由度（a,b），右边单位圆只有1个自由度（角度θ），中间的箭头表示锁定模长牺牲了缩放自由度。</desc>
  <rect x="30" y="50" width="220" height="160" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="45" y="42" fill="#333" font-size="14">整个复平面 &#8450;</text>
  <text x="55" y="120" fill="#185fa5" font-size="15">z = a + bi</text>
  <text x="55" y="146" fill="#333" font-size="13">2 个自由度</text>
  <text x="55" y="166" fill="#333" font-size="13">· 实轴位置 a</text>
  <text x="55" y="186" fill="#333" font-size="13">· 虚轴位置 b</text>
  <circle cx="505" cy="130" r="78" fill="#faeedc" stroke="#ba7517" stroke-width="2"/>
  <text x="470" y="40" fill="#333" font-size="14">单位圆 S¹</text>
  <text x="466" y="126" fill="#ba7517" font-size="14">e^{iθ}</text>
  <text x="456" y="150" fill="#333" font-size="13">1 个自由度</text>
  <text x="450" y="170" fill="#333" font-size="13">只有 θ（r=1 锁定）</text>
  <line x1="258" y1="130" x2="410" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="116" fill="#a32d2d" font-size="12">牺牲缩放自由度</text>
  <text x="268" y="133" fill="#555" font-size="12">（强制 r = 1）</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
