<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <!-- 背景 -->
  <rect width="680" height="380" fill="#f8fafc"/>
  <rect x="0" y="0" width="680" height="380" fill="none" stroke="#cbd5e1"/>

  <!-- 标题 -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">3×IMU 表决：一路故障时，中值把离群踢出去</text>

  <!-- ============ 数轴 ============ -->
  <line x1="70" y1="170" x2="620" y2="170" stroke="#475569" stroke-width="1.6"/>
  <!-- 刻度 90~130 -->
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <line x1="70" y1="170" x2="70" y2="176" stroke="#475569"/><text x="70" y="192">90</text>
    <line x1="200" y1="170" x2="200" y2="176" stroke="#475569"/><text x="200" y="192">100</text>
    <line x1="330" y1="170" x2="330" y2="176" stroke="#475569"/><text x="330" y="192">110</text>
    <line x1="460" y1="170" x2="460" y2="176" stroke="#475569"/><text x="460" y="192">120</text>
    <line x1="590" y1="170" x2="590" y2="176" stroke="#475569"/><text x="590" y="192">130</text>
  </g>
  <text x="345" y="206" text-anchor="middle" font-size="10" fill="#64748b">角速度读数（°/s）</text>

  <!-- 真实值 100 虚线 -->
  <line x1="200" y1="96" x2="200" y2="170" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="200" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">真实值 100.0</text>

  <!-- 三路读数点 -->
  <!-- 路1: 100.0（正常，蓝） -->
  <line x1="200" y1="104" x2="200" y2="170" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="200" cy="104" r="5" fill="#2563eb"/>
  <text x="200" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">路1 = 100.0 ✓</text>
  <text x="200" y="84" text-anchor="middle" font-size="9" fill="#64748b">ICM-42688P 正常</text>

  <!-- 路2: 120（故障，红） -->
  <line x1="460" y1="104" x2="460" y2="170" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="460" cy="104" r="5" fill="#dc2626"/>
  <text x="460" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">路2 = 120.0 ✗</text>
  <text x="460" y="84" text-anchor="middle" font-size="9" fill="#64748b">IIM-42652 +20% 刻度故障</text>

  <!-- 路3: 100.1（正常，蓝） -->
  <line x1="203" y1="124" x2="203" y2="170" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="203" cy="124" r="5" fill="#2563eb"/>
  <text x="203" y="112" text-anchor="start" font-size="11" font-weight="bold" fill="#2563eb">路3 = 100.1 ✓</text>
  <text x="203" y="126" text-anchor="start" font-size="9" fill="#64748b">BMI088 正常（+0.1 失调）</text>

  <!-- ============ 融合结果区 ============ -->
  <rect x="20" y="225" width="640" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- 中值（绿） -->
  <rect x="45" y="240" width="290" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="262" font-size="12" font-weight="bold" fill="#16a34a">中值 = 100.1 °/s（取排序中间）</text>
  <text x="60" y="280" font-size="10" fill="#475569">误差 0.1 °/s → ✓ 抗故障：离群值自动被"挤"到边上</text>

  <!-- 均值（琥珀） -->
  <rect x="345" y="240" width="300" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="262" font-size="12" font-weight="bold" fill="#d97706">均值 = 106.7 °/s（(100+120+100.1)/3）</text>
  <text x="360" y="280" font-size="10" fill="#475569">误差 6.7 °/s → ✗ 被故障路拉偏（单路更糟：120）</text>

  <!-- 2oo3 表决小矩阵 -->
  <text x="60" y="326" font-size="11" font-weight="bold" fill="#1e293b">2oo3 表决（残差 &gt; 0.5 °/s 记为不一致）：</text>
  <g font-size="10" text-anchor="middle">
    <text x="300" y="312" fill="#64748b">路1</text><text x="340" y="312" fill="#64748b">路2</text><text x="380" y="312" fill="#64748b">路3</text>
    <rect x="288" y="318" width="22" height="20" fill="#ffffff" stroke="#94a3b8"/><text x="299" y="332" fill="#16a34a">0</text>
    <rect x="328" y="318" width="22" height="20" fill="#fef2f2" stroke="#dc2626"/><text x="339" y="332" fill="#dc2626">1</text>
    <rect x="368" y="318" width="22" height="20" fill="#ffffff" stroke="#94a3b8"/><text x="379" y="332" fill="#16a34a">0</text>
    <rect x="288" y="340" width="22" height="20" fill="#fef2f2" stroke="#dc2626"/><text x="299" y="354" fill="#dc2626">1</text>
    <rect x="328" y="340" width="22" height="20" fill="#ffffff" stroke="#94a3b8"/><text x="339" y="354" fill="#16a34a">0</text>
    <rect x="368" y="340" width="22" height="20" fill="#fef2f2" stroke="#dc2626"/><text x="379" y="354" fill="#dc2626">1</text>
    <rect x="288" y="362" width="22" height="20" fill="#ffffff" stroke="#94a3b8"/><text x="299" y="376" fill="#16a34a">0</text>
    <rect x="328" y="362" width="22" height="20" fill="#fef2f2" stroke="#dc2626"/><text x="339" y="376" fill="#dc2626">1</text>
    <rect x="368" y="362" width="22" height="20" fill="#ffffff" stroke="#94a3b8"/><text x="379" y="376" fill="#16a34a">0</text>
    <text x="415" y="322" font-size="9" fill="#475569" text-anchor="start">行=路i 与其他路的</text>
    <text x="415" y="334" font-size="9" fill="#475569" text-anchor="start">不一致票数：</text>
    <text x="415" y="346" font-size="9" fill="#16a34a" text-anchor="start">路1=1 票（可疑）、</text>
    <text x="415" y="358" font-size="9" fill="#dc2626" text-anchor="start">路2=2 票（故障隔离）、</text>
    <text x="415" y="370" font-size="9" fill="#16a34a" text-anchor="start">路3=1 票（可疑）</text>
  </g>

  <!-- 图例 -->
  <rect x="500" y="318" width="130" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="334" font-size="9" fill="#1e293b">● 正常通道</text>
  <circle cx="520" cy="349" r="4" fill="#dc2626"/>
  <text x="530" y="353" font-size="9" fill="#1e293b">故障通道</text>
  <text x="512" y="366" font-size="9" fill="#64748b">多数票 → 隔离路2</text>
</svg>
