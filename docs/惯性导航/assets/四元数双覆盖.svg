<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img">
<title>四元数双覆盖：q 与 -q 表示同一旋转</title>
<desc>单位四元数 S³ 到旋转群 SO(3) 是 2 对 1 的满射：q 与 -q 都映射到同一个三维旋转。工程中 slerp/比较前要判符号。</desc>
<style>
.th{font-size:13px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.tc{font-size:11px;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.tb{font-size:11px;fill:#0C447C;font-family:'Consolas','Segoe UI',monospace;}
</style>
<defs>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ab2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="40" y="30" fill="#4A1D66">四元数双覆盖（double cover）</text>

<!-- 左：旋转示意 -->
<text class="ts" x="150" y="52" text-anchor="middle">同一个旋转 R</text>
<circle cx="115" cy="175" r="4" fill="#333"/>
<text class="ts" x="123" y="172">O</text>
<circle cx="115" cy="175" r="3" fill="#B5502A"/>
<text class="ts" x="92" y="165" fill="#B5502A">轴 u</text>
<line x1="115" y1="175" x2="195" y2="98" stroke="#3B6D11" stroke-width="2.2" marker-end="url(#av)"/>
<text class="tc" x="150" y="92" fill="#27500A">v</text>
<line x1="115" y1="175" x2="225" y2="158" stroke="#185FA5" stroke-width="2.2" marker-end="url(#ab2)"/>
<text class="tc" x="232" y="155" fill="#0C447C">v′</text>
<path d="M195 98 A 60 60 0 0 1 225 158" fill="none" stroke="#7E3318" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#av)"/>
<text class="ts" x="210" y="118" fill="#7E3318">绕 u 转 θ</text>

<!-- 中：两个四元数 -->
<rect x="330" y="70" width="220" height="42" rx="9" fill="#F3E8FB" stroke="#6A2C91" stroke-width="0.8"/>
<text class="tb" x="440" y="95" text-anchor="middle">q  = ( cos θ/2,  u·sin θ/2 )</text>
<rect x="330" y="140" width="220" height="42" rx="9" fill="#F3E8FB" stroke="#6A2C91" stroke-width="0.8"/>
<text class="tb" x="440" y="165" text-anchor="middle">−q = ( −cos θ/2, −u·sin θ/2 )</text>
<!-- 大括号指向同一旋转 -->
<path d="M552 91 Q575 131 552 161" fill="none" stroke="#5F5E5A" stroke-width="1.4"/>
<text class="tc" x="582" y="132" fill="#5F5E5A">二者</text>
<text class="tc" x="582" y="148" fill="#5F5E5A">同一旋转</text>

<!-- 底部注记 -->
<rect x="40" y="210" width="600" height="34" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text class="ts" x="58" y="232" font-weight="700" fill="#5F5E5A">工程坑</text>
<text class="ts" x="108" y="232">q 与 −q 姿态等价（双覆盖）。slerp / 比较前先算点积，若 q·q′&lt;0 取 −q′，否则插值走远路、姿态跳变。</text>
</svg>
