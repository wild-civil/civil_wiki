<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>比力 vs 加速度 vs 重力</title>
<desc>加速度计测的是比力 f=a-g，而非运动加速度 a：静止时读数 1g 向上，自由落体时读数为 0，这就是"比力"的由来。</desc>
<style>
.th{font-size:14px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.eq{font-size:16px;font-weight:700;font-family:'Cambria Math','Times New Roman',serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B5502A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ag2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 顶部公式条 -->
<rect x="40" y="16" width="600" height="46" rx="8" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.2"/>
<text class="eq" x="80" y="46" fill="#0C447C">加速度计输出 = 比力 f = a − g</text>
<text class="ts" x="345" y="46">（a=运动加速度，g=重力加速度，静止时 a=0 → f=−g，向上读 1g）</text>

<!-- 场景1：静止 -->
<text class="th" x="135" y="92" text-anchor="middle" fill="#27500A">① 静止（放在桌面）</text>
<rect x="95" y="108" width="80" height="120" rx="6" fill="#FDF3E7" stroke="#854F0B" stroke-width="1.2"/>
<rect x="115" y="128" width="40" height="24" rx="4" fill="#FDE9D6" stroke="#854F0B" stroke-width="1"/>
<!-- 弹簧 -->
<path d="M135 152 q6 -6 0 -12 q-6 -6 0 -12 q6 -6 0 -12 q-6 -6 0 -12" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<rect x="125" y="98" width="20" height="20" rx="3" fill="#185FA5"/>
<!-- 力箭头 -->
<line x1="135" y1="228" x2="135" y2="178" stroke="#B5502A" stroke-width="2.6" marker-end="url(#aa)"/>
<text class="lb" x="148" y="208" fill="#B5502A">读数 = +1g</text>
<text class="ts" x="135" y="252" text-anchor="middle">桌面支撑力 · 静止时加速度计"感受到"重力</text>

<!-- 场景2：自由落体 -->
<text class="th" x="340" y="92" text-anchor="middle" fill="#B5502A">② 自由落体（电梯断缆）</text>
<rect x="300" y="108" width="80" height="120" rx="6" fill="#FDF3E7" stroke="#854F0B" stroke-width="1.2"/>
<rect x="320" y="128" width="40" height="24" rx="4" fill="#FDE9D6" stroke="#854F0B" stroke-width="1"/>
<path d="M340 152 q6 -6 0 -12 q-6 -6 0 -12 q6 -6 0 -12 q-6 -6 0 -12" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<rect x="330" y="98" width="20" height="20" rx="3" fill="#185FA5"/>
<line x1="340" y1="218" x2="340" y2="178" stroke="#3B6D11" stroke-width="2.6" marker-end="url(#ag2)"/>
<text class="lb" x="353" y="206" fill="#3B6D11">a = g</text>
<text class="ts" x="340" y="252" text-anchor="middle">随电梯一起下落，质量块"失重" → 读数 = 0</text>

<!-- 场景3：上升加速 -->
<text class="th" x="545" y="92" text-anchor="middle" fill="#185FA5">③ 向上加速</text>
<rect x="505" y="108" width="80" height="120" rx="6" fill="#FDF3E7" stroke="#854F0B" stroke-width="1.2"/>
<rect x="525" y="128" width="40" height="24" rx="4" fill="#FDE9D6" stroke="#854F0B" stroke-width="1"/>
<path d="M545 152 q6 -6 0 -12 q-6 -6 0 -12 q6 -6 0 -12 q-6 -6 0 -12" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<rect x="535" y="98" width="20" height="20" rx="3" fill="#185FA5"/>
<line x1="545" y1="228" x2="545" y2="158" stroke="#B5502A" stroke-width="3" marker-end="url(#aa)"/>
<text class="lb" x="558" y="196" fill="#B5502A">读数 &gt; 1g</text>
<text class="ts" x="545" y="252" text-anchor="middle">加速上升 → 读数 = g + a &gt; 1g（超重）</text>

<!-- 底部小结 -->
<rect x="40" y="272" width="600" height="132" rx="8" fill="#F6F4EC" stroke="#B9A15C" stroke-width="1.2"/>
<text class="th" x="56" y="298" fill="#5C4A1E">一句话总结</text>
<text class="lb" x="56" y="322" fill="#333">• 加速度计不是"运动加速度计"，是"比力计"：它测的是弹簧/静电力对质量块的支撑，f = a − g。</text>
<text class="lb" x="56" y="346" fill="#333">• 静止：a=0，f=−g → 读数 1g（指向上，抵消重力）；自由落体：a=g，f=0 → 读数归零。</text>
<text class="lb" x="56" y="370" fill="#333">• 惯导要用的是"真实运动加速度 a"，所以机械编排里必须加回重力：a = f + g（见 06 篇）。</text>
<text class="ts" x="56" y="392" fill="#5F5E5A">这也是为什么纯 IMU 无法区分"静止"和"匀速"——两者读数都是 1g 向上。</text>
</svg>
