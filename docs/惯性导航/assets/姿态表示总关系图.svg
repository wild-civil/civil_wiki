<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img">
<title>姿态的四种表示及其关系</title>
<desc>真实姿态是 SO(3) 三维旋转，有四种主流参数化：欧拉角(3,奇点)、旋转矩阵DCM(9,6约束)、四元数(4,双覆盖)、旋转向量(3,±π歧义)。各表示互相可转换，无完美表示。</desc>
<style>
.th{font-size:13px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.tc{font-size:11px;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 中心 SO(3) -->
<circle cx="340" cy="225" r="62" fill="#FBE9C8" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="340" y="218" text-anchor="middle" fill="#633806">真实姿态</text>
<text class="th" x="340" y="236" text-anchor="middle" fill="#633806">SO(3)</text>
<text class="ts" x="340" y="254" text-anchor="middle">3 自由度旋转</text>

<!-- 欧拉角 -->
<rect x="40" y="55" width="180" height="86" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="th" x="130" y="80" text-anchor="middle" fill="#27500A">欧拉角</text>
<text class="tc" x="130" y="100" text-anchor="middle" fill="#0C447C">3 参数 (yaw/pitch/roll)</text>
<text class="ts" x="130" y="120" text-anchor="middle">顺序敏感 · 有万向锁奇点</text>

<!-- 旋转矩阵 -->
<rect x="460" y="55" width="180" height="86" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="550" y="80" text-anchor="middle" fill="#0C447C">旋转矩阵 DCM</text>
<text class="tc" x="550" y="100" text-anchor="middle" fill="#0C447C">9 参数 (3×3)</text>
<text class="ts" x="550" y="120" text-anchor="middle">6 个正交约束 · 无奇点</text>

<!-- 四元数 -->
<rect x="40" y="320" width="180" height="86" rx="12" fill="#F3E8FB" stroke="#6A2C91" stroke-width="0.8"/>
<text class="th" x="130" y="345" text-anchor="middle" fill="#4A1D66">四元数</text>
<text class="tc" x="130" y="365" text-anchor="middle" fill="#0C447C">4 参数 [w,x,y,z]</text>
<text class="ts" x="130" y="385" text-anchor="middle">1 个范数约束 · 双覆盖</text>

<!-- 旋转向量 -->
<rect x="460" y="320" width="180" height="86" rx="12" fill="#FDEAE3" stroke="#B5502A" stroke-width="0.8"/>
<text class="th" x="550" y="345" text-anchor="middle" fill="#7E3318">旋转向量</text>
<text class="tc" x="550" y="365" text-anchor="middle" fill="#0C447C">3 参数 (θ·u)</text>
<text class="ts" x="550" y="385" text-anchor="middle">最小参数 · ±π 处歧义</text>

<!-- 中心到四节点 -->
<line x1="282" y1="200" x2="222" y2="120" stroke="#185FA5" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="398" y1="200" x2="458" y2="120" stroke="#185FA5" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="282" y1="250" x2="222" y2="330" stroke="#185FA5" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="398" y1="250" x2="458" y2="330" stroke="#185FA5" stroke-width="1.4" marker-end="url(#ar)"/>

<!-- 边角小转换提示 -->
<text class="ts" x="232" y="158" text-anchor="middle">姿态→角度</text>
<text class="ts" x="448" y="158" text-anchor="middle">R→q / q→R</text>
<text class="ts" x="232" y="298" text-anchor="middle">q→rv</text>
<text class="ts" x="448" y="298" text-anchor="middle">rv→q</text>

<!-- 底部注记 -->
<rect x="40" y="425" width="600" height="42" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text class="ts" x="58" y="444" font-weight="700" fill="#5F5E5A">关键认知</text>
<text class="ts" x="58" y="461">没有完美表示：SO(3) 无法用 3 个全局无奇点参数覆盖。惯导 = 内部四元数 + 对外欧拉角 + 增量旋转向量</text>
</svg>
