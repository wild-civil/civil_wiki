<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img">
<title>姿态的四种表示及其关系（增强版）</title>
<desc>真实姿态是 SO(3) 三维旋转。四种表示互相可转换：欧拉角↔DCM、DCM↔四元数、四元数↔旋转向量、旋转向量↔DCM、欧拉角↔四元数。各司其职：欧拉角给人看、DCM 当桥梁、四元数存内部、旋转向量做增量。</desc>
<style>
.th{font-size:13px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.tc{font-size:10.5px;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:10.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A86" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 中心 SO(3) -->
<circle cx="340" cy="250" r="62" fill="#FBE9C8" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="340" y="243" text-anchor="middle" fill="#633806">真实姿态</text>
<text class="th" x="340" y="261" text-anchor="middle" fill="#633806">SO(3)</text>
<text class="ts" x="340" y="279" text-anchor="middle">3 自由度旋转</text>

<!-- 欧拉角 -->
<rect x="40" y="60" width="180" height="92" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="130" y="84" text-anchor="middle" fill="#27500A">欧拉角 yaw/pitch/roll</text>
<text class="tc" x="130" y="104" text-anchor="middle" fill="#0C447C">3 参数 · 顺序敏感 · 万向锁</text>
<text class="lb" x="130" y="126" text-anchor="middle" fill="#7E3318" font-size="10">给人看（最后一步翻译）</text>
<text class="ts" x="130" y="142" text-anchor="middle" font-size="9">取角函数 quat_to_euler</text>

<!-- 旋转矩阵 -->
<rect x="460" y="60" width="180" height="92" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="550" y="84" text-anchor="middle" fill="#0C447C">旋转矩阵 DCM</text>
<text class="tc" x="550" y="104" text-anchor="middle" fill="#0C447C">9 参数 · 6 正交约束 · 无奇点</text>
<text class="lb" x="550" y="126" text-anchor="middle" fill="#7E3318" font-size="10">当桥梁（雅可比/换算枢纽）</text>
<text class="ts" x="550" y="142" text-anchor="middle" font-size="9">quat_to_rotmat / q2r</text>

<!-- 四元数 -->
<rect x="40" y="350" width="180" height="92" rx="12" fill="#F3E8FB" stroke="#6A2C91" stroke-width="1"/>
<text class="th" x="130" y="374" text-anchor="middle" fill="#4A1D66">四元数 [w,x,y,z]</text>
<text class="tc" x="130" y="394" text-anchor="middle" fill="#0C447C">4 参数 · 1 约束 · 双覆盖</text>
<text class="lb" x="130" y="416" text-anchor="middle" fill="#7E3318" font-size="10">存内部（工程首选）</text>
<text class="ts" x="130" y="432" text-anchor="middle" font-size="9">qmul / rv2q / qnorm</text>

<!-- 旋转向量 -->
<rect x="460" y="350" width="180" height="92" rx="12" fill="#FDEAE3" stroke="#B5502A" stroke-width="1"/>
<text class="th" x="550" y="374" text-anchor="middle" fill="#7E3318">旋转向量 θ·u</text>
<text class="tc" x="550" y="394" text-anchor="middle" fill="#0C447C">3 参数 · 最小化 · ±2π 歧义</text>
<text class="lb" x="550" y="416" text-anchor="middle" fill="#7E3318" font-size="10">做增量（IMU 角增量天然）</text>
<text class="ts" x="550" y="432" text-anchor="middle" font-size="9">rv2q(Δθ) 右乘更新</text>

<!-- 中心到四节点 -->
<line x1="282" y1="225" x2="222" y2="145" stroke="#185FA5" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="398" y1="225" x2="458" y2="145" stroke="#185FA5" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="282" y1="275" x2="222" y2="355" stroke="#185FA5" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="398" y1="275" x2="458" y2="355" stroke="#185FA5" stroke-width="1.3" marker-end="url(#ar)"/>

<!-- 四者两两转换关系（环形） -->
<!-- 欧拉角 ↔ DCM (上边) -->
<line x1="222" y1="130" x2="458" y2="130" stroke="#3B6D11" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="tc" x="340" y="120" text-anchor="middle" fill="#27500A" font-size="9">欧拉角 ↔ R：Cnb = Rz(ψ)Ry(θ)Rx(φ)</text>

<!-- DCM ↔ 四元数 (右边) -->
<line x1="550" y1="152" x2="550" y2="348" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="tc" x="600" y="250" text-anchor="middle" fill="#0C447C" font-size="9" transform="rotate(90 600 250)">R ↔ q：q2r / quat_to_rotmat</text>

<!-- 四元数 ↔ 旋转向量 (下边) -->
<line x1="222" y1="442" x2="458" y2="442" stroke="#B5502A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="tc" x="340" y="456" text-anchor="middle" fill="#7E3318" font-size="9">q ↔ 旋转向量：rv2q / q2rv</text>

<!-- 旋转向量 ↔ DCM (左边) -->
<line x1="130" y1="152" x2="130" y2="348" stroke="#B5502A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="tc" x="80" y="250" text-anchor="middle" fill="#7E3318" font-size="9" transform="rotate(-90 80 250)">旋转向量 ↔ R：Rodrigues</text>

<!-- 欧拉角 ↔ 四元数（内部斜线，标注） -->
<text class="ts" x="150" y="300" text-anchor="middle" font-size="9" fill="#6A2C91">欧拉角 ↔ q（间接经 R）</text>

<!-- 底部注记 -->
<rect x="40" y="480" width="600" height="0"/>
<text class="ts" x="340" y="496" text-anchor="middle" font-weight="700" fill="#5F5E5A">没有完美表示（SO(3) 无法 3 参数全局无奇点）· 惯导分工：欧拉角给人看 / DCM 当桥梁 / 四元数存内部 / 旋转向量做增量</text>
</svg>
