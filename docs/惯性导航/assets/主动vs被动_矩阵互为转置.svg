<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="100%" role="img">
<title>主动旋转与被动旋转的矩阵互为转置</title>
<desc>左图主动旋转：向量转 θ、坐标系不动，矩阵为 [c, −s; s, c]，列的含义是旧轴搬到哪。右图被动旋转：坐标系转 θ、向量不动，矩阵为 [c, s; −s, c]，列的含义是旧轴在新系里怎么读。两者互为转置。</desc>
<style>
  .t{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#1b1f24}
  .th{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#1b1f24}
  .ts{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;fill:#5a6470}
  .tm{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#1b1f24}
  .pn{fill:#f7f9fb;stroke:#cfd6df;stroke-width:1}
  .ax{stroke:#c3cbd6;stroke-width:1;fill:none}
  .axd{stroke:#c3cbd6;stroke-width:1;fill:none;stroke-dasharray:4 3}
  .vv{stroke:#8a94a0;stroke-width:2.2;fill:none}
  .r1{stroke:#d23b3b;stroke-width:2.4;fill:none}
  .arc{stroke-width:1.3;fill:none;stroke-dasharray:3 2}
  .b1{stroke:#3b6fd2;stroke-width:1.6;fill:none}
  .bk{stroke:#5a6470;stroke-width:1.4;fill:none}
  .box{fill:#f1f3f6;stroke:#cfd6df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .t{fill:#e6e9ee} .th{fill:#e6e9ee} .ts{fill:#9aa5b1} .tm{fill:#e6e9ee}
    .pn{fill:#1a1e24;stroke:#39424d}
    .ax{stroke:#39424d} .axd{stroke:#39424d}
    .vv{stroke:#9aa5b1}
    .r1{stroke:#ff6b6b}
    .b1{stroke:#6f9bff}
    .bk{stroke:#9aa5b1}
    .box{fill:#1a1e24;stroke:#39424d}
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="24" text-anchor="middle">同一个 θ，两张脸：主动矩阵 与 被动矩阵 互为转置</text>

<rect class="pn" x="40" y="40" width="270" height="262" rx="10"/>
<text class="t" x="175" y="62" text-anchor="middle" font-weight="600">主动旋转（alibi）</text>
<text class="ts" x="175" y="80" text-anchor="middle">向量转 θ，坐标系不动</text>

<line class="ax" x1="125" y1="145" x2="225" y2="145"/>
<line class="ax" x1="175" y1="105" x2="175" y2="185"/>
<line class="vv" x1="175" y1="145" x2="212" y2="131" marker-end="url(#ar)"/>
<text class="ts" x="220" y="124">v</text>
<line class="r1" x1="175" y1="145" x2="185" y2="106" marker-end="url(#ar)"/>
<text class="ts" x="172" y="98">v′</text>
<path class="arc" style="stroke:#d23b3b" d="M203 135 A 30 30 0 0 0 183 116" marker-end="url(#ar)"/>
<text class="ts" x="208" y="112">θ</text>

<path class="bk" d="M134 218 L130 218 L130 264 L134 264"/>
<path class="bk" d="M216 218 L220 218 L220 264 L216 264"/>
<text class="tm" x="150" y="231" text-anchor="middle">c</text>
<text class="tm" x="200" y="231" text-anchor="middle">−s</text>
<text class="tm" x="150" y="253" text-anchor="middle">s</text>
<text class="tm" x="200" y="253" text-anchor="middle">c</text>

<text class="ts" x="175" y="286" text-anchor="middle">列 = 旧轴「搬到哪」</text>

<rect class="pn" x="370" y="40" width="270" height="262" rx="10"/>
<text class="t" x="505" y="62" text-anchor="middle" font-weight="600">被动旋转（alias）</text>
<text class="ts" x="505" y="80" text-anchor="middle">坐标系转 θ，向量不动</text>

<line class="axd" x1="455" y1="145" x2="555" y2="145"/>
<line class="axd" x1="505" y1="105" x2="505" y2="185"/>
<line class="b1" x1="482" y1="178" x2="528" y2="112"/>
<line class="b1" x1="538" y1="168" x2="472" y2="122"/>
<text class="ts" x="533" y="104">x′</text>
<text class="ts" x="461" y="114">y′</text>
<line class="vv" x1="505" y1="145" x2="542" y2="131" marker-end="url(#ar)"/>
<text class="ts" x="550" y="124">v</text>
<path class="arc" style="stroke:#3b6fd2" d="M535 145 A 30 30 0 0 0 522 120" marker-end="url(#ar)"/>
<text class="ts" x="545" y="139">θ</text>

<path class="bk" d="M464 218 L460 218 L460 264 L464 264"/>
<path class="bk" d="M546 218 L550 218 L550 264 L546 264"/>
<text class="tm" x="480" y="231" text-anchor="middle">c</text>
<text class="tm" x="530" y="231" text-anchor="middle">s</text>
<text class="tm" x="480" y="253" text-anchor="middle">−s</text>
<text class="tm" x="530" y="253" text-anchor="middle">c</text>

<text class="ts" x="505" y="286" text-anchor="middle">列 = 旧轴「在新系怎么读」</text>

<path class="bk" d="M318 168 L362 168" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text class="ts" x="340" y="156" text-anchor="middle">转置</text>

<rect class="box" x="40" y="322" width="600" height="62" rx="10"/>
<text class="t" x="340" y="346" text-anchor="middle">两个矩阵只差一个转置：±s 从右上 / 左下，换到左上 / 右下</text>
<text class="t" x="340" y="368" text-anchor="middle">「列 = 新地址」这个读法两边都成立，变的只是「地址」在哪种坐标里量</text>
</svg>
