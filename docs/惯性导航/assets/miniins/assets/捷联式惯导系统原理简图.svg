<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>

    <!-- 机体剖面线填充图案 -->
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7f8c8d" stroke-width="1.5" />
    </pattern>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; rx: 4px; filter: url(#shadow); }
    .text-main { font-family: 'PingFang SC', 'Microsoft YaHei', 'SimSun', sans-serif; font-size: 15px; fill: #2c3e50; text-anchor: middle; dominant-baseline: middle; }
    .text-title { font-family: 'PingFang SC', 'Microsoft YaHei', 'SimSun', sans-serif; font-size: 16px; font-weight: bold; fill: #1a252f; text-anchor: middle; }
    .text-var { font-family: 'Times New Roman', 'Cambria Math', serif; font-style: italic; font-size: 16px; fill: #111111; text-anchor: middle; }
    .line { stroke: #2c3e50; stroke-width: 1.8; fill: none; }
    .line-arrow { stroke: #2c3e50; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .sum-node { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; filter: url(#shadow); }
  </style>

  <!-- 背景 -->
  <rect width="100%" height="100%" class="bg" />

  <!-- 机体坐标系（左侧墙体/固连基座） -->
  <line x1="100" y1="80" x2="100" y2="440" stroke="#2c3e50" stroke-width="2.5" />
  <rect x="82" y="80" width="18" height="360" fill="url(#hatch)" />
  <text x="60" y="260" class="text-main" font-weight="bold" transform="rotate(-90, 60, 260)">机体坐标系 <tspan font-family="Times New Roman" font-style="italic">b</tspan></text>

  <!-- 模块方框 -->
  <!-- 1. 加速度计组合 -->
  <rect x="130" y="100" width="110" height="60" class="box" />
  <text x="185" y="121" class="text-main">加速度计</text>
  <text x="185" y="141" class="text-main">组合</text>

  <!-- 2. 比力坐标变换 -->
  <rect x="350" y="100" width="110" height="60" class="box" />
  <text x="405" y="121" class="text-main">比力坐标</text>
  <text x="405" y="141" class="text-main">变换</text>

  <!-- 3. 导航解算 -->
  <rect x="570" y="100" width="110" height="60" class="box" />
  <text x="625" y="130" class="text-main">导航解算</text>

  <!-- 4. 姿态阵初值 -->
  <text x="185" y="250" class="text-main">姿态阵</text>
  <text x="185" y="270" class="text-main">初值</text>

  <!-- 5. 姿态阵解算 -->
  <rect x="350" y="230" width="110" height="60" class="box" />
  <text x="405" y="251" class="text-main">姿态阵</text>
  <text x="405" y="271" class="text-main">解算</text>

  <!-- 6. 航向，姿态解算 -->
  <rect x="570" y="230" width="110" height="60" class="box" />
  <text x="625" y="251" class="text-main">航向，姿</text>
  <text x="625" y="271" class="text-main">态解算</text>

  <!-- 7. 陀螺组合 -->
  <rect x="130" y="370" width="110" height="60" class="box" />
  <text x="185" y="391" class="text-main">陀螺</text>
  <text x="185" y="411" class="text-main">组合</text>

  <!-- 8. 减法/求和节点 -->
  <circle cx="405" cy="400" r="14" class="sum-node" />
  <line x1="395" y1="390" x2="415" y2="410" stroke="#2c3e50" stroke-width="2" />
  <line x1="395" y1="410" x2="415" y2="390" stroke="#2c3e50" stroke-width="2" />
  <text x="424" y="392" class="text-main" font-size="18px" font-weight="bold">-</text>

  <!-- 9. 指令解算 -->
  <rect x="570" y="370" width="110" height="60" class="box" />
  <text x="625" y="400" class="text-main">指令解算</text>


  <!-- 连线与信号变量 -->

  <!-- 第一排信号线 -->
  <line x1="100" y1="130" x2="130" y2="130" class="line" />
  <line x1="240" y1="130" x2="350" y2="130" class="line-arrow" />
  <text x="295" y="118" class="text-var">f&#771;<tspan baseline-shift="super" font-size="11px">b</tspan></text>

  <line x1="460" y1="130" x2="570" y2="130" class="line-arrow" />
  <text x="515" y="118" class="text-var">f&#771;<tspan baseline-shift="super" font-size="11px">n</tspan></text>

  <line x1="680" y1="130" x2="810" y2="130" class="line-arrow" />
  <text x="750" y="115" class="text-main">位置，速度</text>

  <!-- 速度、位置初值 输入线 -->
  <line x1="625" y1="50" x2="625" y2="100" class="line-arrow" />
  <text x="625" y="38" class="text-main">速度，位置初值</text>

  <!-- 第二排信号线 -->
  <line x1="225" y1="260" x2="350" y2="260" class="line-arrow" />
  <line x1="405" y1="230" x2="405" y2="160" class="line-arrow" />
  <line x1="460" y1="260" x2="570" y2="260" class="line-arrow" />
  <line x1="680" y1="260" x2="810" y2="260" class="line-arrow" />
  <text x="750" y="245" class="text-main">航向，姿态</text>

  <!-- 第三排信号线 -->
  <line x1="100" y1="400" x2="130" y2="400" class="line" />
  <line x1="240" y1="400" x2="391" y2="400" class="line-arrow" />
  <text x="315" y="388" class="text-var">&#969;&#771;<tspan baseline-shift="sub" font-size="11px">ib</tspan><tspan baseline-shift="super" font-size="11px">b</tspan></text>

  <line x1="405" y1="386" x2="405" y2="290" class="line-arrow" />
  <text x="428" y="340" class="text-var">&#969;&#770;<tspan baseline-shift="sub" font-size="11px">nb</tspan><tspan baseline-shift="super" font-size="11px">b</tspan></text>

  <line x1="570" y1="400" x2="419" y2="400" class="line-arrow" />
  <text x="495" y="388" class="text-var">&#969;&#770;<tspan baseline-shift="sub" font-size="11px">in</tspan><tspan baseline-shift="super" font-size="11px">b</tspan></text>

  <!-- 导航输出反馈回指令解算的反馈线 -->
  <line x1="740" y1="130" x2="740" y2="400" class="line" />
  <line x1="740" y1="400" x2="680" y2="400" class="line-arrow" />

  <!-- 图题 -->
  <text x="460" y="495" class="text-title">图 9.1.1 捷联式惯导系统原理简图</text>
</svg>
