<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill:#f0f4f8; stroke:#4a5568; stroke-width:1.5; rx:6; }
      .databox { fill:#e6fffa; stroke:#38b2ac; stroke-width:1.5; rx:6; }
      .errbox { fill:#fff5f5; stroke:#f56565; stroke-width:1.5; rx:6; }
      .txt { font-family: sans-serif; font-size:13; fill:#2d3748; }
      .lbl { font-family: sans-serif; font-size:11; fill:#718096; }
      .arr { stroke:#4a5568; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- 真值轨迹 -->
  <rect x="20" y="90" width="90" height="50" class="databox"/>
  <text x="65" y="110" text-anchor="middle" class="txt">trj.avp</text>
  <text x="65" y="128" text-anchor="middle" class="lbl">P1 真值轨迹</text>

  <!-- odsimu -->
  <rect x="140" y="90" width="100" height="50" class="box"/>
  <text x="190" y="110" text-anchor="middle" class="txt">odsimu</text>
  <text x="190" y="128" text-anchor="middle" class="lbl">位置差分→dS</text>
  <path d="M110,115 L140,115" class="arr"/>

  <!-- 安装误差/尺度 -->
  <rect x="280" y="20" width="110" height="50" class="errbox"/>
  <text x="335" y="40" text-anchor="middle" class="txt">inst + dinst</text>
  <text x="335" y="58" text-anchor="middle" class="lbl">安装误差</text>
  <path d="M335,70 L335,90" class="arr"/>

  <!-- od 数据 -->
  <rect x="280" y="90" width="70" height="50" class="databox"/>
  <text x="315" y="110" text-anchor="middle" class="txt">od</text>
  <text x="315" y="128" text-anchor="middle" class="lbl">里程增量</text>
  <path d="M240,115 L280,115" class="arr"/>

  <!-- trj.imu / gyro -->
  <rect x="20" y="170" width="90" height="50" class="databox"/>
  <text x="65" y="190" text-anchor="middle" class="txt">trj.imu</text>
  <text x="65" y="208" text-anchor="middle" class="lbl">陀螺增量</text>
  <rect x="140" y="170" width="100" height="50" class="errbox"/>
  <text x="190" y="190" text-anchor="middle" class="txt">+ eb</text>
  <text x="190" y="208" text-anchor="middle" class="lbl">陀螺零偏</text>
  <path d="M110,195 L140,195" class="arr"/>
  <rect x="270" y="170" width="90" height="50" class="databox"/>
  <text x="315" y="190" text-anchor="middle" class="txt">wm</text>
  <text x="315" y="208" text-anchor="middle" class="lbl">带偏置陀螺</text>
  <path d="M240,195 L270,195" class="arr"/>

  <!-- drinit -->
  <rect x="400" y="90" width="100" height="50" class="box"/>
  <text x="450" y="110" text-anchor="middle" class="txt">drinit</text>
  <text x="450" y="128" text-anchor="middle" class="lbl">初始化 DR 结构</text>
  <path d="M350,115 L400,115" class="arr"/>
  <path d="M315,170 L315,140 L400,140" class="arr"/>

  <!-- drupdate loop -->
  <rect x="540" y="90" width="110" height="50" class="box"/>
  <text x="595" y="110" text-anchor="middle" class="txt">drupdate</text>
  <text x="595" y="128" text-anchor="middle" class="lbl">主循环 nn=2</text>
  <path d="M500,115 L540,115" class="arr"/>

  <!-- output -->
  <rect x="690" y="90" width="90" height="50" class="databox"/>
  <text x="735" y="110" text-anchor="middle" class="txt">avp_DR</text>
  <text x="735" y="128" text-anchor="middle" class="lbl">航位推算结果</text>
  <path d="M650,115 L690,115" class="arr"/>

  <!-- 反馈箭头 -->
  <path d="M595,140 L595,170 L650,170 L650,140" class="arr" style="marker-end:url(#arrow);"/>
  <text x="625" y="185" text-anchor="middle" class="lbl">循环更新 qnb/pos</text>
</svg>