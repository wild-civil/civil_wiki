<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <!-- 背景 -->
  <rect width="680" height="400" fill="#f8fafc"/>
  <rect x="0" y="0" width="680" height="400" fill="none" stroke="#cbd5e1"/>

  <!-- 标题 -->
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">一致性：声称的协方差 vs 真实的误差散布</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#64748b">P 椭圆 = 滤波器"我认为的误差范围"；散布点 = 实际误差落点</text>

  <!-- ============ 面板 1：一致 ============ -->
  <rect x="15" y="62" width="200" height="175" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">✓ 一致（合理）</text>
  <!-- P 椭圆 -->
  <ellipse cx="115" cy="140" rx="42" ry="26" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 3"/>
  <!-- 误差点 -->
  <circle cx="85" cy="125" r="2.4" fill="#1e293b"/>
  <circle cx="100" cy="120" r="2.4" fill="#1e293b"/>
  <circle cx="115" cy="115" r="2.4" fill="#1e293b"/>
  <circle cx="135" cy="122" r="2.4" fill="#1e293b"/>
  <circle cx="147" cy="135" r="2.4" fill="#1e293b"/>
  <circle cx="143" cy="152" r="2.4" fill="#1e293b"/>
  <circle cx="127" cy="162" r="2.4" fill="#1e293b"/>
  <circle cx="107" cy="158" r="2.4" fill="#1e293b"/>
  <circle cx="90" cy="148" r="2.4" fill="#1e293b"/>
  <circle cx="120" cy="133" r="2.4" fill="#1e293b"/>
  <circle cx="105" cy="143" r="2.4" fill="#1e293b"/>
  <circle cx="135" cy="145" r="2.4" fill="#1e293b"/>
  <text x="115" y="226" text-anchor="middle" font-size="10" fill="#475569">点 ≈ 全在椭圆内 → P 与真实吻合</text>

  <!-- ============ 面板 2：过自信 ============ -->
  <rect x="240" y="62" width="200" height="175" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">✗ 过自信（P 太小）</text>
  <!-- P 椭圆（小） -->
  <ellipse cx="340" cy="140" rx="16" ry="10" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3"/>
  <!-- 误差点（大散布） -->
  <circle cx="300" cy="110" r="2.4" fill="#1e293b"/>
  <circle cx="375" cy="115" r="2.4" fill="#1e293b"/>
  <circle cx="350" cy="180" r="2.4" fill="#1e293b"/>
  <circle cx="325" cy="175" r="2.4" fill="#1e293b"/>
  <circle cx="380" cy="155" r="2.4" fill="#1e293b"/>
  <circle cx="295" cy="150" r="2.4" fill="#1e293b"/>
  <circle cx="365" cy="105" r="2.4" fill="#1e293b"/>
  <circle cx="310" cy="170" r="2.4" fill="#1e293b"/>
  <circle cx="340" cy="185" r="2.4" fill="#1e293b"/>
  <circle cx="385" cy="135" r="2.4" fill="#1e293b"/>
  <circle cx="290" cy="130" r="2.4" fill="#1e293b"/>
  <circle cx="330" cy="100" r="2.4" fill="#1e293b"/>
  <text x="340" y="226" text-anchor="middle" font-size="10" fill="#475569">点大量溢出 → 实际误差远大于声称 → NIS 偏高</text>

  <!-- ============ 面板 3：过保守 ============ -->
  <rect x="465" y="62" width="200" height="175" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="565" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">✗ 过保守（P 太大）</text>
  <!-- P 椭圆（大） -->
  <ellipse cx="565" cy="140" rx="70" ry="44" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3"/>
  <!-- 误差点（聚集） -->
  <circle cx="555" cy="132" r="2.4" fill="#1e293b"/>
  <circle cx="573" cy="134" r="2.4" fill="#1e293b"/>
  <circle cx="565" cy="130" r="2.4" fill="#1e293b"/>
  <circle cx="575" cy="146" r="2.4" fill="#1e293b"/>
  <circle cx="554" cy="149" r="2.4" fill="#1e293b"/>
  <circle cx="568" cy="144" r="2.4" fill="#1e293b"/>
  <circle cx="553" cy="142" r="2.4" fill="#1e293b"/>
  <circle cx="577" cy="138" r="2.4" fill="#1e293b"/>
  <circle cx="562" cy="152" r="2.4" fill="#1e293b"/>
  <circle cx="570" cy="128" r="2.4" fill="#1e293b"/>
  <circle cx="560" cy="137" r="2.4" fill="#1e293b"/>
  <circle cx="572" cy="150" r="2.4" fill="#1e293b"/>
  <text x="565" y="226" text-anchor="middle" font-size="10" fill="#475569">点挤在中心一角 → 实际误差远小于声称 → NIS 偏低</text>

  <!-- ============ 底部公式条 ============ -->
  <rect x="15" y="252" width="650" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="276" font-size="12" font-weight="bold" fill="#2563eb">怎么"量化"一致性 → 二次型归一化：</text>
  <text x="30" y="302" font-size="12" fill="#1e293b">NEES = δxᵀ P⁻¹ δx   ~   χ²(n_x)　　　δx = x_true − x̂（需真值 → 仿真 / SIL）</text>
  <text x="30" y="326" font-size="12" fill="#1e293b">NIS  = rᵀ S⁻¹ r      ~   χ²(m)　　　　r = z − h(x̂)，S = H P Hᵀ + R（在线可算）</text>
  <text x="30" y="356" font-size="11" fill="#475569">P 正确 ⇒ NEES/NIS 服从 χ²：均值 E[NEES]=n_x、E[NIS]=m。长期平均偏离 m ⇒ P 或 R 与真实不符（过自信 / 过保守）。</text>
  <text x="30" y="374" font-size="10" fill="#94a3b8">这正是"量测更新合不合理"的闸门：先验协方差错了，卡尔曼增益 K 就会错。</text>
</svg>
