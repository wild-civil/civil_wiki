<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <style>
    .ax   { stroke-width: 2.5; fill: none; }
    .vec  { stroke-width: 3.5; fill: none; }
    .lbl  { font-size: 16px; font-weight: 700; }
    .sub  { font-size: 13px; fill: #555; }
    .dash { stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .title{ font-size: 15px; font-weight: 700; fill: #222; }
  </style>

  <defs>
    <marker id="ah-red"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d32f2f"/></marker>
    <marker id="ah-blue"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2e7d32"/></marker>
  </defs>

  <!-- ============ 左：右手系坐标架 ============ -->
  <text x="24" y="30" class="title">① 右手系坐标架（循环规则）</text>

  <g>
    <!-- 原点 -->
    <circle cx="140" cy="250" r="3.5" fill="#333"/>
    <!-- X 轴（红，向右） -->
    <line x1="140" y1="250" x2="290" y2="250" class="ax" stroke="#d32f2f" marker-end="url(#ah-red)"/>
    <!-- Y 轴（蓝，向上） -->
    <line x1="140" y1="250" x2="140" y2="100" class="ax" stroke="#1565c0" marker-end="url(#ah-blue)"/>
    <!-- Z 轴（绿，朝外/右上） -->
    <line x1="140" y1="250" x2="258" y2="146" class="ax" stroke="#2e7d32" marker-end="url(#ah-green)"/>
  </g>
  <text x="296" y="254" class="lbl" fill="#d32f2f">X</text>
  <text x="120" y="92"  class="lbl" fill="#1565c0">Y</text>
  <text x="262" y="142" class="lbl" fill="#2e7d32">Z</text>

  <!-- 循环箭头提示 X->Y->Z -->
  <path d="M 178 250 A 38 38 0 0 1 200 222" class="dash" stroke="#888"/>
  <text x="206" y="216" class="sub">X×Y = Z</text>
  <text x="24" y="300" class="sub">正循环：X×Y=Z， Y×Z=X， Z×X=Y；逆循环（如 X×Z）取负。</text>

  <!-- ============ 右：叉乘 a×b 垂直于两者 ============ -->
  <text x="410" y="30" class="title">② 叉乘 a×b 同时垂直于 a、b</text>

  <g>
    <circle cx="520" cy="250" r="3.5" fill="#333"/>
    <!-- a（红） -->
    <line x1="520" y1="250" x2="636" y2="212" class="vec" stroke="#d32f2f" marker-end="url(#ah-red)"/>
    <!-- b（蓝） -->
    <line x1="520" y1="250" x2="566" y2="128" class="vec" stroke="#1565c0" marker-end="url(#ah-blue)"/>
    <!-- a×b（绿，垂直于 a、b 所在平面） -->
    <line x1="520" y1="250" x2="520" y2="96"  class="vec" stroke="#2e7d32" marker-end="url(#ah-green)"/>
  </g>
  <text x="612" y="208" class="lbl" fill="#d32f2f">a</text>
  <text x="572" y="124" class="lbl" fill="#1565c0">b</text>
  <text x="528" y="92"  class="lbl" fill="#2e7d32">a×b</text>

  <!-- 垂直小标记：a×b 与 a、b 的直角 -->
  <path d="M 520 226 L 544 226 L 544 250" class="dash" stroke="#2e7d32"/>
  <text x="410" y="300" class="sub">模长 |a×b| = |a||b|sinθ；方向由右手定则定（四指 a→b，拇指指向 a×b）。</text>
</svg>
