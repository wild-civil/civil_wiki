<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>MEMS 振动陀螺：科里奥利效应</title>
<desc>MEMS 陀螺让质量块沿驱动轴持续振动，当载体绕输入轴旋转时，科里奥利力把振动耦合到感测轴，其大小正比于输入角速度。</desc>
<style>
.th{font-size:14px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.eq{font-size:15px;font-weight:700;font-family:'Cambria Math','Times New Roman',serif;}
</style>
<defs>
<marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B5502A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="aF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 标题 -->
<text class="th" x="340" y="30" text-anchor="middle" fill="#0C447C">MEMS 振动陀螺：科里奥利效应（Coriolis Effect）</text>

<!-- 左：结构示意 -->
<text class="th" x="165" y="62" text-anchor="middle" fill="#27500A">结构（俯视）</text>
<!-- 外框 -->
<rect x="55" y="78" width="220" height="220" rx="10" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.6"/>
<!-- 驱动方向轨道 -->
<line x1="135" y1="188" x2="200" y2="188" stroke="#3B6D11" stroke-width="1.2" stroke-dasharray="4 4"/>
<!-- 质量块 -->
<rect x="150" y="168" width="34" height="34" rx="5" fill="#FDE9D6" stroke="#854F0B" stroke-width="1.4"/>
<text class="lb" x="167" y="190" text-anchor="middle" fill="#854F0B">m</text>
<!-- 感测轴弹簧（上下） -->
<path d="M167 168 q4 -4 0 -8 q-4 -4 0 -8" fill="none" stroke="#185FA5" stroke-width="1.4"/>
<path d="M167 202 q4 4 0 8 q-4 4 0 8" fill="none" stroke="#185FA5" stroke-width="1.4"/>
<!-- 驱动轴弹簧（左右） -->
<path d="M150 185 q-4 -4 -8 0 q-4 4 -8 0" fill="none" stroke="#3B6D11" stroke-width="1.4"/>
<path d="M184 185 q4 -4 8 0 q4 4 8 0" fill="none" stroke="#3B6D11" stroke-width="1.4"/>
<!-- 驱动振动箭头 -->
<line x1="132" y1="185" x2="100" y2="185" stroke="#3B6D11" stroke-width="2" marker-end="url(#aG)"/>
<line x1="202" y1="185" x2="234" y2="185" stroke="#3B6D11" stroke-width="2" marker-end="url(#aG)"/>
<text class="ts" x="110" y="176" fill="#27500A">驱动 v_drive</text>
<text class="ts" x="212" y="176" fill="#27500A">驱动 v_drive</text>
<!-- 感测轴箭头 -->
<line x1="167" y1="164" x2="167" y2="140" stroke="#185FA5" stroke-width="2" marker-end="url(#aF)"/>
<line x1="167" y1="206" x2="167" y2="230" stroke="#185FA5" stroke-width="2" marker-end="url(#aF)"/>
<text class="ts" x="172" y="150" fill="#0C447C">感测 F_c</text>

<!-- 右：原理 -->
<text class="th" x="500" y="62" text-anchor="middle" fill="#27500A">原理：角速度 → 科里奥利力</text>
<!-- 旋转 -->
<ellipse cx="500" cy="170" rx="120" ry="110" fill="none" stroke="#B5502A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="lb" x="500" y="160" text-anchor="middle" fill="#B5502A">输入角速度 ω</text>
<text class="ts" x="500" y="176" text-anchor="middle" fill="#B5502A">（绕感测轴旋转）</text>
<!-- 公式 -->
<rect x="410" y="196" width="180" height="56" rx="8" fill="#FDF3E7" stroke="#854F0B" stroke-width="1.2"/>
<text class="eq" x="500" y="222" text-anchor="middle" fill="#B5502A">F_c = −2m (ω × v_drive)</text>
<text class="ts" x="500" y="242" text-anchor="middle">科里奥利力 ∝ 输入角速度 ω</text>

<!-- 底部：解调流程 -->
<text class="th" x="340" y="330" text-anchor="middle" fill="#0C447C">测量链：驱动振动 → 旋转耦合 → 感测位移 → 解调出角速度</text>
<rect x="60" y="348" width="130" height="34" rx="6" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.1"/>
<text class="ts" x="125" y="370" text-anchor="middle">驱动轴持续振动</text>
<line x1="190" y1="365" x2="225" y2="365" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#af)"/>
<rect x="228" y="348" width="130" height="34" rx="6" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.1"/>
<text class="ts" x="293" y="370" text-anchor="middle">ω 输入 → F_c 耦合到感测轴</text>
<line x1="358" y1="365" x2="393" y2="365" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#af)"/>
<rect x="396" y="348" width="130" height="34" rx="6" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.1"/>
<text class="ts" x="461" y="370" text-anchor="middle">感测电容变化 → 解调出 ω</text>
<line x1="526" y1="365" x2="545" y2="365" stroke="#5F5E5A" stroke-width="1.6"/>
<text class="ts" x="590" y="370" text-anchor="middle">角速度输出</text>

<!-- 底部注 -->
<text class="ts" x="340" y="396" text-anchor="middle">MEMS 无法做"大转子"，就用"振动质量块"当等效转子——这正是 MEMS 陀螺与机械陀螺、光纤陀螺最大的区别。</text>
</svg>
