<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
<title>Allan 曲线五段噪声指纹（斜率与单位）</title>
<desc>Allan 曲线的五段标准斜率：量化噪声 -1、ARW -1/2、零偏不稳定性 0、速率随机游走 +1/2、速率斜坡 +1。从斜率与 σ 值就能反推各噪声项的物理参数。</desc>
<style>
.th{font-size:13.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 标题 -->
<text class="th" x="340" y="26" text-anchor="middle" fill="#0C447C">Allan 曲线五段噪声指纹（log-log 斜率 + 物理意义）</text>

<!-- 坐标轴 -->
<line x1="60" y1="320" x2="640" y2="320" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#at)"/>
<line x1="60" y1="320" x2="60" y2="50" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#at)"/>
<text class="ts" x="48" y="40" text-anchor="middle" font-size="11">log σ</text>
<text class="ts" x="650" y="322" text-anchor="end" font-size="11">log τ →</text>

<!-- 示意曲线：QN陡降 → ARW缓降 → BI平 → RRW升 → RR陡升 -->
<polyline points="60,82 110,150 170,220 240,265 340,288 440,300 500,275 560,232 640,160" fill="none" stroke="#0C447C" stroke-width="2.4"/>

<!-- 五个区间底色（淡化） -->
<rect x="60" y="50" width="80" height="270" fill="#B5502A" opacity="0.06"/>
<rect x="140" y="50" width="110" height="270" fill="#3B6D11" opacity="0.06"/>
<rect x="250" y="50" width="100" height="270" fill="#854F0B" opacity="0.06"/>
<rect x="350" y="50" width="130" height="270" fill="#185FA5" opacity="0.06"/>
<rect x="480" y="50" width="160" height="270" fill="#7E3318" opacity="0.06"/>

<!-- 五段标签 + 单位 -->
<text class="lb" x="100" y="60" text-anchor="middle" fill="#B5502A" font-size="10">量化噪声</text>
<text class="lb" x="100" y="74" text-anchor="middle" fill="#B5502A" font-size="10">QN</text>
<text class="ts" x="100" y="345" text-anchor="middle" font-size="10" fill="#B5502A">斜率 −1   σ ∝ 1/τ</text>
<text class="ts" x="100" y="358" text-anchor="middle" font-size="9" fill="#5F5E5A">Q: arcsec</text>

<text class="lb" x="195" y="60" text-anchor="middle" fill="#3B6D11" font-size="10">角度随机游走</text>
<text class="lb" x="195" y="74" text-anchor="middle" fill="#3B6D11" font-size="10">ARW</text>
<text class="ts" x="195" y="345" text-anchor="middle" font-size="10" fill="#3B6D11">斜率 −1/2  σ = N/√τ</text>
<text class="ts" x="195" y="358" text-anchor="middle" font-size="9" fill="#5F5E5A">N: °/√h</text>

<text class="lb" x="300" y="60" text-anchor="middle" fill="#854F0B" font-size="10">零偏不稳定性</text>
<text class="lb" x="300" y="74" text-anchor="middle" fill="#854F0B" font-size="10">BI</text>
<text class="ts" x="300" y="345" text-anchor="middle" font-size="10" fill="#854F0B">斜率 0 (平台)</text>
<text class="ts" x="300" y="358" text-anchor="middle" font-size="9" fill="#5F5E5A">B: °/h</text>

<text class="lb" x="415" y="60" text-anchor="middle" fill="#185FA5" font-size="10">速率随机游走</text>
<text class="lb" x="415" y="74" text-anchor="middle" fill="#185FA5" font-size="10">RRW</text>
<text class="ts" x="415" y="345" text-anchor="middle" font-size="10" fill="#185FA5">斜率 +1/2  σ = K·√(τ/3)</text>
<text class="ts" x="415" y="358" text-anchor="middle" font-size="9" fill="#5F5E5A">K: °/h^1.5</text>

<text class="lb" x="560" y="60" text-anchor="middle" fill="#7E3318" font-size="10">速率斜坡</text>
<text class="lb" x="560" y="74" text-anchor="middle" fill="#7E3318" font-size="10">RR</text>
<text class="ts" x="560" y="345" text-anchor="middle" font-size="10" fill="#7E3318">斜率 +1  σ = R·τ/√2</text>
<text class="ts" x="560" y="358" text-anchor="middle" font-size="9" fill="#5F5E5A">R: °/h²</text>
</svg>
