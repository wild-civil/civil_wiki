<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img">
<title>02 一图流：姿态的四种表示</title>
<desc>四种姿态表示：欧拉角(给人看)、旋转矩阵DCM(当桥梁)、四元数(存内部)、旋转向量(做增量)。各有取舍，各司其职。</desc>
<style>
.th{font-size:13.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>

<text class="th" x="340" y="26" text-anchor="middle" fill="#0C447C">姿态的四种表示（一图流）</text>

<!-- 中央：SO(3) -->
<ellipse cx="340" cy="170" rx="120" ry="60" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.6"/>
<text class="th" x="340" y="165" text-anchor="middle" fill="#0C447C">SO(3)</text>
<text class="ts" x="340" y="183" text-anchor="middle">3 自由度旋转群</text>
<text class="ts" x="340" y="197" text-anchor="middle">姿态的本质</text>

<!-- 四个角块 -->
<rect x="30" y="40" width="150" height="56" rx="10" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.5"/>
<text class="th" x="105" y="62" text-anchor="middle" fill="#B5502A">欧拉角 yaw/pitch/roll</text>
<text class="ts" x="105" y="80" text-anchor="middle">❌ 万向锁 ⭐ 给人看</text>

<rect x="500" y="40" width="150" height="56" rx="10" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="th" x="575" y="62" text-anchor="middle" fill="#185FA5">旋转向量 φu</text>
<text class="ts" x="575" y="80" text-anchor="middle">❌ 大角 wrap ⭐ 做增量</text>

<rect x="30" y="240" width="150" height="56" rx="10" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.5"/>
<text class="th" x="105" y="262" text-anchor="middle" fill="#3B6D11">旋转矩阵 DCM</text>
<text class="ts" x="105" y="280" text-anchor="middle">❌ 9 数冗余 ⭐ 当桥梁</text>

<rect x="500" y="240" width="150" height="56" rx="10" fill="#FDF3E7" stroke="#854F0B" stroke-width="1.5"/>
<text class="th" x="575" y="262" text-anchor="middle" fill="#854F0B">四元数 [w,x,y,z] ⭐</text>
<text class="ts" x="575" y="280" text-anchor="middle">❌ 双覆盖 ⭐ 存内部</text>

<!-- 连线 -->
<line x1="180" y1="70" x2="235" y2="125" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a2)"/>
<line x1="500" y1="70" x2="445" y2="125" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a2)"/>
<line x1="180" y1="268" x2="235" y2="213" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a2)"/>
<line x1="500" y1="268" x2="445" y2="213" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a2)"/>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 一句话 -->
<rect x="20" y="310" width="640" height="0" />
<text class="ts" x="340" y="308" text-anchor="middle" fill="#5F5E5A">一句话：欧拉角给人看、旋转矩阵当桥梁、四元数存内部、旋转向量做增量</text>
</svg>
