<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">卡尔曼滤波五方程：时间更新 + 量测更新</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#4a5568">（牛小骥 I2NAV 讲义第 4 讲式 4-8 + 本项目 ESKF 15 态对应）</text>

  <!-- 中央状态块 -->
  <rect x="270" y="200" width="140" height="80" rx="10" fill="#fefcbf" stroke="#975a16" stroke-width="2"/>
  <text x="340" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#744210">状态估计 x̂</text>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#744210">协方差 P</text>
  <text x="340" y="268" text-anchor="middle" font-size="10" fill="#744210">（"我对状态了解多少"）</text>

  <!-- 时间更新（左半） -->
  <rect x="50" y="80" width="180" height="160" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">时间更新（预测）</text>
  <text x="140" y="125" text-anchor="middle" font-size="10" fill="#4a5568">讲义式 4-5</text>
  <text x="60" y="150" font-size="12" fill="#1a202c">① x̂⁻ = Φ·x̂</text>
  <text x="60" y="172" font-size="12" fill="#1a202c">② P⁻ = ΦPΦᵀ + ΓQΓᵀ</text>
  <text x="60" y="210" font-size="10" fill="#4a5568">→ 状态先按模型走一步</text>
  <text x="60" y="226" font-size="10" fill="#4a5568">→ 不确定性增大（P 变大）</text>

  <!-- 量测更新（右半） -->
  <rect x="450" y="80" width="180" height="160" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="540" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">量测更新（修正）</text>
  <text x="540" y="125" text-anchor="middle" font-size="10" fill="#4a5568">讲义式 6-8</text>
  <text x="460" y="150" font-size="12" fill="#1a202c">③ S = HPHᵀ + R</text>
  <text x="460" y="172" font-size="12" fill="#1a202c">④ K = PHᵀ·S⁻¹</text>
  <text x="460" y="194" font-size="12" fill="#1a202c">⑤ x̂⁺ = x̂⁻ + K·(z-Hx̂)</text>
  <text x="460" y="216" font-size="12" fill="#1a202c">   P⁺ = (I-KH)·P⁻</text>
  <text x="460" y="240" font-size="10" fill="#4a5568">→ 用量测修正预测</text>
  <text x="460" y="256" font-size="10" fill="#4a5568">→ 不确定性减小（P 变小）</text>

  <!-- 箭头：预测→状态 -->
  <line x1="230" y1="160" x2="263" y2="225" stroke="#2b6cb0" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="248" y="200" font-size="10" fill="#2b6cb0" font-weight="bold">Φ, Q</text>

  <!-- 箭头：状态→修正 -->
  <line x1="410" y1="225" x2="445" y2="160" stroke="#c53030" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="427" y="200" font-size="10" fill="#c53030" font-weight="bold">z, H, R</text>

  <!-- 量测输入 -->
  <rect x="495" y="320" width="90" height="44" rx="8" fill="#fef3c7" stroke="#b7791f" stroke-width="1.2"/>
  <text x="540" y="343" text-anchor="middle" font-size="12" fill="#975a16" font-weight="bold">量测 zₖ</text>
  <text x="540" y="360" text-anchor="middle" font-size="10" fill="#975a16">（GNSS / 气压计）</text>
  <line x1="540" y1="319" x2="540" y2="245" stroke="#b7791f" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 模型输入 -->
  <rect x="95" y="320" width="90" height="44" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/>
  <text x="140" y="343" text-anchor="middle" font-size="12" fill="#2f855a" font-weight="bold">模型 Φ</text>
  <text x="140" y="360" text-anchor="middle" font-size="10" fill="#2f855a">（机械编排）</text>
  <line x1="140" y1="319" x2="140" y2="245" stroke="#2f855a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 底部直觉 -->
  <rect x="40" y="400" width="600" height="46" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="1"/>
  <text x="340" y="420" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="bold">K 是"信谁"的开关：K≈1 信量测（Q 大/P 小）；K≈0 信预测（R 大/P 大）</text>
  <text x="340" y="437" text-anchor="middle" font-size="11" fill="#2d3748">本项目 ESKF 15 态：Φ=机械编排（09 篇 F 矩阵），H=GNSS 位置/速度/气压高（13 篇松组合）</text>
</svg>