<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>坐标变换与旋转矩阵：三轴符号差异与右手系循环顺序</title>
<desc>被动旋转下，单轴旋转矩阵在旋转平面内的 2x2 子矩阵符号：绕 X 与绕 Z 为 [c s; -s c]（正循环），绕 Y 为 [c -s; s c]（逆循环，符号相反）。根源是右手系循环顺序 X→Y→Z→X，唯 X×Z=-Y。</desc>
<style>
.th{font-size:14px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:11px;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.tk{font-size:12px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.cell{font-size:16px;font-weight:700;font-family:'Consolas','Segoe UI',monospace;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle" fill="#0C447C">单轴被动旋转矩阵：为什么绕 Y 的符号与 X、Z 相反</text>

<!-- Card 1: 绕 X -->
<rect x="30" y="55" width="175" height="160" rx="10" fill="#F4F8FC" stroke="#185FA5" stroke-width="0.9"/>
<text class="th" x="117" y="80" text-anchor="middle" fill="#0C447C">绕 X 轴（横滚 φ）</text>
<rect x="66" y="98" width="52" height="38" fill="#EAF1FA" stroke="#B9CFE6"/><text class="cell" x="92" y="123" text-anchor="middle" fill="#0C447C">+c</text>
<rect x="118" y="98" width="52" height="38" fill="#EAF1FA" stroke="#B9CFE6"/><text class="cell" x="144" y="123" text-anchor="middle" fill="#0C447C">+s</text>
<rect x="66" y="136" width="52" height="38" fill="#FBEAEA" stroke="#E6B9B9"/><text class="cell" x="92" y="161" text-anchor="middle" fill="#C0392B">-s</text>
<rect x="118" y="136" width="52" height="38" fill="#EAF1FA" stroke="#B9CFE6"/><text class="cell" x="144" y="161" text-anchor="middle" fill="#0C447C">+c</text>
<text class="tk" x="117" y="205" text-anchor="middle" fill="#2E7D32">Y→Z 正循环 </text>

<!-- Card 2: 绕 Z -->
<rect x="252" y="55" width="175" height="160" rx="10" fill="#F4F8FC" stroke="#185FA5" stroke-width="0.9"/>
<text class="th" x="339" y="80" text-anchor="middle" fill="#0C447C">绕 Z 轴（偏航 ψ）</text>
<rect x="288" y="98" width="52" height="38" fill="#EAF1FA" stroke="#B9CFE6"/><text class="cell" x="314" y="123" text-anchor="middle" fill="#0C447C">+c</text>
<rect x="340" y="98" width="52" height="38" fill="#EAF1FA" stroke="#B9CFE6"/><text class="cell" x="366" y="123" text-anchor="middle" fill="#0C447C">+s</text>
<rect x="288" y="136" width="52" height="38" fill="#FBEAEA" stroke="#E6B9B9"/><text class="cell" x="314" y="161" text-anchor="middle" fill="#C0392B">-s</text>
<rect x="340" y="136" width="52" height="38" fill="#EAF1FA" stroke="#B9CFE6"/><text class="cell" x="366" y="161" text-anchor="middle" fill="#0C447C">+c</text>
<text class="tk" x="339" y="205" text-anchor="middle" fill="#2E7D32">X→Y 正循环 </text>

<!-- Card 3: 绕 Y -->
<rect x="474" y="55" width="175" height="160" rx="10" fill="#FCF3EC" stroke="#C77B2B" stroke-width="0.9"/>
<text class="th" x="561" y="80" text-anchor="middle" fill="#633806">绕 Y 轴（俯仰 θ）</text>
<rect x="510" y="98" width="52" height="38" fill="#FBEEDD" stroke="#E6C9A8"/><text class="cell" x="536" y="123" text-anchor="middle" fill="#0C447C">+c</text>
<rect x="562" y="98" width="52" height="38" fill="#FBEAEA" stroke="#E6B9B9"/><text class="cell" x="588" y="123" text-anchor="middle" fill="#C0392B">-s</text>
<rect x="510" y="136" width="52" height="38" fill="#EAF6EC" stroke="#B9E0C2"/><text class="cell" x="536" y="161" text-anchor="middle" fill="#2E7D32">+s</text>
<rect x="562" y="136" width="52" height="38" fill="#FBEEDD" stroke="#E6C9A8"/><text class="cell" x="588" y="161" text-anchor="middle" fill="#0C447C">+c</text>
<text class="tk" x="561" y="205" text-anchor="middle" fill="#C0392B">X→Z 逆循环  → 符号相反</text>

<!-- Bottom key box -->
<rect x="30" y="238" width="620" height="208" rx="10" fill="#F7F5EF" stroke="#5F5E5A" stroke-width="0.6"/>
<text class="th" x="50" y="262" fill="#5F5E5A">右手系循环顺序（底层机理）</text>

<!-- triad  -->
<line x1="105" y1="375" x2="185" y2="375" stroke="#D97A00" stroke-width="2" marker-end="url(#ar)"/>
<line x1="105" y1="375" x2="105" y2="290" stroke="#2E8B2E" stroke-width="2" marker-end="url(#ar)"/>
<line x1="105" y1="375" x2="50" y2="410" stroke="#1F6FB2" stroke-width="2" marker-end="url(#ar)"/>
<text class="th" x="170" y="365" text-anchor="start" fill="#D97A00" font-size="12px">X（横滚）</text>
<text class="th" x="110" y="285" text-anchor="start" fill="#2E8B2E" font-size="12px">Y（俯仰）</text>
<text class="th" x="53" y="425" text-anchor="start" fill="#1F6FB2" font-size="12px">Z（偏航）</text>

<!-- explanation  -->
<text class="ts" x="235" y="282">正循环：X → Y → Z → X（叉乘满足 X×Y = Z）</text>
<text class="ts" x="235" y="306">· 绕 X：变化在 Y–Z 平面，顺序 Y→Z 为正循环 → 子矩阵 [ +c  +s ; −s  +c ]</text>
<text class="ts" x="235" y="330">· 绕 Z：变化在 X–Y 平面，顺序 X→Y 为正循环 → 子矩阵 [ +c  +s ; −s  +c ]</text>
<text class="ts" x="235" y="354">· 绕 Y：变化在 X–Z 平面，顺序 X→Z 为逆循环（X×Z = −Y）→ 符号相反</text>
<text class="tk" x="235" y="380" fill="#633806" font-size="11.5px">→ 绕 Y 轴旋转矩阵"符号反常"是右手系空间拓扑结构的必然结果，不是笔误。</text>
<text class="ts" x="235" y="405" font-size="10px">注：本图采用"被动旋转（坐标变换）"约定，符号以向量不动、坐标系旋转为准；</text>
<text class="ts" x="235" y="420" font-size="10px">若改用"主动旋转（向量旋转）"约定，整体符号会取转置，请按所用教材/代码统一。</text>
</svg>
