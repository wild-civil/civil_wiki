<svg viewBox="0 0 680 520" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>SINS + DR 组合导航架构</title>
  <desc>test_SINS_DR 拆解：SINS 与 DR 并行传播，dr.qnb 锚定 ins.qnb，KF 22 维以 ins.pos−dr.pos 为量测，kffeedback 反馈修正 ins。</desc>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a1a1a">SINS + DR 组合导航架构（test_SINS_DR 拆解）</text>

  <rect x="20" y="56" width="120" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="80" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53">IMU</text>
  <text x="80" y="94" text-anchor="middle" font-size="11" fill="#333">陀螺 + 加速度</text>

  <rect x="20" y="352" width="120" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="80" y="372" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53">Odometer</text>
  <text x="80" y="390" text-anchor="middle" font-size="11" fill="#333">里程计 dS</text>

  <rect x="195" y="52" width="170" height="66" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" font-weight="500" fill="#173404">miniinspure</text>
  <text x="280" y="90" text-anchor="middle" font-size="11" fill="#333">SINS 机械编排 (free)</text>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#555">ins: qnb,pos,vel,att</text>

  <rect x="195" y="148" width="170" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#412402">ins 状态（SINS 输出）</text>

  <rect x="195" y="222" width="170" height="38" rx="8" fill="#FBEAF0" stroke="#72243E" stroke-width="0.5"/>
  <text x="280" y="241" text-anchor="middle" font-size="11" font-weight="500" fill="#4B1528">dr.qnb = ins.qnb</text>

  <rect x="195" y="346" width="170" height="66" rx="8" fill="#EEEDFE" stroke="#3C3489" stroke-width="0.5"/>
  <text x="280" y="367" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">mini_drupdate</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#333">DR 航位推算</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#555">pos += R(yaw)·dS</text>

  <rect x="455" y="168" width="210" height="166" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="560" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#412402">KF 22 维</text>
  <text x="470" y="212" font-size="11" fill="#333">状态 = INS(15)</text>
  <text x="470" y="230" font-size="11" fill="#333">   + dposD(3)</text>
  <text x="470" y="248" font-size="11" fill="#333">   + dpitch/dyaw(2)</text>
  <text x="470" y="266" font-size="11" fill="#333">   + dKod(1)</text>
  <text x="470" y="284" font-size="11" fill="#333">   + dT(1)</text>
  <text x="470" y="308" font-size="11" font-weight="500" fill="#993556">量测 z = ins.pos − dr.pos</text>
  <text x="470" y="324" font-size="11" fill="#555">每 10 步（0.2 s）</text>

  <rect x="455" y="52" width="210" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">kffeedback(kf,ins,1,'v')</text>
  <text x="560" y="90" text-anchor="middle" font-size="11" fill="#333">修正后 ins（输出）</text>

  <rect x="455" y="372" width="210" height="50" rx="8" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
  <text x="560" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">输出：修正后 ins</text>
  <text x="560" y="410" text-anchor="middle" font-size="11" fill="#555">SINS 主导 + DR 辅助</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="140" y1="82" x2="191" y2="82" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="378" x2="191" y2="378" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="118" x2="280" y2="146" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="188" x2="280" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="260" x2="280" y2="344" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 365 168 C 415 168 415 205 453 205" stroke="#993556" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 365 380 C 415 380 415 318 453 318" stroke="#993556" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="560" y1="168" x2="560" y2="106" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 455 72 C 390 48 320 44 292 50" stroke="#0F6E56" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="560" y1="334" x2="560" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="40" y1="462" x2="70" y2="462" stroke="#993556" stroke-width="1.5"/>
  <text x="78" y="466" font-size="11" fill="#333">量测 z = ins.pos − dr.pos（每 10 步）</text>
  <line x1="40" y1="482" x2="70" y2="482" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="78" y="486" font-size="11" fill="#333">误差反馈 kffeedback to ins（SINS 主导）</text>
</svg>
