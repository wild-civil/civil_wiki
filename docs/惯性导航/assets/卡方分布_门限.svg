<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <!-- 背景 -->
  <rect width="680" height="340" fill="#f8fafc"/>
  <rect x="0" y="0" width="680" height="340" fill="none" stroke="#cbd5e1"/>

  <!-- 标题 -->
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">χ² 分布：NEES / NIS 的"对照刻度尺"</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="250" x2="620" y2="250" stroke="#475569" stroke-width="1.2"/>
  <line x1="60" y1="50" x2="60" y2="250" stroke="#475569" stroke-width="1.2"/>
  <!-- x 刻度 0,4,8,12,16 -->
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <line x1="60" y1="250" x2="60" y2="254" stroke="#475569"/>
    <text x="60" y="266">0</text>
    <line x1="200" y1="250" x2="200" y2="254" stroke="#475569"/>
    <text x="200" y="266">4</text>
    <line x1="340" y1="250" x2="340" y2="254" stroke="#475569"/>
    <text x="340" y="266">8</text>
    <line x1="480" y1="250" x2="480" y2="254" stroke="#475569"/>
    <text x="480" y="266">12</text>
    <line x1="620" y1="250" x2="620" y2="254" stroke="#475569"/>
    <text x="620" y="266">16</text>
  </g>
  <!-- y 刻度 0.1/0.2/0.3/0.4 -->
  <g font-size="10" fill="#64748b" text-anchor="end">
    <text x="54" y="254">0</text>
    <line x1="56" y1="200" x2="60" y2="200" stroke="#475569"/>
    <text x="54" y="204">0.1</text>
    <line x1="56" y1="150" x2="60" y2="150" stroke="#475569"/>
    <text x="54" y="154">0.2</text>
    <line x1="56" y1="100" x2="60" y2="100" stroke="#475569"/>
    <text x="54" y="104">0.3</text>
    <line x1="56" y1="50" x2="60" y2="50" stroke="#475569"/>
    <text x="54" y="54">0.4</text>
  </g>
  <text x="24" y="152" font-size="10" fill="#64748b" transform="rotate(-90 24 152)" text-anchor="middle">PDF</text>

  <!-- ============ 三条 χ² 曲线 ============ -->
  <!-- m=1（红） -->
  <polyline points="81.0,59.2 90.1,110.2 99.3,142.5 108.4,165.1 117.5,181.6 126.7,194.3 135.8,204.1 144.9,212.0 154.1,218.3 163.2,223.4 172.4,227.6 181.5,231.1 190.6,234.0 199.8,236.4 208.9,238.5 218.0,240.2 227.2,241.6 236.3,242.8 245.4,243.9 254.6,244.7 263.7,245.5 272.8,246.1 282.0,246.7 291.1,247.1 300.3,247.5 309.4,247.9 318.5,248.2 327.7,248.4 336.8,248.6 345.9,248.8 355.1,249.0 364.2,249.1 373.3,249.2 382.5,249.3 391.6,249.4 400.7,249.5 409.9,249.6 419.0,249.6 428.2,249.7 437.3,249.7 446.4,249.8 455.6,249.8 464.7,249.8 473.8,249.8 483.0,249.9 492.1,249.9 501.2,249.9 510.4,249.9 519.5,249.9 528.6,249.9 537.8,249.9 546.9,249.9 556.1,250.0 565.2,250.0 574.3,250.0 583.5,250.0 592.6,250.0 601.7,250.0 610.9,250.0 620.0,250.0" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- m=2（蓝） -->
  <polyline points="79.0,59.4 88.5,83.6 98.0,104.7 107.5,123.1 116.9,139.2 126.4,153.2 135.9,165.5 145.4,176.2 154.9,185.6 164.4,193.7 173.9,200.9 183.4,207.1 192.9,212.5 202.4,217.3 211.9,221.4 221.4,225.1 230.8,228.2 240.3,231.0 249.8,233.4 259.3,235.5 268.8,237.3 278.3,238.9 287.8,240.3 297.3,241.6 306.8,242.6 316.3,243.6 325.8,244.4 335.3,245.1 344.7,245.7 354.2,246.3 363.7,246.7 373.2,247.2 382.7,247.5 392.2,247.8 401.7,248.1 411.2,248.3 420.7,248.6 430.2,248.7 439.7,248.9 449.2,249.0 458.6,249.2 468.1,249.3 477.6,249.4 487.1,249.4 496.6,249.5 506.1,249.6 515.6,249.6 525.1,249.7 534.6,249.7 544.1,249.8 553.6,249.8 563.1,249.8 572.5,249.8 582.0,249.9 591.5,249.9 601.0,249.9 610.5,249.9 620.0,249.9" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- m=3（绿） -->
  <polyline points="60.0,250.0 69.5,159.3 79.0,138.0 88.5,130.2 98.0,129.2 107.5,132.1 116.9,137.2 126.4,143.6 135.9,150.7 145.4,158.0 154.9,165.3 164.4,172.5 173.9,179.3 183.4,185.7 192.9,191.8 202.4,197.4 211.9,202.5 221.4,207.3 230.8,211.6 240.3,215.6 249.8,219.1 259.3,222.4 268.8,225.3 278.3,228.0 287.8,230.4 297.3,232.5 306.8,234.4 316.3,236.1 325.8,237.7 335.3,239.0 344.7,240.3 354.2,241.4 363.7,242.3 373.2,243.2 382.7,244.0 392.2,244.7 401.7,245.3 411.2,245.8 420.7,246.3 430.2,246.7 439.7,247.1 449.2,247.4 458.6,247.7 468.1,248.0 477.6,248.2 487.1,248.4 496.6,248.6 506.1,248.8 515.6,248.9 525.1,249.1 534.6,249.2 544.1,249.3 553.6,249.4 563.1,249.4 572.5,249.5 582.0,249.6 591.5,249.6 601.0,249.7 610.5,249.7 620.0,249.7" fill="none" stroke="#16a34a" stroke-width="2"/>

  <!-- ============ 95% 门限竖线（同色） ============ -->
  <line x1="194.4" y1="250" x2="194.4" y2="80" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="194.4" y="74" text-anchor="middle" font-size="10" fill="#dc2626">χ²(1) 95% = 3.84</text>
  <line x1="269.7" y1="250" x2="269.7" y2="105" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="269.7" y="99" text-anchor="middle" font-size="10" fill="#2563eb">χ²(2) 95% = 5.99</text>
  <line x1="333.5" y1="250" x2="333.5" y2="125" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="333.5" y="119" text-anchor="middle" font-size="10" fill="#16a34a">χ²(3) 95% = 7.81</text>

  <!-- ============ 均值位置（m，空心圈） ============ -->
  <circle cx="95" cy="250" r="3.5" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="130" cy="250" r="3.5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="165" cy="250" r="3.5" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="330" y="288" text-anchor="middle" font-size="11" fill="#475569">空心圈 = 均值 E[χ²_m] = m；竖线 = 95% 上侧分位数（单次门限 / gating 的依据）</text>

  <!-- 图例 -->
  <rect x="440" y="42" width="176" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="452" y="58" font-size="10" font-weight="bold" fill="#1e293b">图例</text>
  <line x1="452" y1="70" x2="470" y2="70" stroke="#dc2626" stroke-width="2"/><text x="476" y="74" font-size="10" fill="#1e293b">m=1（baro 标量）</text>
  <line x1="452" y1="84" x2="470" y2="84" stroke="#2563eb" stroke-width="2"/><text x="476" y="88" font-size="10" fill="#1e293b">m=2（2D 量测）</text>
  <line x1="452" y1="98" x2="470" y2="98" stroke="#16a34a" stroke-width="2"/><text x="476" y="102" font-size="10" fill="#1e293b">m=3（3D 量测）</text>

  <!-- 底部关键公式 -->
  <text x="340" y="312" text-anchor="middle" font-size="11" fill="#334155">P(NIS &gt; χ²(m, 1−α)) = α　→　单次超门限 = 该量测可疑（拒绝 / 降权 / 报警）；长期平均 ≈ m = 滤波器"诚实"</text>
  <text x="340" y="330" text-anchor="middle" font-size="10" fill="#94a3b8">自由度 m = 量测向量维数（GNSS 位置=3，气压高度=1）——查表别用错列</text>
</svg>
