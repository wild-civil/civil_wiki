<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>复数的加法与乘法几何意义</title>
  <desc>左图展示复数加法构成平行四边形，右图展示乘 j 等于逆时针旋转 90 度。</desc>
  <text x="40" y="32" fill="#333333" font-size="15">复数的几何意义</text>
  <text x="40" y="56" fill="#5f5e5a" font-size="13">加法：平行四边形</text>
  <line x1="60" y1="230" x2="330" y2="230" stroke="#333333" stroke-width="1"/>
  <line x1="150" y1="230" x2="150" y2="60" stroke="#333333" stroke-width="1"/>
  <line x1="150" y1="230" x2="230" y2="190" stroke="#185fa5" stroke-width="3"/>
  <line x1="150" y1="230" x2="190" y2="150" stroke="#d85a30" stroke-width="3"/>
  <line x1="150" y1="230" x2="270" y2="110" stroke="#1d9e75" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="230" y1="190" x2="270" y2="110" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="190" y1="150" x2="270" y2="110" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="236" y="184" fill="#185fa5" font-size="13">z₁</text>
  <text x="180" y="144" fill="#d85a30" font-size="13">z₂</text>
  <text x="276" y="106" fill="#1d9e75" font-size="13">z₁+z₂</text>
  <text x="250" y="250" fill="#5f5e5a" font-size="12">实部</text>
  <text x="158" y="76" fill="#5f5e5a" font-size="12">虚部</text>
  <text x="380" y="56" fill="#5f5e5a" font-size="13">乘 j：逆时针 90°</text>
  <line x1="420" y1="230" x2="660" y2="230" stroke="#333333" stroke-width="1"/>
  <line x1="520" y1="230" x2="520" y2="60" stroke="#333333" stroke-width="1"/>
  <line x1="520" y1="230" x2="590" y2="195" stroke="#185fa5" stroke-width="3"/>
  <line x1="520" y1="230" x2="485" y2="160" stroke="#c62828" stroke-width="3"/>
  <path d="M575 205 A55 55 0 0 0 507 185" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="596" y="190" fill="#185fa5" font-size="13">z</text>
  <text x="470" y="154" fill="#c62828" font-size="13">jz</text>
  <text x="548" y="178" fill="#333333" font-size="12">90°</text>
  <text x="600" y="250" fill="#5f5e5a" font-size="12">实部</text>
  <text x="528" y="76" fill="#5f5e5a" font-size="12">虚部</text>
  <text x="40" y="282" fill="#888780" font-size="12">加法 = 向量相加；乘单位复数 = 只旋转、不改变长度</text>
</svg>
