<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" role="img">
  <title>石英晶体等效电路</title>
  <desc>无源晶振等效为 R-L-C 串并联网络：C0 并联电容，L1/C1/R1 动态支路，串联谐振 f_s 由 L1/C1 决定，工作于并联谐振附近的感性区。</desc>
  <defs>
    <marker id="cDot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="2.6" fill="#2c2c2a"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2c2c2a">石英晶体等效电路（无源晶振 = 一个 R-L-C 网络）</text>

  <!-- 端子 -->
  <text x="28" y="120" font-family="sans-serif" font-size="13" fill="#185fa5">端 1</text>
  <line x1="20" y1="128" x2="70" y2="128" stroke="#2c2c2a" stroke-width="1.8" marker-end="url(#cDot)"/>

  <!-- 并联支路 C0（上，浅灰虚线区分） -->
  <rect x="130" y="84" width="44" height="54" rx="4" fill="#f4f4f2" stroke="#6b6a66" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="152" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6a66">C0</text>
  <text x="152" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b6a66">并联电容</text>
  <line x1="70" y1="128" x2="130" y2="111" stroke="#6b6a66" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="174" y1="111" x2="560" y2="211" stroke="#6b6a66" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="560" y1="211" x2="610" y2="209" stroke="#6b6a66" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="610" y1="209" x2="618" y2="209" stroke="#6b6a66" stroke-width="1.3"/>

  <!-- 主串臂 -->
  <line x1="70" y1="128" x2="618" y2="209" stroke="#2c2c2a" stroke-width="1.8"/>

  <!-- L1 -->
  <path d="M150 135 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0" fill="none" stroke="#2c2c2a" stroke-width="1.8"/>
  <text x="180" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2c2c2a">L1（动态电感·振动质量）</text>

  <!-- R1 -->
  <rect x="290" y="148" width="42" height="16" rx="2" fill="none" stroke="#2c2c2a" stroke-width="1.8"/>
  <text x="311" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2c2c2a">R1</text>
  <text x="311" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">ESR·损耗（几Ω~百Ω）</text>

  <!-- C1 -->
  <g>
    <line x1="420" y1="150" x2="420" y2="162" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="412" y1="162" x2="428" y2="162" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="420" y1="162" x2="420" y2="174" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="412" y1="174" x2="428" y2="174" stroke="#2c2c2a" stroke-width="1.8"/>
    <line x1="420" y1="174" x2="420" y2="186" stroke="#2c2c2a" stroke-width="1.8"/>
  </g>
  <text x="420" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2c2c2a">C1（动态电容·弹性）</text>

  <!-- f_s 公式 -->
  <rect x="60" y="240" width="560" height="58" rx="10" fill="#eef4fb" stroke="#185fa5" stroke-width="0.8"/>
  <text x="340" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#185fa5">f_s = 1 / (2π·√(L1·C1))　→　决定晶振的标称频率</text>
  <text x="340" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a6ea5">并臂 C0 与 XL 在 f_s~f_a 间呈感性，与外部负载电容构成并联谐振 → 负载电容可微调频率</text>

  <text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">串臂 L1-C1-R1：决定频率与损耗　|　并臂 C0：电极间静态电容（1~10 pF）</text>
</svg>