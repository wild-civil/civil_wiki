<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 225" width="100%" role="img">
  <title>同相放大器电路</title>
  <desc>信号接同相输入端，Rg 从反相端接地，Rf 由输出反馈到反相端，闭环增益等于 1 加 Rf 比 Rg，输入阻抗极高。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="210" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">同相放大器　增益 = 1 + Rf/Rg</text>

  <path d="M150,60 V140 L240,100 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="166" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">+</text>
  <text x="166" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">−</text>

  <line x1="30" y1="80" x2="150" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="26" y="70" font-family="sans-serif" font-size="12" fill="currentColor">u<tspan font-size="9" dy="3">i</tspan></text>

  <line x1="240" y1="100" x2="370" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="376" y="96" font-family="sans-serif" font-size="12" fill="currentColor">u<tspan font-size="9" dy="3">o</tspan></text>
  <circle cx="340" cy="100" r="3.5" fill="currentColor"/>

  <line x1="150" y1="120" x2="110" y2="120" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="110" cy="120" r="3.5" fill="currentColor"/>

  <line x1="110" y1="120" x2="110" y2="140" stroke="currentColor" stroke-width="1.5"/>
  <rect x="103" y="140" width="14" height="26" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="110" y1="166" x2="110" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <line x1="99" y1="180" x2="121" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <line x1="103" y1="185" x2="117" y2="185" stroke="currentColor" stroke-width="1.5"/>
  <line x1="107" y1="190" x2="113" y2="190" stroke="currentColor" stroke-width="1.5"/>
  <text x="126" y="158" font-family="sans-serif" font-size="11" fill="currentColor">Rg</text>

  <path d="M110,120 H85 V200 H340 V100" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="230" y="193" width="40" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">Rf</text>

  <text x="210" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">共模电压 = 输入信号，需检查输入共模范围</text>
</svg>
