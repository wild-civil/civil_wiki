<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 205" width="100%" role="img">
  <title>反相放大器电路</title>
  <desc>同相端接地，信号经 Rin 接到反相端，Rf 由输出反馈到反相端形成虚地，闭环增益为负的 Rf 比 Rin，输入阻抗约等于 Rin。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="210" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">反相放大器　增益 = −Rf/Rin</text>

  <path d="M150,60 V140 L240,100 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="166" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">+</text>
  <text x="166" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="currentColor">−</text>

  <line x1="150" y1="80" x2="65" y2="80" stroke="currentColor" stroke-width="1.5"/>
  <line x1="65" y1="80" x2="65" y2="105" stroke="currentColor" stroke-width="1.5"/>
  <line x1="54" y1="105" x2="76" y2="105" stroke="currentColor" stroke-width="1.5"/>
  <line x1="58" y1="110" x2="72" y2="110" stroke="currentColor" stroke-width="1.5"/>
  <line x1="62" y1="115" x2="68" y2="115" stroke="currentColor" stroke-width="1.5"/>

  <line x1="30" y1="120" x2="60" y2="120" stroke="currentColor" stroke-width="1.5"/>
  <rect x="60" y="113" width="40" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="150" y2="120" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="125" cy="120" r="3.5" fill="currentColor"/>
  <text x="26" y="110" font-family="sans-serif" font-size="12" fill="currentColor">u<tspan font-size="9" dy="3">i</tspan></text>
  <text x="70" y="108" font-family="sans-serif" font-size="11" fill="currentColor">Rin</text>

  <line x1="240" y1="100" x2="370" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="376" y="96" font-family="sans-serif" font-size="12" fill="currentColor">u<tspan font-size="9" dy="3">o</tspan></text>
  <circle cx="340" cy="100" r="3.5" fill="currentColor"/>

  <path d="M125,120 V175 H340 V100" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="230" y="168" width="40" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">Rf</text>

  <text x="210" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">反相端为虚地（电位 0，但阻抗不低），输入阻抗 ≈ Rin</text>
</svg>
