<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" width="920" height="720" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="920" height="720" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">DW01 + 8205A 单节锂电池保护电路 </text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#64748b">M1/M2 共漏连接</text>

  <!-- ============ 主电源轨 ============ -->
  <!-- B+ 顶部主线 -->
  <line x1="60" y1="90" x2="860" y2="90" stroke="#dc2626" stroke-width="2"/>
  <text x="872" y="86" text-anchor="end" font-size="13" font-weight="700" fill="#dc2626">P+</text>
  <line x1="860" y1="90" x2="880" y2="90" stroke="#dc2626" stroke-width="3.5"/>

  <!-- B- 底部主线 (电池负极到 8205A Pin 1 S1) -->
  <line x1="60" y1="620" x2="685" y2="620" stroke="#334155" stroke-width="2"/>
  <text x="38" y="645" text-anchor="end" font-size="13" font-weight="700" fill="#334155">B-</text>

  <!-- P- 底部输出线 (8205A Pin 3 S2 独立引出到 P-) -->
  <line x1="835" y1="620" x2="880" y2="620" stroke="#16a34a" stroke-width="2"/>
  <text x="872" y="615" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">P-</text>
  <line x1="860" y1="620" x2="880" y2="620" stroke="#16a34a" stroke-width="3.5"/>

  <!-- ============ 电池符号 ============ -->
  <line x1="60" y1="90" x2="60" y2="135" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="42" y1="135" x2="78" y2="135" stroke="#334155" stroke-width="3.5"/>
  <line x1="50" y1="153" x2="70" y2="153" stroke="#334155" stroke-width="3.5"/>
  <line x1="60" y1="153" x2="60" y2="620" stroke="#334155" stroke-width="2"/>
  <text x="38" y="96" text-anchor="end" font-size="13" font-weight="700" fill="#dc2626">B+</text>

  <!-- ============ R1 (100Ω) B+ → VDD ============ -->
  <line x1="160" y1="90" x2="160" y2="130" stroke="#dc2626" stroke-width="2"/>
  <rect x="153" y="130" width="14" height="40" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="144" y="148" text-anchor="end" font-size="10" font-weight="600" fill="#475569">R1</text>
  <text x="144" y="161" text-anchor="end" font-size="9" fill="#64748b">100Ω</text>
  <line x1="160" y1="170" x2="160" y2="240" stroke="#dc2626" stroke-width="2"/>

  <!-- ================================================================= -->
  <!-- ============ DW01 芯片 (尺寸: 150x300, 逆时针转90°) ============ -->
  <!-- ================================================================= -->
  <path d="M 140 240 L 280 240 L 290 250 L 290 530 L 280 540 L 140 540 L 130 530 L 130 250 Z"
        fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- Pin 1 点标记：右下角 -->
  <circle cx="275" cy="522" r="4" fill="#0f172a"/>

  <!-- DW01 左侧引脚 (自上而下: Pin 4 TD, Pin 5 VDD, Pin 6 VSS) -->
  <rect x="114" y="266" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">4</text>
  <text x="106" y="278" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">TD</text>

  <rect x="114" y="376" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">5</text>
  <text x="106" y="388" text-anchor="end" font-size="10" font-weight="600" fill="#dc2626">VDD</text>

  <rect x="114" y="486" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="504" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">6</text>
  <text x="106" y="496" text-anchor="end" font-size="10" font-weight="600" fill="#334155">VSS</text>

  <!-- DW01 右侧引脚 (自下而上: Pin 1 OD, Pin 2 CS, Pin 3 OC) -->
  <rect x="290" y="486" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="298" y="504" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">1</text>
  <text x="314" y="496" font-size="10" font-weight="600" fill="#2563eb">OD</text>

  <rect x="290" y="376" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="298" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">2</text>
  <text x="314" y="388" font-size="10" font-weight="600" fill="#2563eb">CS</text>

  <rect x="290" y="266" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="298" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3</text>
  <text x="314" y="278" font-size="10" font-weight="600" fill="#2563eb">OC</text>

  <!-- DW01 芯片标识 -->
  <text x="210" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">DW01</text>

  <!-- DW01 外部接线 -->
  <!-- Pin 4 TD 悬空 -->
  <line x1="114" y1="280" x2="90" y2="280" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3"/>
  <!-- Pin 5 VDD 接 R1 -->
  <path d="M 114 390 L 160 390 L 160 170" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <!-- Pin 6 VSS 接 B- -->
  <path d="M 114 500 L 80 500 L 80 620" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- ================================================================= -->
  <!-- ============ 8205A 芯片 (尺寸: 150x300, 逆时针转90°) =========== -->
  <!-- ================================================================= -->
  <path d="M 500 240 L 640 240 L 650 250 L 650 530 L 640 540 L 500 540 L 490 530 L 490 250 Z"
        fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- Pin 1 点标记：右下角 -->
  <circle cx="635" cy="522" r="4" fill="#0f172a"/>

  <!-- 8205A 左侧引脚 (自上而下: Pin 4 G2, Pin 5 D, Pin 6 G1) -->
  <rect x="474" y="266" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="482" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">4</text>
  <text x="466" y="278" text-anchor="end" font-size="10" font-weight="600" fill="#2563eb">G2</text>

  <rect x="474" y="376" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="482" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">5</text>
  <text x="466" y="388" text-anchor="end" font-size="10" font-weight="600" fill="#dc2626">D</text>

  <rect x="474" y="486" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="482" y="504" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">6</text>
  <text x="466" y="496" text-anchor="end" font-size="10" font-weight="600" fill="#2563eb">G1</text>

  <!-- 8205A 右侧引脚 (自下而上: Pin 1 S1, Pin 2 D, Pin 3 S2) -->
  <rect x="650" y="486" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="658" y="504" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">1</text>
  <text x="674" y="496" font-size="10" font-weight="600" fill="#334155">S1</text>

  <rect x="650" y="376" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="658" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">2</text>
  <text x="674" y="388" font-size="10" font-weight="600" fill="#dc2626">D</text>

  <rect x="650" y="266" width="16" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="658" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3</text>
  <text x="674" y="278" font-size="10" font-weight="600" fill="#16a34a">S2</text>

  <!-- 8205A 芯片名称 -->
  <text x="570" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">8205A</text>

  <!-- 内部共漏总线 (Common Drain Rail) - 纵向居中线 (X=570) -->
  <line x1="563" y1="335" x2="563" y2="445" stroke="#1e293b" stroke-width="2"/>

  <!-- 内部虚线：共漏轨 (570) → Pin 5 (左) & Pin 2 (右) -->
  <line x1="570" y1="390" x2="490" y2="390" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="570" y1="390" x2="650" y2="390" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- ================================================================= -->
  <!-- ============ 8205A 内部 M1 (下侧：放电 N-MOS，按用户模板) ============ -->
  <!-- ================================================================= -->
  <g>
    <!-- G1 控制线 (Pin 6 接入) -->
    <path d="M 490 500 L 515 500 L 515 470 L 525 470" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- 栅极极板 (Gate Plate) -->
    <line x1="525" y1="445" x2="525" y2="495" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- 绝缘沟道三段 (Channel) -->
    <line x1="533" y1="440" x2="533" y2="456" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="533" y1="462" x2="533" y2="478" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="533" y1="484" x2="533" y2="500" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- D1 连接线 → 接共漏轨 (570) -->
    <path d="M 533 448 L 563 448 L 563 430" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- S1 连接线及内部衬底相连 (衬底 470 连到 S1 492) -->
    <path d="M 533 492 L 563 492 M 563 492 L 563 515 L 610 515" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 533 470 L 563 470 L 563 492" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- [修改点 1] NMOS 特征箭头：从右指向左 (80,80 -> 92,74 92,86 坐标平移) -->
    <polygon points="533,470 543,465 543,475" fill="#1e293b"/>

    <!-- [修改点 2] 体二极管 (Body Diode) - 阳极在S1(下), 阴极在D(上)，导通方向 S1→D -->
    <path d="M 563 498 L 583 498 L 583 436 L 563 436" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- 阴极横线 (Top, D) -->
    <line x1="577" y1="456" x2="589" y2="456" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 阳极三角形 (Bottom to Top) -->
    <polygon points="583,456 578,466 588,466" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>

    <!-- 节点圆点 -->
    <circle cx="563" cy="492" r="2.5" fill="#1e293b"/>
    <circle cx="563" cy="436" r="2.5" fill="#1e293b"/>
    <circle cx="563" cy="498" r="2.5" fill="#1e293b"/>
  </g>
  <!-- M1 文字标注 -->
  <text x="518" y="465" text-anchor="end" font-size="9" font-weight="700" fill="#2563eb">G</text>
  <text x="548" y="432" text-anchor="start" font-size="9" font-weight="700" fill="#0f172a">D</text>
  <text x="548" y="510" text-anchor="start" font-size="9" font-weight="700" fill="#0f172a">S</text>
  <text x="505" y="445" font-size="10" font-weight="700" fill="#0f172a">M1</text>

  <!-- ================================================================= -->
  <!-- ============ 8205A 内部 M2 (上侧：充电 N-MOS，按用户模板) ============ -->
  <!-- ================================================================= -->
  <g>
    <!-- G2 控制线 (Pin 4 接入) -->
    <path d="M 490 280 L 515 280 L 515 310 L 525 310" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- 栅极极板 (Gate Plate) -->
    <line x1="525" y1="285" x2="525" y2="335" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- 绝缘沟道三段 (Channel) -->
    <line x1="533" y1="280" x2="533" y2="296" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="533" y1="302" x2="533" y2="318" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="533" y1="324" x2="533" y2="340" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- D2 连接线 → 接共漏轨 (570) -->
    <path d="M 533 288 L 563 288 L 563 300" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- S2 连接线及内部衬底相连 (衬底 310 连到 S2 332) -->
    <path d="M 533 332 L 563 332 M 563 332 L 563 350" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 533 310 L 563 310 L 563 265 L 610 265" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- [修改点 1] NMOS 特征箭头：从右指向左 -->
    <polygon points="533,310 543,305 543,315" fill="#1e293b"/>

    <!-- [修改点 2] 体二极管 (Body Diode) - 阳极在D(下 338), 阴极在S(上 276) -->
    <path d="M 563 338 L 583 338 L 583 280 L 563 280" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- 阴极横线 (Top, S) -->
    <line x1="577" y1="300" x2="589" y2="300" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 阳极三角形 (Bottom to Top) -->
    <polygon points="583,300 578,310 588,310" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>

    <!-- 节点圆点 -->
    <circle cx="563" cy="280" r="2.5" fill="#1e293b"/>
    <circle cx="563" cy="288" r="2.5" fill="#1e293b"/>
    <circle cx="563" cy="338" r="2.5" fill="#1e293b"/>
  </g>
  <!-- M2 文字标注 -->
  <text x="510" y="305" text-anchor="end" font-size="9" font-weight="700" fill="#2563eb">G</text>
  <text x="548" y="272" text-anchor="start" font-size="9" font-weight="700" fill="#0f172a">S</text>
  <text x="548" y="350" text-anchor="start" font-size="9" font-weight="700" fill="#0f172a">D</text>
  <text x="505" y="325" font-size="10" font-weight="700" fill="#0f172a">M2</text>

  <!-- ================================================================= -->
  <!-- ============ 8205A 管脚对外连接 (彻底分离 S1 与 S2) ============ -->
  <!-- ================================================================= -->
  <!-- Pin 1 (S1) 内部连接 M1 S极 (610,515) -> Pin 1 (650,500)，外部接 B- 轨 -->
  <path d="M 610 515 L 630 515 L 630 500 L 666 500" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 666 500 L 685 500 L 685 620" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Pin 3 (S2) 内部连接 M2 S极 (610,260) -> Pin 3 (650,280)，外部独立引出到 P- 轨 -->
  <path d="M 610 265 L 630 265 L 630 280 L 666 280" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M 666 280 L 835 280 L 835 620" fill="none" stroke="#16a34a" stroke-width="2"/>

  <!-- ================================================================= -->
  <!-- ============ 信号与外围辅助走线 (OD, OC, CS, R2) ============ -->
  <!-- ================================================================= -->
  <!-- OD (DW01 Pin 1) → 8205A Pin 6 (G1) -->
  <path d="M 306 500 L 474 500" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- OC (DW01 Pin 3) → 8205A Pin 4 (G2) -->
  <path d="M 306 280 L 474 280" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- CS (DW01 Pin 2) →  R2 -->
  <path d="M 306 390 L 367 390 " fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- R2 (1kΩ) 共漏节点 (400, 390) → B- 轨 -->
  <rect x="360" y="415" width="14" height="40" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="390" y="433" text-anchor="end" font-size="10" font-weight="600" fill="#475569">R2</text>
  <text x="392" y="445" text-anchor="end" font-size="9" fill="#64748b">1kΩ</text>
  <line x1="367" y1="390" x2="367" y2="415" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="367" y1="455" x2="367" y2="480" stroke="#16a34a" stroke-width="2"/>
  <line x1="367" y1="480" x2="390" y2="480" stroke="#16a34a" stroke-width="3.5"/>
  <text x="396" y="475" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">P-</text>
  
  <!-- ============ 节点连接点 (Junction Dots) ============ -->
  <circle cx="160" cy="90" r="3" fill="#dc2626"/>
  <circle cx="80" cy="620" r="3" fill="#334155"/>
  <!--<circle cx="400" cy="620" r="3" fill="#334155"/>-->
  <!--<circle cx="685" cy="620" r="3" fill="#334155"/>-->
  <circle cx="563" cy="390" r="2.5" fill="#1e293b"/>

  <!-- ============ 说明框（右下角） ============ -->
  <rect x="680" y="646" width="200" height="60" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="688" y="662" font-size="9" font-weight="700" fill="#92400e">关键电路修正特征说明</text>
  <text x="688" y="675" font-size="8" fill="#78350f">1. NMOS 完全基于给定的标准 SVG 结构构建</text>
  <text x="688" y="687" font-size="8" fill="#78350f">2. S1 (Pin 1) 接 B-，S2 (Pin 3) 独立接 P-</text>
  <text x="688" y="699" font-size="8" fill="#78350f">3. 两管在芯片内部通过 Drain (D) 实现共漏连接</text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#475569">
    <text x="45" y="688" font-weight="700" fill="#0f172a">图例</text>
    <line x1="95" y1="684" x2="125" y2="684" stroke="#dc2626" stroke-width="2"/>
    <text x="135" y="688">B+ / P+ / VDD / D</text>
    <line x1="270" y1="684" x2="300" y2="684" stroke="#334155" stroke-width="2"/>
    <text x="310" y="688">B- / VSS / S1</text>
    <line x1="410" y1="684" x2="440" y2="684" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="688">P- / S2</text>
    <line x1="515" y1="684" x2="545" y2="684" stroke="#2563eb" stroke-width="2"/>
    <text x="550" y="688">OD / OC / CS（控制信号）</text>
  </g>
</svg>
