<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" role="img" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <style>
      .title-text { font-size: 18px; font-weight: bold; fill: #222222; }
      .label-text { font-size: 16px; font-weight: bold; fill: #111111; }
      .dim-text { font-size: 15px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .dim-line { stroke: #666666; stroke-width: 1.2; stroke-dasharray: 3,3; }
      .arrow-line { stroke: #222222; stroke-width: 1.5; }
      .arrow-head { fill: #222222; }
    </style>
    
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
  </defs>

  <text x="30" y="35" class="title-text">表面微带单端 (Coated Microstrip Single-Ended)</text>

  <g transform="translate(30, 20)">
    <!-- 1. 底层参考地 (Bottom GND) -->
    <rect x="100" y="300" width="600" height="20" fill="#f5a623" stroke="#d98200" stroke-width="1"/>

    <!-- 2. 介质基材 (Er1) -->
    <rect x="100" y="140" width="600" height="160" fill="#d0d0d0" stroke="#999999" stroke-width="1"/>
    <text x="180" y="230" class="label-text" font-size="22">Er1</text>

    <!-- 3. 顶层信号线 (梯形铜箔) -->
    <polygon points="365,120 435,120 450,140 350,140" fill="#f5a623" stroke="#d98200" stroke-width="1"/>

    <!-- 4. 绿油阻焊层 (CEr - #4CAF50) -->
    <path d="M 100,126 
             L 330,126 
             L 355,105 
             L 445,105 
             L 470,126 
             L 700,126 
             L 700,140 
             L 450,140 
             L 435,120 
             L 365,120 
             L 350,140 
             L 100,140 Z" 
          fill="#4CAF50" stroke="#388E3C" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- CEr 标识与箭头 -->
    <text x="140" y="98" class="label-text">CEr</text>
    <line x1="155" y1="102" x2="155" y2="124" class="arrow-line" marker-end="url(#arrow-end)"/>

    <!-- C1 绿油厚度（基材上） -->
    <line x1="225" y1="126" x2="225" y2="140" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="242" y="136" class="dim-text" style="font-size:14px;">C1</text>

    <!-- C2 绿油厚度（铜皮上） -->
    <line x1="400" y1="105" x2="400" y2="120" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="415" y="115" class="dim-text" style="font-size:14px;">C2</text>

    <!-- 尺寸标注线 -->
    <!-- H1 介质厚度 -->
    <line x1="55" y1="140" x2="100" y2="140" class="dim-line"/>
    <line x1="55" y1="300" x2="100" y2="300" class="dim-line"/>
    <line x1="68" y1="140" x2="68" y2="300" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="40" y="225" class="dim-text" font-size="16">H1</text>

    <!-- T1 铜厚 -->
    <line x1="700" y1="120" x2="745" y2="120" class="dim-line"/>
    <line x1="700" y1="140" x2="745" y2="140" class="dim-line"/>
    <line x1="730" y1="120" x2="730" y2="140" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="758" y="135" class="dim-text">T1</text>

    <!-- W2 顶线宽 -->
    <line x1="365" y1="55" x2="365" y2="120" class="dim-line"/>
    <line x1="435" y1="55" x2="435" y2="120" class="dim-line"/>
    <line x1="365" y1="65" x2="435" y2="65" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="400" y="55" class="dim-text">W2</text>

    <!-- W1 底线宽 -->
    <line x1="350" y1="140" x2="350" y2="355" class="dim-line"/>
    <line x1="450" y1="140" x2="450" y2="355" class="dim-line"/>
    <line x1="350" y1="345" x2="450" y2="345" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="400" y="370" class="dim-text">W1</text>
  </g>
</svg>
