<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>IFA 板载天线：31.5mil 根部馈隙 vs 55.9mil RF 前端 footprint</title>
  <desc>左：与用户 PCB 一致的 meandered IFA。RF 馈点 ANT 与 GND 短路点均位于天线右下根部、地平面边缘，d=31.5mil 是两者水平间隙；天线主体向左上方 meander 延伸。右：模组 RF 前端（0Ω 选择器 + π 匹配占位 + U.FL/IPEX 连接器），55.9mil 来自连接器/选择器 footprint。</desc>

  <text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">31.5 mil 是 IFA 根部馈隙，55.9 mil 是 RF 前端 footprint</text>

  <!-- Panel A: meandered IFA antenna -->
  <rect x="30" y="50" width="300" height="240" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="180" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">① 板载 meandered IFA — 根部馈隙 d</text>

  <!-- ground plane -->
  <rect x="55" y="262" width="250" height="12" rx="1" fill="#BA7517"/>
  <text x="180" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">地平面 (GND)</text>

  <!-- meandered radiating arm (simplified 3-section) -->
  <path d="M100,250 V80 H130 V220 H170 V80 H210 V220 H250 V80 H278" fill="none" stroke="#185FA5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- feed strip / ANT pad -->
  <rect x="270" y="170" width="12" height="92" rx="1" fill="#185FA5"/>
  <rect x="263" y="260" width="26" height="14" rx="1" fill="#185FA5"/>
  <text x="276" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#185FA5">ANT</text>

  <!-- shorting strip / GND pad -->
  <rect x="290" y="170" width="12" height="92" rx="1" fill="#BA7517"/>
  <rect x="283" y="260" width="26" height="14" rx="1" fill="#BA7517"/>
  <text x="296" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#BA7517">GND</text>

  <!-- gap d -->
  <line x1="276" y1="245" x2="296" y2="245" stroke="#444441" stroke-width="0.75" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="276" y1="241" x2="276" y2="249" stroke="#444441" stroke-width="0.75"/>
  <line x1="296" y1="241" x2="296" y2="249" stroke="#444441" stroke-width="0.75"/>
  <text x="286" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">d = 31.5 mil</text>

  <text x="180" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">天线根部：ANT 馈点与 GND 短路点紧邻</text>

  <!-- Panel B: RF front-end -->
  <rect x="350" y="50" width="310" height="240" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="505" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">② RF 前端 — 选择 + 匹配 + 连接器</text>

  <rect x="375" y="262" width="260" height="12" rx="1" fill="#BA7517"/>
  <text x="505" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">地平面 (GND)</text>

  <!-- RF source -->
  <rect x="372" y="150" width="36" height="36" rx="2" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
  <text x="390" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#042C53">RF</text>

  <!-- 0 ohm selector -->
  <rect x="430" y="138" width="22" height="10" rx="1" fill="#185FA5"/>
  <rect x="430" y="186" width="22" height="10" rx="1" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="441" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">0Ω</text>
  <text x="441" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">选板载/选IPEX</text>

  <!-- pi network -->
  <rect x="478" y="150" width="12" height="16" rx="1" fill="#185FA5"/>
  <rect x="500" y="150" width="12" height="16" rx="1" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.75"/>
  <rect x="522" y="150" width="12" height="16" rx="1" fill="#185FA5"/>
  <text x="506" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">π 网络</text>

  <!-- U.FL connector -->
  <rect x="558" y="120" width="34" height="60" rx="2" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
  <rect x="564" y="134" width="12" height="10" rx="1" fill="#185FA5"/>
  <rect x="564" y="172" width="12" height="10" rx="1" fill="#BA7517"/>
  <text x="575" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#042C53">U.FL</text>

  <!-- sig-gnd gap -->
  <line x1="576" y1="150" x2="576" y2="172" stroke="#444441" stroke-width="0.75"/>
  <text x="600" y="162" text-anchor="start" font-family="sans-serif" font-size="11" fill="#2C2C2A">55.9mil</text>

  <!-- routing lines -->
  <line x1="408" y1="168" x2="430" y2="168" stroke="#5F5E5A" stroke-width="1"/>
  <line x1="452" y1="168" x2="478" y2="168" stroke="#5F5E5A" stroke-width="1"/>
  <line x1="534" y1="168" x2="558" y2="168" stroke="#5F5E5A" stroke-width="1"/>

  <text x="505" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">连接器/元件 footprint 决定，非天线</text>

  <text x="340" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#A32D2D">两区域由不同物理决定，尺寸不可互抄</text>
</svg>