<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <style>
      .title-text { font-size: 18px; font-weight: bold; fill: #222222; }
      .label-text { font-size: 16px; font-weight: bold; fill: #111111; }
      .dim-text { font-size: 15px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .dim-line { stroke: #666666; stroke-width: 1.2; stroke-dasharray: 3,3; }
      .arrow-line { stroke: #222222; stroke-width: 1.5; }
      .arrow-head { fill: #222222; }
    </style>
    
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
  </defs>

  <text x="30" y="35" class="title-text">共面差分 (Coplanar Differential Waveguide)</text>

  <g transform="translate(30, 20)">
    <!-- 1. 底层参考地 (Bottom GND) -->
    <rect x="100" y="310" width="700" height="20" fill="#f5a623" stroke="#d98200" stroke-width="1"/>

    <!-- 2. 介质基材 (Er1) -->
    <rect x="100" y="150" width="700" height="160" fill="#d0d0d0" stroke="#999999" stroke-width="1"/>
    <text x="210" y="240" class="label-text" font-size="22">Er1</text>

    <!-- 3. 顶层铜箔 (梯形侧边) -->
    <!-- 左铺铜地 -->
    <polygon points="100,130 240,130 255,150 100,150" fill="#f5a623" stroke="#d98200" stroke-width="1"/>
    <!-- 差分信号线 1 -->
    <polygon points="325,130 395,130 410,150 310,150" fill="#f5a623" stroke="#d98200" stroke-width="1"/>
    <!-- 差分信号线 2 -->
    <polygon points="480,130 550,130 565,150 465,150" fill="#f5a623" stroke="#d98200" stroke-width="1"/>
    <!-- 右铺铜地 -->
    <polygon points="635,130 800,130 800,150 620,150" fill="#f5a623" stroke="#d98200" stroke-width="1"/>

    <!-- 4. 绿色阻焊层 (CEr - #4CAF50) -->
    <path d="M 100,115 
             L 230,115 
             L 265,136 
             L 300,136 
             L 320,115 
             L 400,115 
             L 422,136 
             L 453,136 
             L 475,115 
             L 555,115 
             L 577,136 
             L 608,136 
             L 630,115 
             L 800,115 
             L 800,130 
             L 635,130 
             L 620,150 
             L 565,150 
             L 550,130 
             L 480,130 
             L 465,150 
             L 410,150 
             L 395,130 
             L 325,130 
             L 310,150 
             L 255,150 
             L 240,130 
             L 100,130 Z" 
          fill="#4CAF50" stroke="#388E3C" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- CEr 标识 -->
    <text x="145" y="98" class="label-text">CEr</text>
    <line x1="160" y1="102" x2="160" y2="113" class="arrow-line" marker-end="url(#arrow-end)"/>

    <!-- 标注尺寸与辅助线 -->
    <!-- H1 介质厚度 -->
    <line x1="55" y1="150" x2="100" y2="150" class="dim-line"/>
    <line x1="55" y1="310" x2="100" y2="310" class="dim-line"/>
    <line x1="68" y1="150" x2="68" y2="310" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="40" y="235" class="dim-text" font-size="16">H1</text>

    <!-- T1 铜厚 -->
    <line x1="800" y1="130" x2="820" y2="130" class="dim-line"/>
    <line x1="800" y1="150" x2="820" y2="150" class="dim-line"/>
    <line x1="810" y1="130" x2="810" y2="150" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="822" y="145" class="dim-text">T1</text>

    <!-- S1 差分线间距 -->
    <line x1="395" y1="60" x2="395" y2="130" class="dim-line"/>
    <line x1="480" y1="60" x2="480" y2="130" class="dim-line"/>
    <line x1="395" y1="70" x2="480" y2="70" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="437.5" y="60" class="dim-text">S1</text>

    <!-- W2 顶线宽 -->
    <line x1="480" y1="60" x2="480" y2="130" class="dim-line"/>
    <line x1="550" y1="60" x2="550" y2="130" class="dim-line"/>
    <line x1="480" y1="70" x2="550" y2="70" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="515" y="60" class="dim-text">W2</text>

    <!-- D1 包地间隙 -->
    <line x1="550" y1="60" x2="550" y2="130" class="dim-line"/>
    <line x1="635" y1="60" x2="635" y2="130" class="dim-line"/>
    <line x1="550" y1="70" x2="635" y2="70" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="592.5" y="60" class="dim-text">D1</text>

    <!-- W1 底线宽 -->
    <line x1="465" y1="150" x2="465" y2="365" class="dim-line"/>
    <line x1="565" y1="150" x2="565" y2="365" class="dim-line"/>
    <line x1="465" y1="355" x2="565" y2="355" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="515" y="380" class="dim-text">W1</text>

    <!-- C1、C2、C3 绿油厚度 -->
    <line x1="282" y1="136" x2="282" y2="150" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="268" y="147" class="dim-text" style="font-size:13px;">C1</text>

    <line x1="360" y1="115" x2="360" y2="130" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="375" y="125" class="dim-text" style="font-size:13px;">C2</text>

    <line x1="437" y1="136" x2="437" y2="150" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="452" y="147" class="dim-text" style="font-size:13px;">C3</text>
  </g>
</svg>
