<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">华秋 DFM 阻抗计算截面示意图（GCPW 共面单端外层）</title>
  <desc id="desc">展示 1.2 mm 双面板共面单端阻抗模型的截面尺寸与参数：W1=26.50、W2=25.70、D1=8.00、H1=41.9291、Er1=4.2、T1=1.3780、C1=1.1969、C2=0.5000、CEr=3.5，计算结果 55.11 Ω。</desc>
  <style>
    .t { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #2c2c2a; }
    .th { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #2c2c2a; }
    .tc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5f5e5a; }
    .tm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #2c2c2a; }
    .dim { stroke: #444441; stroke-width: 0.75; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
    .leader { stroke: #5f5e5a; stroke-width: 0.5; fill: none; stroke-dasharray: 3,2; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L5 5 L1 9" fill="none" stroke="#444441" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g transform="translate(40,50)">
    <text x="160" y="-30" class="th" text-anchor="middle">阻抗计算截面（共面单端 GCPW）</text>
    <rect x="60" y="260" width="300" height="5" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>
    <rect x="60" y="125" width="300" height="135" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.5"/>
    <text x="210" y="192" class="t" text-anchor="middle" dominant-baseline="central">Er1</text>
    <rect x="60" y="120" width="95" height="5" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>
    <rect x="265" y="120" width="95" height="5" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>
    <polygon points="155,125 275,125 273,120 157,120" fill="#f5a623" stroke="#d48c12" stroke-width="0.5"/>
    <rect x="60" y="111" width="300" height="9" fill="#4caf50" fill-opacity="0.65" stroke="#388e3c" stroke-width="0.5"/>
    <text x="210" y="106" class="tc" text-anchor="middle">CEr</text>

    <line x1="55" y1="125" x2="55" y2="260" class="dim"/>
    <text x="44" y="192" class="t" text-anchor="middle" dominant-baseline="central">H1</text>
    <line x1="55" y1="125" x2="60" y2="125" class="leader"/>
    <line x1="55" y1="260" x2="60" y2="260" class="leader"/>

    <line x1="370" y1="120" x2="370" y2="125" class="dim"/>
    <text x="382" y="122" class="tc" dominant-baseline="central">T1</text>
    <line x1="360" y1="120" x2="370" y2="120" class="leader"/>
    <line x1="360" y1="125" x2="370" y2="125" class="leader"/>

    <line x1="380" y1="111" x2="380" y2="120" class="dim"/>
    <text x="392" y="115" class="tc" dominant-baseline="central">C1</text>
    <line x1="360" y1="111" x2="380" y2="111" class="leader"/>
    <line x1="360" y1="120" x2="380" y2="120" class="leader"/>

    <line x1="155" y1="300" x2="275" y2="300" class="dim"/>
    <text x="215" y="314" class="t" text-anchor="middle">W1</text>
    <line x1="155" y1="300" x2="155" y2="293" class="leader"/>
    <line x1="275" y1="300" x2="275" y2="293" class="leader"/>

    <line x1="157" y1="75" x2="273" y2="75" class="dim"/>
    <text x="215" y="65" class="t" text-anchor="middle">W2</text>
    <line x1="157" y1="75" x2="157" y2="111" class="leader"/>
    <line x1="273" y1="75" x2="273" y2="111" class="leader"/>

    <line x1="275" y1="300" x2="302" y2="300" class="dim"/>
    <text x="288" y="314" class="t" text-anchor="middle">D1</text>
    <line x1="275" y1="300" x2="275" y2="293" class="leader"/>
    <line x1="302" y1="300" x2="302" y2="125" class="leader"/>

    <line x1="285" y1="116" x2="285" y2="120" class="dim"/>
    <text x="272" y="118" class="tc" text-anchor="end" dominant-baseline="central">C2</text>
  </g>

  <g transform="translate(400,50)">
    <text x="110" y="-30" class="th" text-anchor="middle">参数</text>
    <rect x="0" y="-10" width="230" height="270" fill="#f8f8f8" stroke="#d3d1c7" stroke-width="0.5" rx="6"/>
    <g transform="translate(16,18)">
      <text x="0" y="0" class="t">设计线宽</text><text x="130" y="0" class="tm">W1 = 26.50</text>
      <text x="0" y="26" class="t">线面宽度</text><text x="130" y="26" class="tm">W2 = 25.70</text>
      <text x="0" y="52" class="t">到铜距离</text><text x="130" y="52" class="tm">D1 = 8.00</text>
      <text x="0" y="78" class="t">上参考厚度</text><text x="130" y="78" class="tm">H1 = 41.9291</text>
      <text x="0" y="104" class="t">板材介电常数</text><text x="130" y="104" class="tm">Er1 = 4.2000</text>
      <text x="0" y="130" class="t">铜箔厚度</text><text x="130" y="130" class="tm">T1 = 1.3780</text>
      <text x="0" y="156" class="t">基材上阻焊</text><text x="130" y="156" class="tm">C1 = 1.1969</text>
      <text x="0" y="182" class="t">铜箔上阻焊</text><text x="130" y="182" class="tm">C2 = 0.5000</text>
      <text x="0" y="208" class="t">阻焊介电常数</text><text x="130" y="208" class="tm">CEr = 3.5000</text>
    </g>
    <rect x="16" y="230" width="65" height="24" fill="#ffffff" stroke="#bdbdbd" stroke-width="0.5" rx="4"/>
    <text x="48" y="244" class="tc" text-anchor="middle" dominant-baseline="central">配置</text>
    <rect x="90" y="230" width="65" height="24" fill="#4caf50" stroke="#388e3c" stroke-width="0.5" rx="4"/>
    <text x="122" y="244" class="t" text-anchor="middle" dominant-baseline="central" fill="#ffffff">计算</text>
    <text x="170" y="244" class="th" dominant-baseline="central">55.11 Ω</text>
  </g>
</svg>