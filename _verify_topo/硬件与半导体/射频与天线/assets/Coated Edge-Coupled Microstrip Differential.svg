<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <style>
      .title-text { font-size: 18px; font-weight: bold; fill: #222222; }
      .label-text { font-size: 16px; font-weight: bold; fill: #111111; }
      .dim-text { font-size: 15px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .dim-line { stroke: #666666; stroke-width: 1.2; stroke-dasharray: 3,3; }
      .arrow-line { stroke: #222222; stroke-width: 1.5; }
      .arrow-head { fill: #222222; }
    </style>
    
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
  </defs>

  <text x="30" y="35" class="title-text">阻抗计算 — 表面微带差分 (Coated Edge-Coupled Microstrip Differential)</text>

  <g transform="translate(30, 20)">
    <!-- 1. 底层参考地 (Bottom GND) -->
    <rect x="100" y="310" width="700" height="20" fill="#f5a623" stroke="#d98200" stroke-width="1"/>

    <!-- 2. 介质基材 (Er1) -->
    <rect x="100" y="150" width="700" height="160" fill="#d0d0d0" stroke="#999999" stroke-width="1"/>
    <text x="180" y="240" class="label-text" font-size="22">Er1</text>

    <!-- 3. 顶层双铜线 (差分对) -->
    <polygon points="285,130 355,130 370,150 270,150" fill="#f5a623" stroke="#d98200" stroke-width="1"/>
    <polygon points="465,130 535,130 550,150 450,150" fill="#f5a623" stroke="#d98200" stroke-width="1"/>

    <!-- 4. 绿油阻焊层 (CEr) -->
    <path d="M 100,136 
             L 250,136 
             L 275,115 
             L 365,115 
             L 390,136 
             L 430,136 
             L 455,115 
             L 545,115 
             L 570,136 
             L 800,136 
             L 800,150 
             L 550,150 
             L 535,130 
             L 465,130 
             L 450,150 
             L 370,150 
             L 355,130 
             L 285,130 
             L 270,150 
             L 100,150 Z" 
          fill="#4CAF50" stroke="#388E3C" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- CEr 标识与箭头 -->
    <text x="140" y="108" class="label-text">CEr</text>
    <line x1="155" y1="112" x2="155" y2="134" class="arrow-line" marker-end="url(#arrow-end)"/>

    <!-- C1 厚度（外侧基材） -->
    <line x1="220" y1="136" x2="220" y2="150" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="205" y="147" class="dim-text" style="font-size:13px;">C1</text>

    <!-- C2 厚度（铜皮上） -->
    <line x1="320" y1="115" x2="320" y2="130" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="335" y="125" class="dim-text" style="font-size:13px;">C2</text>

    <!-- C3 厚度（差分间隙 S1） -->
    <line x1="410" y1="136" x2="410" y2="150" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="425" y="147" class="dim-text" style="font-size:13px;">C3</text>

    <!-- 尺寸标注线 -->
    <!-- H1 介质厚度 -->
    <line x1="55" y1="150" x2="100" y2="150" class="dim-line"/>
    <line x1="55" y1="310" x2="100" y2="310" class="dim-line"/>
    <line x1="68" y1="150" x2="68" y2="310" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="40" y="235" class="dim-text" font-size="16">H1</text>

    <!-- T1 铜厚 -->
    <line x1="800" y1="130" x2="845" y2="130" class="dim-line"/>
    <line x1="800" y1="150" x2="845" y2="150" class="dim-line"/>
    <line x1="830" y1="130" x2="830" y2="150" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="858" y="145" class="dim-text">T1</text>

    <!-- S1 差分线间距 -->
    <line x1="355" y1="60" x2="355" y2="130" class="dim-line"/>
    <line x1="465" y1="60" x2="465" y2="130" class="dim-line"/>
    <line x1="355" y1="70" x2="465" y2="70" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="410" y="60" class="dim-text">S1</text>

    <!-- W2 顶线宽 -->
    <line x1="465" y1="60" x2="465" y2="130" class="dim-line"/>
    <line x1="535" y1="60" x2="535" y2="130" class="dim-line"/>
    <line x1="465" y1="70" x2="535" y2="70" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="500" y="60" class="dim-text">W2</text>

    <!-- W1 底线宽 -->
    <line x1="450" y1="150" x2="450" y2="365" class="dim-line"/>
    <line x1="550" y1="150" x2="550" y2="365" class="dim-line"/>
    <line x1="450" y1="355" x2="550" y2="355" class="arrow-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="500" y="380" class="dim-text">W1</text>
  </g>
</svg>
