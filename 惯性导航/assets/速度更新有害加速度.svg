<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
<title>速度更新：比力积分 + 有害加速度补偿</title>
<desc>速度微分方程的三项：比力转换到导航系后的积分、重力加速度、以及地球自转与导航系旋转引起的哥氏加速度（与速度相关项）。后两项合称有害加速度，必须在速度更新中补偿。</desc>
<style>
.th{font-size:13.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.eq{font-size:15px;font-weight:700;font-family:'Cambria Math','Times New Roman',serif;}
</style>

<!-- 标题 -->
<text class="th" x="340" y="26" text-anchor="middle" fill="#0C447C">速度更新 = 比力积分 + 有害加速度补偿</text>

<!-- 主公式条 -->
<rect x="40" y="42" width="600" height="52" rx="8" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.2"/>
<text class="eq" x="340" y="66" text-anchor="middle" fill="#0C447C">v̇ⁿ = C_bⁿ fᵇ − (2ω_ieⁿ + ω_enⁿ) × vⁿ + gₚⁿ</text>
<text class="ts" x="340" y="86" text-anchor="middle" fill="#5F5E5A">（牛小骥 I2NAV 讲义 式 18：n 系速度微分方程）</text>

<!-- 三个分块 -->
<!-- 块1：比力积分 -->
<rect x="40" y="118" width="190" height="150" rx="10" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.6"/>
<text class="th" x="135" y="142" text-anchor="middle" fill="#27500A">① 比力项（有用）</text>
<text class="eq" x="135" y="168" text-anchor="middle" fill="#3B6D11" font-size="13">Δv_f = C_bⁿ fᵇ dt</text>
<text class="ts" x="135" y="192" text-anchor="middle">真实"感受"到的力（含重力反作用）</text>
<text class="ts" x="135" y="210" text-anchor="middle">→ 转导航系后积分</text>
<text class="ts" x="135" y="230" text-anchor="middle" fill="#27500A">这就是我们要的速度变化</text>
<text class="ts" x="135" y="252" text-anchor="middle" font-size="9">靠姿态矩阵 C_bⁿ 把比力转到 NED</text>

<!-- 块2：重力 -->
<rect x="245" y="118" width="190" height="150" rx="10" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.6"/>
<text class="th" x="340" y="142" text-anchor="middle" fill="#7E3318">② 重力项（有害①）</text>
<text class="eq" x="340" y="168" text-anchor="middle" fill="#B5502A" font-size="13">+ gₚⁿ</text>
<text class="ts" x="340" y="192" text-anchor="middle">重力是"免费的"，但加计测的比力</text>
<text class="ts" x="340" y="210" text-anchor="middle">不包含它（03 篇讲过）</text>
<text class="ts" x="340" y="230" text-anchor="middle" fill="#7E3318">必须加回来才得到真实加速度</text>
<text class="ts" x="340" y="252" text-anchor="middle" font-size="9">NED 下 gₚ ≈ (0, 0, +9.81)</text>

<!-- 块3：哥氏 -->
<rect x="450" y="118" width="190" height="150" rx="10" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.6"/>
<text class="th" x="545" y="142" text-anchor="middle" fill="#0C447C">③ 哥氏项（有害②）</text>
<text class="eq" x="545" y="168" text-anchor="middle" fill="#185FA5" font-size="13">− (2ω_ie+ω_en)×v</text>
<text class="ts" x="545" y="192" text-anchor="middle">地球自转 + 载体在地球表面移动</text>
<text class="ts" x="545" y="210" text-anchor="middle">引起的"假力"（科里奥利）</text>
<text class="ts" x="545" y="230" text-anchor="middle" fill="#0C447C">速度越快、纬度越高越显著</text>
<text class="ts" x="545" y="252" text-anchor="middle" font-size="9">ω_ie=7.29e-5 rad/s（地球自转角速度）</text>

<!-- 底部小结 -->
<rect x="40" y="286" width="600" height="78" rx="8" fill="#F6F4EC" stroke="#B9A15C" stroke-width="1.2"/>
<text class="th" x="56" y="308" fill="#5C4A1E">为什么叫"有害加速度"（牛小骥讲义术语）</text>
<text class="ts" x="56" y="328">重力项和哥氏项不是载体的真实运动，而是"坐标系在动"造成的假象——机械编排里必须显式补偿，否则速度、位置会系统性发散。</text>
<text class="ts" x="56" y="348" fill="#5F5E5A">工程实现（PSINS insupdate）：ins.an = rotv(−ω_nin·Δt/2, f_n) + ins.eth.gcc  —— gcc 就是"重力+哥氏"打包项</text>
</svg>
