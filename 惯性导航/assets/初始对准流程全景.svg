<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>初始对准流程全景：粗对准 → 精对准 → 动基座</title>
<desc>初始对准三步走：粗对准(秒级,重力+地球自转 TRIAD 定姿态) → 精对准(KF,零速/比力量测收敛残余误差) → 动基座对准(行进间 i0 法)。方法谱系：alignsb/aligni0/alignfn/alignvn/aligncmps。</desc>
<style>
.th{font-size:13.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="26" text-anchor="middle" fill="#0C447C">初始对准三步走（一图流）</text>

<!-- 第一步：粗对准 -->
<rect x="30" y="60" width="190" height="200" rx="12" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.6"/>
<text class="th" x="125" y="86" text-anchor="middle" fill="#27500A">① 粗对准（秒级）</text>
<text class="ts" x="125" y="106" text-anchor="middle">解析法 · 静基座</text>
<rect x="50" y="118" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
<text class="lb" x="125" y="138" text-anchor="middle" fill="#3B6D11" font-size="10">重力定水平</text>
<text class="ts" x="125" y="156" text-anchor="middle" font-size="9">俯仰/横滚 ±0.1°</text>
<rect x="50" y="178" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
<text class="lb" x="125" y="198" text-anchor="middle" fill="#3B6D11" font-size="10">地球自转定航向</text>
<text class="ts" x="125" y="216" text-anchor="middle" font-size="9">MEMS 陀螺噪声大 → ±几度</text>
<text class="ts" x="125" y="248" text-anchor="middle" font-size="9">PSINS: alignsb / dv2atti</text>

<!-- 箭头 -->
<line x1="220" y1="160" x2="255" y2="160" stroke="#5F5E5A" stroke-width="2" marker-end="url(#af)"/>
<text class="ts" x="238" y="152" text-anchor="middle" font-size="9">初值</text>

<!-- 第二步：精对准 -->
<rect x="260" y="60" width="190" height="200" rx="12" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.6"/>
<text class="th" x="355" y="86" text-anchor="middle" fill="#0C447C">② 精对准（分钟级）</text>
<text class="ts" x="355" y="106" text-anchor="middle">卡尔曼滤波 · 静基座</text>
<rect x="280" y="118" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
<text class="lb" x="355" y="138" text-anchor="middle" fill="#0C447C" font-size="10">零速量测 v=0</text>
<text class="ts" x="355" y="156" text-anchor="middle" font-size="9">估计失准角 φ + 零偏</text>
<rect x="280" y="178" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
<text class="lb" x="355" y="198" text-anchor="middle" fill="#0C447C" font-size="10">收敛残余失准角</text>
<text class="ts" x="355" y="216" text-anchor="middle" font-size="9">水平 0.01°级、航向 <0.1°</text>
<text class="ts" x="355" y="248" text-anchor="middle" font-size="9">PSINS: alignvn / alignfn</text>

<!-- 箭头 -->
<line x1="450" y1="160" x2="485" y2="160" stroke="#5F5E5A" stroke-width="2" marker-end="url(#af)"/>
<text class="ts" x="468" y="152" text-anchor="middle" font-size="9">收敛</text>

<!-- 第三步：动基座 -->
<rect x="490" y="60" width="160" height="200" rx="12" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.6"/>
<text class="th" x="570" y="86" text-anchor="middle" fill="#7E3318">③ 动基座（进阶）</text>
<text class="ts" x="570" y="106" text-anchor="middle">行进间对准</text>
<rect x="505" y="118" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#B5502A" stroke-width="1"/>
<text class="lb" x="570" y="138" text-anchor="middle" fill="#B5502A" font-size="10">i0 法 / Wahba</text>
<text class="ts" x="570" y="156" text-anchor="middle" font-size="9">惯性系积分对准</text>
<rect x="505" y="178" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#B5502A" stroke-width="1"/>
<text class="lb" x="570" y="198" text-anchor="middle" fill="#B5502A" font-size="10">车辆转弯/晃动</text>
<text class="ts" x="570" y="216" text-anchor="middle" font-size="9">利用运动激励收敛</text>
<text class="ts" x="570" y="248" text-anchor="middle" font-size="9">PSINS: aligni0</text>

<!-- 底部 -->
<rect x="30" y="286" width="620" height="118" rx="10" fill="#F6F4EC" stroke="#B9A15C" stroke-width="1.2"/>
<text class="th" x="340" y="310" text-anchor="middle" fill="#5C4A1E" font-size="12">对本项目（AHRS-Board）</text>
<text class="ts" x="340" y="332" text-anchor="middle" font-size="10">固件目前假设初始姿态已知（外部传入 nom.q），无独立对准模块 —— 这就是待补的空白</text>
<text class="ts" x="340" y="352" text-anchor="middle" font-size="10">落地路径：① 上电静止 1~10s 粗对准（alignsb 移植，~30 行 C）</text>
<text class="ts" x="340" y="370" text-anchor="middle" font-size="10">② 有 GNSS 速度时用零速/速度量测精对准（alignvn 思路进 ESKF）</text>
<text class="ts" x="340" y="388" text-anchor="middle" font-size="10">③ 车载动基座可用 aligni0（用整车运动当"转台"）—— 08 篇第五节展开</text>
</svg>
