<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>Allan 方差计算：簇平均 → 差分 → 方差</title>
<desc>Allan 方差不是普通方差：对原始数据按 τ 长度分簇 → 每簇取平均 → 相邻簇均值作差 → 差值的方差除 2 再开方 = Allan 偏差 σ_A(τ)。通过改变 τ，得到一族 (τ, σ_A) 点，画 log-log 即 Allan 曲线。</desc>
<style>
.th{font-size:13.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 标题 -->
<text class="th" x="340" y="24" text-anchor="middle" fill="#0C447C">Allan 方差计算：4 步走</text>

<!-- 第1步：原始数据 -->
<rect x="20" y="56" width="150" height="100" rx="8" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.4"/>
<text class="th" x="95" y="78" text-anchor="middle" fill="#185FA5">① 原始数据 y(t)</text>
<!-- 折线模拟 -->
<polyline points="35,135 50,125 65,138 80,128 95,140 110,130 125,142 140,132 155,145" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<line x1="32" y1="150" x2="158" y2="150" stroke="#5F5E5A" stroke-width="1"/>
<line x1="32" y1="90" x2="32" y2="150" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="95" y="100" text-anchor="middle">N 个采样点，间隔 ts</text>

<!-- 箭头 -->
<line x1="172" y1="106" x2="206" y2="106" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>

<!-- 第2步：分簇 + 平均 -->
<rect x="210" y="56" width="168" height="100" rx="8" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.4"/>
<text class="th" x="297" y="78" text-anchor="middle" fill="#B5502A">② 按 τ 分簇取平均</text>
<!-- 簇 -->
<rect x="220" y="92" width="34" height="44" fill="#FDE9D6" stroke="#B5502A" stroke-width="1"/>
<rect x="258" y="92" width="34" height="44" fill="#FDE9D6" stroke="#B5502A" stroke-width="1"/>
<rect x="296" y="92" width="34" height="44" fill="#FDE9D6" stroke="#B5502A" stroke-width="1"/>
<rect x="334" y="92" width="34" height="44" fill="#FDE9D6" stroke="#B5502A" stroke-width="1"/>
<text class="ts" x="239" y="118" text-anchor="middle" fill="#7E3318">簇1</text>
<text class="ts" x="277" y="118" text-anchor="middle" fill="#7E3318">簇2</text>
<text class="ts" x="315" y="118" text-anchor="middle" fill="#7E3318">簇3</text>
<text class="ts" x="352" y="118" text-anchor="middle" fill="#7E3318">簇4</text>
<text class="ts" x="297" y="150" text-anchor="middle">每 m 个点成一簇 → K=N/m 簇</text>

<!-- 箭头 -->
<line x1="382" y1="106" x2="415" y2="106" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>

<!-- 第3步：差分 -->
<rect x="420" y="56" width="120" height="100" rx="8" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.4"/>
<text class="th" x="480" y="78" text-anchor="middle" fill="#3B6D11">③ 相邻簇差分</text>
<text class="lb" x="430" y="100" fill="#27500A">d_k = ȳ_{k+1} − ȳ_k</text>
<text class="ts" x="432" y="118">k=1..K-1</text>
<text class="ts" x="432" y="138">共 K-1 个差</text>

<!-- 箭头 -->
<line x1="545" y1="106" x2="576" y2="106" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>

<!-- 第4步：方差 -->
<rect x="580" y="56" width="78" height="100" rx="8" fill="#FDF3E7" stroke="#854F0B" stroke-width="1.4"/>
<text class="th" x="622" y="78" text-anchor="middle" fill="#854F0B">④ Allan 偏差</text>
<text class="lb" x="595" y="105" fill="#854F0B" font-size="9.5">σ_A(τ) =</text>
<text class="lb" x="595" y="118" fill="#854F0B" font-size="9.5">√Var(d)/√2</text>
<text class="ts" x="622" y="142" text-anchor="middle" font-size="9">一个 (τ, σ_A) 点</text>

<!-- 改变 τ -->
<rect x="20" y="180" width="640" height="74" rx="8" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.2"/>
<text class="th" x="340" y="202" text-anchor="middle" fill="#0C447C">改变 τ → 改变簇长 m = τ/ts → 重复 ②③④ → 得到一族 (τ, σ_A) 点</text>
<text class="ts" x="340" y="226" text-anchor="middle">τ 通常取 2^k·ts (PSINS 风格) 或 logspace 网格 (本项目风格) → 17~40 个点足够画曲线</text>
<text class="ts" x="340" y="244" text-anchor="middle" fill="#5F5E5A">τ 越大 = 看得越久 = 抹平短期噪声 → 暴露长期漂移；τ 越小 = 看得越短 = 放大短期噪声</text>

<!-- 下方：log-log 曲线 + 5 段 -->
<text class="th" x="340" y="284" text-anchor="middle" fill="#0C447C">log-log 画出来就是 Allan 曲线，五段斜率对应不同噪声</text>
<line x1="60" y1="376" x2="640" y2="376" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ag)"/>
<line x1="60" y1="376" x2="60" y2="296" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ag)"/>
<text class="ts" x="43" y="295" text-anchor="middle" font-size="9.5">log σ</text>
<text class="ts" x="650" y="388" text-anchor="end" font-size="9.5">log τ →</text>

<!-- 示意五段曲线（分段折线） -->
<polyline points="60,304 110,328 170,348 240,365 340,374 460,373 560,360 640,338" fill="none" stroke="#0C447C" stroke-width="2.2"/>

<!-- 五段标注 -->
<text class="lb" x="75" y="310" fill="#0C447C" font-size="9.5">QN</text>
<text class="ts" x="75" y="328" font-size="9">−1</text>

<text class="lb" x="178" y="338" fill="#27500A" font-size="9.5">ARW</text>
<text class="ts" x="178" y="350" font-size="9">−1/2</text>

<text class="lb" x="338" y="392" fill="#7E3318" font-size="9.5">BI (0 平台)</text>

<text class="lb" x="478" y="354" fill="#3B6D11" font-size="9.5">RRW +1/2</text>

<text class="lb" x="595" y="320" fill="#854F0B" font-size="9.5">RR +1</text>
</svg>
