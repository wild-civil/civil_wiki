<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <style>
    .ax   { stroke-width: 2; fill: none; }
    .vec  { stroke-width: 3.5; fill: none; }
    .lbl  { font-size: 16px; font-weight: 700; }
    .sub  { font-size: 13px; fill: #555; }
    .dash { stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .title{ font-size: 15px; font-weight: 700; fill: #222; }
  </style>

  <defs>
    <marker id="ah-red"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d32f2f"/></marker>
    <marker id="ah-blue"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2e7d32"/></marker>
  </defs>

  <!-- ===== 左：|a×b| = 平行四边形面积 ===== -->
  <text x="24" y="30" class="title">① |a×b| = 平行四边形面积</text>

  <g>
    <circle cx="110" cy="250" r="3.5" fill="#333"/>
    <!-- a（红，沿 X） -->
    <line x1="110" y1="250" x2="240" y2="250" class="vec" stroke="#d32f2f" marker-end="url(#ah-red)"/>
    <!-- b（蓝） -->
    <line x1="110" y1="250" x2="172" y2="158" class="vec" stroke="#1565c0" marker-end="url(#ah-blue)"/>
    <!-- 平行四边形 -->
    <polygon points="110,250 240,250 302,158 172,158" fill="#eef2ff" stroke="none"/>
    <line x1="240" y1="250" x2="302" y2="158" class="dash" stroke="#888"/>
    <line x1="172" y1="158" x2="302" y2="158" class="dash" stroke="#888"/>
  </g>
  <text x="244" y="254" class="lbl" fill="#d32f2f">a</text>
  <text x="176" y="152" class="lbl" fill="#1565c0">b</text>
  <text x="180" y="216" class="lbl" fill="#2e7d32">面积 S</text>

  <!-- 夹角 θ -->
  <path d="M 136 250 A 26 26 0 0 1 143 235" class="dash" stroke="#888"/>
  <text x="118" y="236" class="lbl" fill="#333">θ</text>

  <text x="24" y="300" class="sub">|a×b| = |a||b|sinθ = 邻边 a、b 的平行四边形面积。方向再带上 a×b 指向纸外。</text>

  <!-- ===== 右：物理画面——力矩拧瓶盖 ===== -->
  <text x="410" y="30" class="title">② 物理画面：力矩 τ = r×F</text>

  <!-- 瓶盖 -->
  <circle cx="520" cy="210" r="72" fill="#fafafa" stroke="#ccd2dc" stroke-width="2"/>
  <!-- 力臂 r（红） -->
  <line x1="520" y1="210" x2="592" y2="210" class="vec" stroke="#d32f2f" marker-end="url(#ah-red)"/>
  <text x="596" y="214" class="lbl" fill="#d32f2f">r</text>
  <!-- 力 F（蓝，圆切线） -->
  <line x1="448" y1="138" x2="592" y2="138" class="vec" stroke="#1565c0" marker-end="url(#ah-blue)"/>
  <text x="596" y="142" class="lbl" fill="#1565c0">F</text>
  <!-- τ 沿转轴（⊙ 指向纸外） -->
  <circle cx="520" cy="210" r="7" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <circle cx="520" cy="210" r="2.5" fill="#2e7d32"/>
  <text x="540" y="206" class="lbl" fill="#2e7d32">τ = r×F ↗（纸外）</text>

  <text x="410" y="300" class="sub">拧瓶盖：F 作用在力臂 r 末端，τ 方向沿转轴（垂直纸面向外）——叉积的方向 = "它会怎么转"。</text>
</svg>