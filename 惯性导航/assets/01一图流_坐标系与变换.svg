<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img">
<title>01 一图流：坐标系与变换</title>
<desc>惯导的坐标系链路：ECI → ECEF → 当地水平(NED/ENU) → Body。位置管 ECEF↔水平，姿态管 水平↔Body；核心变换是旋转矩阵 R，逆=转置。</desc>
<style>
.th{font-size:14px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:11px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:11px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="26" text-anchor="middle" fill="#0C447C">坐标系四级链路（一图流）</text>

<!-- 四级坐标块 -->
<rect x="20" y="70" width="140" height="66" rx="10" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="th" x="90" y="95" text-anchor="middle" fill="#185FA5">ECI 惯性系</text>
<text class="ts" x="90" y="115" text-anchor="middle">牛顿定律真正成立</text>
<text class="ts" x="90" y="129" text-anchor="middle">(短时 MEMS 不用)</text>

<line x1="160" y1="103" x2="195" y2="103" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a1)"/>
<text class="ts" x="178" y="95" text-anchor="middle" font-size="10">地球自转</text>

<rect x="200" y="70" width="140" height="66" rx="10" fill="#F6F8FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="th" x="270" y="95" text-anchor="middle" fill="#185FA5">ECEF 地心固连</text>
<text class="ts" x="270" y="115" text-anchor="middle">随地球转、Z 指北极</text>
<text class="ts" x="270" y="129" text-anchor="middle">GNSS 对接用</text>

<line x1="340" y1="103" x2="375" y2="103" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a1)"/>
<text class="ts" x="358" y="95" text-anchor="middle" font-size="10">经纬度</text>

<rect x="380" y="70" width="140" height="66" rx="10" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.5"/>
<text class="th" x="450" y="95" text-anchor="middle" fill="#27500A">当地水平 NED</text>
<text class="ts" x="450" y="115" text-anchor="middle">z 向下=重力方向</text>
<text class="ts" x="450" y="129" text-anchor="middle">我们干活的地方 ⭐</text>

<line x1="520" y1="103" x2="555" y2="103" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a1)"/>
<text class="ts" x="538" y="95" text-anchor="middle" font-size="10">姿态</text>

<rect x="560" y="70" width="100" height="66" rx="10" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.5"/>
<text class="th" x="610" y="95" text-anchor="middle" fill="#B5502A">Body 载体</text>
<text class="ts" x="610" y="115" text-anchor="middle">x-前 y-右 z-下</text>
<text class="ts" x="610" y="129" text-anchor="middle">IMU 直接测的</text>

<!-- 职责分离 -->
<rect x="20" y="160" width="640" height="52" rx="10" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.2"/>
<text class="th" x="340" y="182" text-anchor="middle" fill="#0C447C" font-size="12">职责分离：位置管「ECEF↔水平」，姿态管「水平↔Body」</text>
<text class="ts" x="340" y="200" text-anchor="middle">→ 这是惯导解算能模块化的根本原因</text>

<!-- 核心变换 -->
<rect x="20" y="228" width="640" height="56" rx="10" fill="#F6F4EC" stroke="#B9A15C" stroke-width="1.2"/>
<text class="th" x="60" y="252" fill="#5C4A1E" font-size="12">核心变换：</text>
<text class="lb" x="150" y="252" fill="#5C4A1E" font-size="12">v_a = R_ab · v_b</text>
<text class="ts" x="300" y="252" font-size="11">旋转矩阵 R ∈ SO(3)，R^T R = I</text>
<text class="lb" x="150" y="272" fill="#5C4A1E" font-size="12">逆 = 转置：R_ba = R_ab^T</text>
<text class="ts" x="300" y="272" font-size="11">用反方向必翻车（前↔后、右↔左）</text>
</svg>
