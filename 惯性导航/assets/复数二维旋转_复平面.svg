<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>复平面上向量被单位复数旋转</title>
  <desc>蓝色向量 w 经单位复数 e^{iθ} 作用后变为红色向量 w'，两者长度相同，夹角 θ。</desc>
  <line x1="40" y1="240" x2="430" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="170" y1="310" x2="170" y2="40" stroke="#333" stroke-width="1.5"/>
  <text x="408" y="262" fill="#333" font-size="14">Re 实轴</text>
  <text x="150" y="52" fill="#333" font-size="14">Im 虚轴</text>
  <circle cx="170" cy="240" r="160" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="170" y1="240" x2="314" y2="174" stroke="#185fa5" stroke-width="3"/>
  <circle cx="314" cy="174" r="4" fill="#185fa5"/>
  <text x="320" y="168" fill="#185fa5" font-size="15">w</text>
  <line x1="170" y1="240" x2="226" y2="92" stroke="#a32d2d" stroke-width="3"/>
  <circle cx="226" cy="90" r="4" fill="#a32d2d"/>
  <text x="232" y="84" fill="#a32d2d" font-size="15">w' = e^{iθ}·w</text>
  <path d="M208,220 A52,52 0 0 1 183,200" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="214" fill="#333" font-size="13">θ</text>
  <text x="250" y="296" fill="#555" font-size="13">模长不变：|w'| = |w| —— 纯旋转只转方向，不改长度</text>
</svg>
