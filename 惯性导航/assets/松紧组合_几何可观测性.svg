<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .t { font: 700 15px sans-serif; fill: #0f172a; }
      .sub { font: 400 11.5px sans-serif; fill: #475569; }
      .bh { font: 600 12.5px sans-serif; fill: #0f172a; }
      .bs { font: 400 11px sans-serif; fill: #334155; }
      .note { font: 400 11.5px sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="480" fill="#f8fafc"/>

  <!-- ============ 左：TC 视线几何 ============ -->
  <text x="180" y="26" text-anchor="middle" class="t">TC：每条视线(LOS)矢量 = H 的一行</text>

  <!-- satellites -->
  <circle cx="90"  cy="92"  r="13" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="210" cy="70"  r="13" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="300" cy="150" r="13" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="90"  y="96"  text-anchor="middle" fill="#fff" font-size="10">S1</text>
  <text x="210" y="74"  text-anchor="middle" fill="#fff" font-size="10">S2</text>
  <text x="300" y="154" text-anchor="middle" fill="#fff" font-size="10">S3</text>

  <!-- receiver -->
  <circle cx="160" cy="380" r="9" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
  <text x="160" y="402" text-anchor="middle" class="bs">接收机(INS 估计位置 p_ins)</text>

  <!-- LOS lines -->
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="160" y1="380" x2="90"  y2="92"/>
    <line x1="160" y1="380" x2="210" y2="70"/>
    <line x1="160" y1="380" x2="300" y2="150"/>
  </g>
  <!-- LOS unit-vector ticks -->
  <g fill="#f59e0b" font-size="11" font-weight="600">
    <text x="118" y="240">e₁</text>
    <text x="200" y="225">e₂</text>
    <text x="240" y="270">e₃</text>
  </g>

  <rect x="30" y="418" width="300" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="40" y="437" class="note">H 的第 k 行 = +e_k（接收机→卫星单位矢量）。</text>
  <text x="40" y="455" class="note">可见几颗星，H 就有几行 → 逐星累加约束。</text>

  <!-- ============ 右：1/2/3 星约束递进 ============ -->
  <text x="510" y="26" text-anchor="middle" class="t">少星时：TC 逐星约束，LC 须先有 PVT</text>

  <!-- panel 1: 1 SV -> sphere -->
  <rect x="360" y="50" width="300" height="110" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="372" y="70" class="bh">① 1 颗星</text>
  <circle cx="475" cy="125" r="34" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="475" cy="125" r="6" fill="#22c55e"/>
  <text x="500" y="100" class="bs">卫星</text>
  <circle cx="500" cy="150" r="5" fill="#3b82f6"/>
  <text x="510" y="153" class="bs">接收机(可在球上任一点)</text>
  <text x="372" y="150" class="note">1 个伪距 = 以卫星为心的球面，</text>
  <text x="372" y="166" class="note">位置仍无限多 → 1 维约束。</text>

  <!-- panel 2: 2 SV -> circle -->
  <rect x="360" y="178" width="300" height="110" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="372" y="198" class="bh">② 2 颗星</text>
  <circle cx="455" cy="255" r="32" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="525" cy="255" r="32" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="455" cy="255" r="6" fill="#22c55e"/>
  <circle cx="525" cy="255" r="6" fill="#22c55e"/>
  <line x1="490" y1="255" x2="490" y2="223" stroke="#3b82f6" stroke-width="3"/>
  <text x="500" y="222" class="bs">交线=圆</text>
  <text x="372" y="280" class="note">2 球面交成圆 → 2 维约束，</text>
  <text x="372" y="296" class="note">仍非确定点。</text>

  <!-- panel 3: 3-4 SV -> point -->
  <rect x="360" y="306" width="300" height="110" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="372" y="326" class="bh">③ 3~4 颗星</text>
  <circle cx="455" cy="378" r="28" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="520" cy="368" r="28" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="488" cy="398" r="28" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="487" cy="381" r="6" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
  <text x="530" y="372" class="bs">公共点=定位</text>
  <text x="372" y="412" class="note">交线收敛为点 → 3D 定位(含钟差</text>
  <text x="372" y="428" class="note">通常需 4 星)。TC 在 1~3 星阶段</text>
  <text x="372" y="444" class="note">已能部分修正，LC 此时 PVT 全无。</text>
</svg>
