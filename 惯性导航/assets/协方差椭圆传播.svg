<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">协方差椭圆：预测膨胀 + 更新收缩</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#4a5568">KF 的"自信度"调节器——P 矩阵就是不确定性椭圆的几何</text>

  <!-- 坐标轴（隐喻二维状态空间） -->
  <line x1="60" y1="310" x2="640" y2="310" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="60" y1="140" x2="60" y2="310" stroke="#cbd5e0" stroke-width="1"/>
  <text x="50" y="150" text-anchor="end" font-size="10" fill="#718096">状态 y</text>
  <text x="645" y="328" text-anchor="end" font-size="10" fill="#718096">状态 x</text>

  <!-- t=k 先验 P_k（中等椭圆） -->
  <ellipse cx="150" cy="240" rx="38" ry="20" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.6" opacity="0.5"/>
  <text x="150" y="244" text-anchor="middle" font-size="10" fill="#2b6cb0" font-weight="bold">先验 Pₖ</text>
  <text x="150" y="278" text-anchor="middle" font-size="9" fill="#4a5568">（上一轮更新后的）</text>

  <!-- t=k+1 预测 P_{k+1}^-（膨胀椭圆，蓝虚线） -->
  <ellipse cx="320" cy="240" rx="65" ry="33" fill="none" stroke="#2b6cb0" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="320" y="244" text-anchor="middle" font-size="10" fill="#2b6cb0" font-weight="bold">预测 P⁻ = ΦPΦᵀ+Q</text>
  <text x="320" y="200" text-anchor="middle" font-size="9" fill="#4a5568">"变不确定" ↑</text>

  <!-- t=k+1 量测约束（绿椭圆，似然） -->
  <ellipse cx="450" cy="240" rx="38" ry="50" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.6" opacity="0.4"/>
  <text x="450" y="244" text-anchor="middle" font-size="10" fill="#2f855a" font-weight="bold">量测约束</text>
  <text x="450" y="278" text-anchor="middle" font-size="9" fill="#4a5568">（H⁻¹·z 周围）</text>

  <!-- t=k+1 更新 P_{k+1}^+（收缩椭圆，绿实线） -->
  <ellipse cx="550" cy="240" rx="35" ry="18" fill="#9ae6b4" stroke="#2f855a" stroke-width="1.8" opacity="0.5"/>
  <text x="550" y="244" text-anchor="middle" font-size="10" fill="#2f855a" font-weight="bold">后验 P⁺</text>
  <text x="550" y="200" text-anchor="middle" font-size="9" fill="#2f855a">"变确定" ↓</text>

  <!-- 箭头 -->
  <line x1="195" y1="240" x2="248" y2="240" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#e1)"/>
  <text x="220" y="228" text-anchor="middle" font-size="10" fill="#2b6cb0" font-weight="bold">预测</text>
  <line x1="385" y1="240" x2="408" y2="240" stroke="#4a5568" stroke-width="1.5" marker-end="url(#e1)"/>
  <text x="396" y="228" text-anchor="middle" font-size="10" fill="#4a5568">量测</text>
  <line x1="488" y1="240" x2="515" y2="240" stroke="#2f855a" stroke-width="2.2" marker-end="url(#e2)"/>
  <text x="500" y="228" text-anchor="middle" font-size="10" fill="#2f855a" font-weight="bold">融合</text>

  <!-- 状态点 -->
  <circle cx="150" cy="240" r="3" fill="#2b6cb0"/>
  <circle cx="320" cy="240" r="3" fill="#2b6cb0"/>
  <circle cx="450" cy="240" r="3" fill="#2f855a"/>
  <circle cx="550" cy="240" r="3" fill="#2f855a"/>

  <!-- 底部说明 -->
  <rect x="60" y="340" width="580" height="32" rx="8" fill="#fef3c7" stroke="#b7791f" stroke-width="1"/>
  <text x="350" y="358" text-anchor="middle" font-size="11" fill="#744210" font-weight="bold">K = PHᵀ·(HPHᵀ+R)⁻¹ = "信预测 vs 信量测"的最优权重（贝叶斯：高斯×高斯→高斯）</text>
</svg>