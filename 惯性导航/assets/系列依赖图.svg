<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>惯导 wiki 系列依赖图</title>
<desc>系列学习依赖图：M1 基础篇(01-05)串行打地基，M2 解算篇(06-09)依赖基础篇，M3 融合篇(10-16)依赖解算篇。绿色=已发布，灰色=规划中。</desc>
<style>
.th{font-size:13px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.ts{font-size:10.5px;fill:#5F5E5A;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
.lb{font-size:10.5px;font-weight:700;font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
</style>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A86" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="24" text-anchor="middle" fill="#0C447C">惯导自学系列：依赖关系图（M1 基础 → M2 解算 → M3 融合）</text>

<!-- M1 行 -->
<text class="lb" x="30" y="52" fill="#27500A">M1 基础篇（✅ 已发布）</text>
<rect x="30" y="60" width="120" height="34" rx="8" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.3"/>
<text class="lb" x="90" y="80" text-anchor="middle" fill="#27500A" font-size="10">01 坐标系</text>
<rect x="170" y="60" width="120" height="34" rx="8" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.3"/>
<text class="lb" x="230" y="80" text-anchor="middle" fill="#27500A" font-size="10">02 姿态表示</text>
<rect x="310" y="60" width="120" height="34" rx="8" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.3"/>
<text class="lb" x="370" y="80" text-anchor="middle" fill="#27500A" font-size="10">03 传感器</text>
<rect x="450" y="60" width="120" height="34" rx="8" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.3"/>
<text class="lb" x="510" y="80" text-anchor="middle" fill="#27500A" font-size="10">04 误差模型</text>
<rect x="560" y="108" width="110" height="34" rx="8" fill="#F3F8F1" stroke="#3B6D11" stroke-width="1.3"/>
<text class="lb" x="615" y="128" text-anchor="middle" fill="#27500A" font-size="10">05 Allan</text>

<!-- M1 串行箭头 -->
<line x1="150" y1="77" x2="168" y2="77" stroke="#8A8A86" stroke-width="1.2" marker-end="url(#ad)"/>
<line x1="290" y1="77" x2="308" y2="77" stroke="#8A8A86" stroke-width="1.2" marker-end="url(#ad)"/>
<line x1="430" y1="77" x2="448" y2="77" stroke="#8A8A86" stroke-width="1.2" marker-end="url(#ad)"/>
<line x1="570" y1="94" x2="596" y2="112" stroke="#8A8A86" stroke-width="1.2" marker-end="url(#ad)"/>

<!-- M1 → M2 大箭头 -->
<line x1="615" y1="142" x2="615" y2="168" stroke="#3B6D11" stroke-width="2" marker-end="url(#ad)"/>
<text class="ts" x="628" y="158" font-size="9" fill="#27500A">依赖 M1</text>

<!-- M2 行 -->
<text class="lb" x="30" y="188" fill="#185FA5">M2 解算篇（06 ✅ / 07-09 规划）</text>
<rect x="30" y="196" width="130" height="34" rx="8" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.3"/>
<text class="lb" x="95" y="216" text-anchor="middle" fill="#0C447C" font-size="10">06 机械编排 ✅</text>
<rect x="180" y="196" width="130" height="34" rx="8" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.3"/>
<text class="lb" x="245" y="216" text-anchor="middle" fill="#0C447C" font-size="10">07 姿态更新 ✅</text>
<rect x="330" y="196" width="130" height="34" rx="8" fill="#F0F0EE" stroke="#9A9A96" stroke-width="1.3"/>
<text class="lb" x="395" y="216" text-anchor="middle" fill="#6E6E6A" font-size="10">08 初始对准</text>
<rect x="480" y="196" width="130" height="34" rx="8" fill="#F0F0EE" stroke="#9A9A96" stroke-width="1.3"/>
<text class="lb" x="545" y="216" text-anchor="middle" fill="#6E6E6A" font-size="10">09 误差传播</text>

<!-- M2 依赖 M1 的虚线 -->
<line x1="95" y1="196" x2="140" y2="108" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="245" y1="196" x2="300" y2="108" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3"/>

<!-- M2 → M3 大箭头 -->
<line x1="545" y1="230" x2="545" y2="256" stroke="#185FA5" stroke-width="2" marker-end="url(#ad)"/>
<text class="ts" x="558" y="246" font-size="9" fill="#0C447C">依赖 M2</text>

<!-- M3 行 -->
<text class="lb" x="30" y="276" fill="#7E3318">M3 融合篇（规划中）</text>
<rect x="30" y="284" width="150" height="34" rx="8" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.3"/>
<text class="lb" x="105" y="304" text-anchor="middle" fill="#7E3318" font-size="10">10-11 卡尔曼/ESKF</text>
<rect x="200" y="284" width="150" height="34" rx="8" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.3"/>
<text class="lb" x="275" y="304" text-anchor="middle" fill="#7E3318" font-size="10">12-13 观测/组合</text>
<rect x="370" y="284" width="150" height="34" rx="8" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.3"/>
<text class="lb" x="445" y="304" text-anchor="middle" fill="#7E3318" font-size="10">14-15 验证/冗余</text>
<rect x="540" y="284" width="120" height="34" rx="8" fill="#FBF3F0" stroke="#B5502A" stroke-width="1.3"/>
<text class="lb" x="600" y="304" text-anchor="middle" fill="#7E3318" font-size="10">16 实战走读</text>

<!-- 底部说明 -->
<rect x="30" y="344" width="620" height="100" rx="10" fill="#F6F4EC" stroke="#B9A15C" stroke-width="1.2"/>
<text class="th" x="340" y="368" text-anchor="middle" fill="#5C4A1E" font-size="12">怎么读</text>
<text class="ts" x="340" y="390" text-anchor="middle" fill="#5F5E5A">• 新手：严格按 M1→M2→M3 串行读，01-05 是地基，跳读会看不懂 06/07 的符号</text>
<text class="ts" x="340" y="408" text-anchor="middle" fill="#5F5E5A">• 老人复盘：每篇看「一图流」+ 自测题即可，不必重读正文；符号不清查系列「符号速查表」</text>
<text class="ts" x="340" y="426" text-anchor="middle" fill="#5F5E5A">• 主线：01→02→03→04→05→06→07→08→09→10→11→12→13→14→15→16（M3 后可并行读 12/13）</text>
</svg>
